/* ====================================================
   HERO ROTATION  (V2 – deck 3D colorido)
   ==================================================== */
const HERO = { editions:[], edIdx:0, hlIdx:0, edTimer:null, hlTimer:null, paused:false };

/* ── Helpers de dados ── */
function _heroEdHighlights(edIdx) {
  const ed = HERO.editions[edIdx];
  if (!ed) return [];
  const day = STATE.days[ed.date];
  return day?.highlights || ed.highlights || [];
}

function _heroFmtWeekDayDate(d) {
  if (!d) return '';
  const [y,m,day] = d.split('-').map(Number);
  const dt = new Date(y, m-1, day);
  const wd = ['DOM','SEG','TER','QUA','QUI','SEX','SÁB'];
  const mo = ['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];
  return wd[dt.getDay()] + ' · ' + day + ' ' + mo[m-1];
}

function _heroFmtShortDate(s) {
  if (!s) return '';
  const d = new Date(s);
  if (isNaN(d)) return s;
  const mo = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  return d.getDate() + ' ' + mo[d.getMonth()];
}

function _heroEdGradient(ed) {
  const cats = Object.entries(ed.counts_by_category||{})
    .sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k])=>CAT_COLORS[k]||'#0071e3');
  function toRgba(hex, a) {
    const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    return `rgba(${r},${g},${b},${a})`;
  }
  if (cats.length === 1) return `linear-gradient(145deg,rgba(0,0,0,0.52) 0%,${toRgba(cats[0],0.48)} 100%)`;
  if (cats.length === 2) return `linear-gradient(145deg,rgba(0,0,0,0.52) 0%,${toRgba(cats[0],0.48)} 55%,${toRgba(cats[1],0.4)} 100%)`;
  return `linear-gradient(145deg,rgba(0,0,0,0.52) 0%,${toRgba(cats[0],0.48)} 40%,${toRgba(cats[1],0.38)} 70%,${toRgba(cats[2],0.32)} 100%)`;
}

function _heroToolsFromTags(tags) {
  const known = new Set([...Object.keys(TOOL_LOGOS),...Object.keys(SI_FIXED),...Object.keys(SI_ADAPT)]);
  return (tags||[]).map(t=>t.toLowerCase()).filter(t=>known.has(t)).slice(0,3);
}

function _heroToolLogoHtml(t) {
  if (TOOL_LOGOS[t]) return `<img src="${TOOL_LOGOS[t]}" alt="${t}">`;
  if (SI_FIXED[t]) return `<img src="https://cdn.simpleicons.org/${SI_FIXED[t]}" alt="${t}">`;
  if (SI_ADAPT[t]) return `<img src="https://cdn.simpleicons.org/${SI_ADAPT[t][1]}" alt="${t}">`;
  return TOOL_EMOJI[t] ? `<span>${TOOL_EMOJI[t]}</span>` : '';
}

/* ── Paint: Edition card ── */
function _heroPaintEdition(idx, target) {
  const id = (target === 'back') ? 'hero-ed-back' : 'hero-ed-front';
  const el = document.getElementById(id);
  if (!el) return;
  const ed = HERO.editions[idx];
  if (!ed) return;

  const bg = _heroEdGradient(ed);
  el.style.background = bg;

  const wm    = String(idx+1).padStart(2,'0');
  const total = Object.values(ed.counts_by_category||{}).reduce((a,b)=>a+b,0);
  const catCt = Object.keys(ed.counts_by_category||{}).length;
  const toolCt= Object.keys(ed.counts_by_tool||{}).length;
  const eyebrow = _heroFmtWeekDayDate(ed.date) + ' · ' + total + ' NOTÍCIAS';
  const raw   = ed.hero_description || ed.hero_title || ed.date;
  const title = raw.length > 115 ? raw.slice(0,115)+'…' : raw;

  const hls = _heroEdHighlights(idx).slice(0,3);
  const hlRows = hls.map(h => {
    const icon = h.category_icon || '';
    const txt  = h.headline || h.title || '';

  }).join('');

  el.innerHTML = `

    <div class="hcv-eyebrow">● ${e(eyebrow)}</div>

    <div class="hcv-footer">
      <span class="hcv-pill">📰 Abrir edição →</span>
      <span class="hcv-source">${catCt} cats · ${toolCt} tools</span>

/* ── Paint: Highlight card ── */
function _heroPaintHighlight(idx, target) {
  const id = (target === 'back') ? 'hero-hl-back' : 'hero-hl-front';

  if (!el) return;
  const hls = _heroEdHighlights(HERO.edIdx);

    ${hl.urgent ? '<div class="hcv-badge-urgent">URGENTE</div>' : ''}
    <div class="hcv-eyebrow">● ${e(eyebrow)}</div>

    <div class="hcv-footer">

function heroGoEdition(idx) {
  HERO.edIdx = idx; HERO.hlIdx = 0;
  HERO.paused = true;
  clearTimeout(HERO._unpause);
  HERO._unpause = setTimeout(() => { HERO.paused = false; }, 5000);
  const nextEd = (idx+1) % HERO.editions.length;
  _heroSwap('hero-ed-front', () => {
    _heroPaintEdition(idx);
    _heroPaintEdition(nextEd, 'back');
    _heroUpdateDots('hero-ed-dots', HERO.editions.length, idx, 'heroGoEdition');
  });
  const hls = _heroEdHighlights(idx);
  _heroSwap('hero-hl-front', () => {
    _heroPaintHighlight(0);
    _heroPaintHighlight(1 % Math.max(1, hls.length), 'back');
    _heroUpdateDots('hero-hl-dots', hls.length, 0, 'heroGoHighlight');
  });
}

function heroGoHighlight(idx) {
  HERO.hlIdx = idx;
  HERO.paused = true;
  clearTimeout(HERO._unpause);
  HERO._unpause = setTimeout(() => { HERO.paused = false; }, 5000);
  const hls = _heroEdHighlights(HERO.edIdx);
  _heroSwap('hero-hl-front', () => {
    _heroPaintHighlight(idx);
    _heroPaintHighlight((idx+1) % Math.max(1, hls.length), 'back');
    _heroUpdateDots('hero-hl-dots', hls.length, idx, 'heroGoHighlight');
  });
}

function initHeroRotation() {
  if (HERO.edTimer) clearInterval(HERO.edTimer);
  if (HERO.hlTimer) clearInterval(HERO.hlTimer);
  HERO.paused = false; HERO.edIdx = 0; HERO.hlIdx = 0;
  if (!STATE.editions?.editions?.length) return;
  HERO.editions = STATE.editions.editions.slice(0, 5);
  if (!HERO.editions.length) return;

  const hls0 = _heroEdHighlights(0);
  _heroPaintEdition(0);
  _heroPaintEdition(1 % HERO.editions.length, 'back');
  _heroPaintHighlight(0);
  _heroPaintHighlight(1 % Math.max(1, hls0.length), 'back');
  _heroUpdateDots('hero-ed-dots', HERO.editions.length, 0, 'heroGoEdition');
  _heroUpdateDots('hero-hl-dots', hls0.length, 0, 'heroGoHighlight');

  if (window.matchMedia('(prefers-reduced-motion:reduce)').matches) return;

  HERO.edTimer = setInterval(() => {
    if (HERO.paused) return;
    HERO.edIdx = (HERO.edIdx+1) % HERO.editions.length;
    HERO.hlIdx = 0;
    const nextEd = (HERO.edIdx+1) % HERO.editions.length;
    const hlsCur = _heroEdHighlights(HERO.edIdx);
    _heroSwap('hero-ed-front', () => {
      _heroPaintEdition(HERO.edIdx);
      _heroPaintEdition(nextEd, 'back');
      _heroUpdateDots('hero-ed-dots', HERO.editions.length, HERO.edIdx, 'heroGoEdition');
    });
    _heroSwap('hero-hl-front', () => {
      _heroPaintHighlight(0);
      _heroPaintHighlight(1 % Math.max(1, hlsCur.length), 'back');
      _heroUpdateDots('hero-hl-dots', hlsCur.length, 0, 'heroGoHighlight');
    });
  }, 12000);

  HERO.hlTimer = setInterval(() => {
    if (HERO.paused) return;
    const hls = _heroEdHighlights(HERO.edIdx);
    if (hls.length < 2) return;
    HERO.hlIdx = (HERO.hlIdx+1) % hls.length;
    _heroSwap('hero-hl-front', () => {
      _heroPaintHighlight(HERO.hlIdx);
      _heroPaintHighlight((HERO.hlIdx+1) % hls.length, 'back');
      _heroUpdateDots('hero-hl-dots', hls.length, HERO.hlIdx, 'heroGoHighlight');
    });
  }, 4000);

  const edDeck = document.getElementById('hero-ed-deck');
  const hlDeck = document.getElementById('hero-hl-deck');
  [edDeck, hlDeck].forEach(d => {
    if (!d) return;
    d.addEventListener('mouseenter', () => HERO.paused = true);
    d.addEventListener('mouseleave', () => HERO.paused = false);
  });

  const edFront = document.getElementById('hero-ed-front');
  if (edFront) {
    edFront.addEventListener('click', ev => {
      if (ev.target.closest('.hero-deck-dot')) return;
      const ed = HERO.editions[HERO.edIdx];
      if (ed) nav('/day/' + ed.date);
    });
    edFront.addEventListener('keydown', ev => {
      if (ev.key==='ArrowRight'){ev.preventDefault();heroGoEdition((HERO.edIdx+1)%HERO.editions.length);}
      if (ev.key==='ArrowLeft') {ev.preventDefault();heroGoEdition((HERO.edIdx-1+HERO.editions.length)%HERO.editions.length);}
      if (ev.key==='Enter'||ev.key===' '){ev.preventDefault();nav('/day/'+HERO.editions[HERO.edIdx].date);}
    });
  }

  const hlFront = document.getElementById('hero-hl-front');
  if (hlFront) {
    hlFront.addEventListener('click', ev => {
      if (ev.target.closest('.hero-deck-dot')) return;
      const hl = _heroEdHighlights(HERO.edIdx)[HERO.hlIdx];
      if (hl?.url) window.open(hl.url, '_blank', 'noopener');
    });
    hlFront.addEventListener('keydown', ev => {
      const hls = _heroEdHighlights(HERO.edIdx);
      if (ev.key==='ArrowRight'){ev.preventDefault();heroGoHighlight((HERO.hlIdx+1)%hls.length);}
      if (ev.key==='ArrowLeft') {ev.preventDefault();heroGoHighlight((HERO.hlIdx-1+hls.length)%hls.length);}
      if (ev.key==='Enter'||ev.key===' '){ev.preventDefault();const hl=hls[HERO.hlIdx];if(hl?.url)window.open(hl.url,'_blank','noopener');}
    });
  }
}

/* ====================================================
   HOME CUBE SWIPER
   ==================================================== */
function initHomeCube() {
  const el = document.getElementById('home-cube');
  if (!el || typeof Swiper === 'undefined') return;

  // Mede o slide mais alto e equaliza — Swiper cube exige altura uniforme
  const slides = el.querySelectorAll('.swiper-slide');
  let maxH = 0;
  slides.forEach(s => { maxH = Math.max(maxH, s.scrollHeight); });
  if (maxH > 0) el.style.height = maxH + 'px';

  const sw = new Swiper(el, {
    effect: 'cube',
    grabCursor: false,
    loop: true,
    speed: 900,
    allowTouchMove: false,
    simulateTouch: false,
    cubeEffect: {
      shadow: false,
      slideShadows: false,
    },
    autoplay: {
      delay: 5500,
      pauseOnMouseEnter: false,
      disableOnInteraction: false,
    },
    pagination: {
      el: el.querySelector('.swiper-pagination'),
      clickable: true,
    },
    on: {
      slideChangeTransitionEnd(s) {
        if (s.autoplay && !s.autoplay.running) s.autoplay.start();
      },
    },
  });

  // Re-mede altura e atualiza Swiper ao redimensionar
  const _cubeResync = () => {
    el.style.height = '';
    let mh = 0;
    slides.forEach(s => { mh = Math.max(mh, s.scrollHeight); });
    if (mh > 0) el.style.height = mh + 'px';
    sw.update();
  };
  new ResizeObserver(_cubeResync).observe(el.parentElement || el);

  // Pausa só enquanto o mouse está dentro; resume ao sair (sem usar pauseOnMouseEnter, que tem bug com cube)
  el.addEventListener('mouseenter', () => sw.autoplay?.pause());
  el.addEventListener('mouseleave', () => sw.autoplay?.resume());

  el.addEventListener('click', e => {
    const slide = e.target.closest('.swiper-slide[data-date]');
    if (slide) nav('/day/' + slide.dataset.date);
  });
}

/* ====================================================
   HERO HIGHLIGHTS ROTATOR
   ==================================================== */
function initHeroHighlights() {
  const hlCards = document.getElementById('hl-cards-track');
  if (hlCards) {
    hlCards.addEventListener('wheel', e => {
      if (!e.shiftKey) return;
      e.preventDefault();
      hlCards.scrollLeft += e.deltaY;
    }, { passive: false });
  }

  const el = document.getElementById('home-hl-swiper');
  if (!el || typeof Swiper === 'undefined') return;
  const slides = el.querySelectorAll('.swiper-slide');
  if (slides.length < 2) return;

  const measure = () => {
    el.style.height = '';
    let mh = 0;
    slides.forEach(s => { mh = Math.max(mh, s.scrollHeight); });
    if (mh > 0) el.style.height = mh + 'px';
  };
  measure();

  const sw = new Swiper(el, {
    effect: 'cube',
    direction: 'vertical',
    loop: true,
    speed: 900,
    allowTouchMove: false,
    cubeEffect: { shadow: false, slideShadows: false },
    autoplay: { delay: 7500, disableOnInteraction: false },
  });

  el.addEventListener('mouseenter', () => sw.autoplay?.pause());
  el.addEventListener('mouseleave', () => sw.autoplay?.resume());

  new ResizeObserver(() => { measure(); sw.update(); })
    .observe(el.parentElement || el);

  const hlTrack = document.getElementById('hl-cards-track');
  if (hlTrack) {
    hlTrack.addEventListener('scroll', hlCardsUpdateNav, { passive: true });
    hlCardsUpdateNav();
  }
}

function hlCardsGo(dir) {
  const el = document.getElementById('hl-cards-track');
  if (!el) return;
  el.scrollBy({ left: dir * 270, behavior: 'smooth' });
  setTimeout(hlCardsUpdateNav, 380);
}

function hlCardsUpdateNav() {
  const el = document.getElementById('hl-cards-track');
  const prev = document.getElementById('hl-prev');
  const next = document.getElementById('hl-next');
  if (!el) return;
  if (prev) prev.disabled = el.scrollLeft < 8;
  if (next) next.disabled = el.scrollLeft + el.clientWidth >= el.scrollWidth - 8;
}

function homeScrollGo(id, dir) {
  const el = document.getElementById(id);
  if (!el) return;
  const step = id === 'home-hls-track' ? 292 : 234;
  el.scrollBy({ left: dir * step, behavior: 'smooth' });
}

  const _SVG_PREV = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>`;
  const _SVG_NEXT = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>`;

  // --- Destaques: edição mais recente — grid completo ---
  const _latestHlGrid = latestHls.map(h => {
    const paths = CAT_SVGS[h.category]||'';
    const color = CAT_COLORS[h.category]||'#888';
    const bdgIco = paths ? `<svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;opacity:.7">${paths}</svg>` : '';
    const badge = `<span class="cube-hl-cat-text" style="color:${color}">${bdgIco}${e(h.category_label||h.category)}</span>`;
    const isEditorial = h.image && !h.image.includes('google.com/s2/favicons') && !h.image.includes('simpleicons.org');
    const heroFb2 = _sourceImageUrl(h);
    const heroFb2Attrs = heroFb2 && heroFb2 !== h.image ? ` data-fallback-src="${e(heroFb2)}" data-add-class="is-source"` : '';
    const imgBanner = isEditorial ? `<div class="hero-hl-img-banner"><img src="${h.image}" alt="" loading="lazy"${heroFb2Attrs} data-hide-on-fail=".hero-hl-img-banner" onerror="_imgFallback(this)"></div>` : '';
    const summary = h.summary ? `<span class="hero-hl-summary">${e(h.summary)}</span>` : '';
    const hlClick = h.url ? `window.open('${h.url}','_blank','noopener')` : '';
    const hlMeta = _hlMetaHtml(h);
    return `<div class="hero-hl-card" style="--cat-color:${color}" onclick="${hlClick}">${imgBanner}<div class="hero-hl-body"><div class="cube-hl-body">${badge}${_freshnessBadge(h)}<span class="cube-hl-text">${e(h.headline)}</span></div>${summary}${_explainHtml(h)}${_learningHtml(h)}${hlMeta}</div></div>`;
  }).join('');

  // --- Destaques: edições anteriores — carrossel no formato hero-hl-card (sem summary) ---
  const _prevHlCards = _recentEds.slice(1).flatMap(ed =>
    (STATE.days[ed.date]?.highlights || []).slice(0, 3).map(h => {
      const paths = CAT_SVGS[h.category]||'';
      const color = CAT_COLORS[h.category]||'#888';
      const bdgIco = paths ? `<svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;opacity:.7">${paths}</svg>` : '';
      const badge = `<span class="cube-hl-cat-text" style="color:${color}">${bdgIco}${e(h.category_label||h.category)}</span>`;
      const isEditorial = h.image && !h.image.includes('google.com/s2/favicons') && !h.image.includes('simpleicons.org');
      const hlClick = h.url ? `window.open('${h.url}','_blank','noopener')` : '';
      const hlMeta = _hlMetaHtml(h, {withSave:false});
      if (isEditorial) {
        const prevFb = _sourceImageUrl(h);
        const prevFbAttrs = prevFb && prevFb !== h.image ? ` data-fallback-src="${e(prevFb)}" data-add-class="is-source"` : '';
        return `<div class="cube-hl-row" style="--cat-color:${color}" onclick="${hlClick}"><div class="cube-hli-media"><img src="${h.image}" alt="" loading="lazy"${prevFbAttrs} data-hide-on-fail=".cube-hli-media" onerror="_imgFallback(this)"></div><div class="cube-hli-content">${badge}<span class="cube-hl-text">${e(h.headline)}</span>${hlMeta}</div></div>`;
      }
      return `<div class="hero-hl-card" style="--cat-color:${color}" onclick="${hlClick}"><div class="hero-hl-body"><div class="cube-hl-body">${badge}<span class="cube-hl-text">${e(h.headline)}</span></div>${hlMeta}</div></div>`;
    })
  ).join('');

  const _hlSectionCard = (latestHls.length || _prevHlCards) ? `
  <section class="home-section home-section--hl" data-stagger>
    <div class="fav-card">
      <div class="eds-section-hd" style="margin-bottom:18px">
        <div class="eds-section-hd-text">
          <div class="home-sect-kicker">Curadoria</div>
          <h2 class="home-sect-title">Destaques da edição</h2>
        </div>

      ${_latestHlGrid ? `<div class="home-hls-latest-grid">${_latestHlGrid}</div>` : ''}
      ${_prevHlCards ? `<div class="eds-section-hd home-hls-prev-hd">
        <div class="eds-section-hd-text"><span class="home-sect-kicker">Edições anteriores</span></div>
        <div class="eds-nav" id="hls-nav">

  const _allYtSlides = _recentEds.flatMap(ed =>
    (STATE.days[ed.date]?.videos || []).map(v => {
      const dur = v.duration ? `<span class="yt-duration">${v.duration}</span>` : '';
      const sep = (v.channel && v.published_at) ? `<span class="yt-slide-sep">·</span>` : '';
      const date = v.published_at ? `<span class="yt-slide-date">${v.published_at.slice(0,7).split('-').reverse().join('/')}</span>` : '';
      const avatar = _ytAvatarHtml(v);
      return `<div class="yt-slide"><div class="yt-aspect" onclick="ytPlay(this,'${v.id}')"><img class="yt-thumb" src="https://img.youtube.com/vi/${v.id}/hqdefault.jpg" loading="lazy" alt=""><div class="yt-play-btn"></div>${dur}</div><div class="yt-slide-info"><div class="yt-slide-title">${e(v.title||'')}</div><div class="yt-slide-meta">${avatar}<span class="yt-slide-channel">${e(v.channel||'')}</span>${sep}${date}</div></div></div>`;
    })
  ).join('');

  const _ytSectionCard = _allYtSlides ? `
  <section class="home-section home-section--yt" data-stagger>
    <div class="fav-card">
      <div class="eds-section-hd">
        <div class="eds-section-hd-text">
          <div class="home-sect-kicker" style="color:var(--accent)">Vídeos</div>
        </div>
        <div class="eds-nav" id="vids-nav">
          <button class="eds-nav-btn" id="vids-prev" disabled onclick="vidsGo(vidsPage-1)" aria-label="Anterior">${_SVG_PREV}</button>
          <span class="eds-counter" id="vids-counter"></span>
          <button class="eds-nav-btn" id="vids-next" onclick="vidsGo(vidsPage+1)" aria-label="Próximo">${_SVG_NEXT}</button>
        </div>
      </div>
      <div class="eds-track-wrap"><div class="home-yt-track" id="vids-track">${_allYtSlides}</div></div>
      <div class="eds-dots" id="vids-dots"></div>
    </div>
  </section>` : '';

  return `<div class="home-hero">
    <div class="home-cube-swiper hero-cube-static is-editorial" data-stagger onclick="nav('/day/${latestDate}')">
      <div class="swiper-slide${isToday?' is-today':''}">
        <div class="ed-bg" aria-hidden="true"></div>
        <header class="ed-masthead">
          <div class="ed-masthead-l">
            <span class="ed-brand"><span class="ed-brand-csr">CSR</span><span class="ed-brand-news">NEWS</span></span>
            <span class="ed-issue">Edição Nº ${latestNum}</span>
          </div>
          ${isToday?`<div class="ed-masthead-r is-today"><span class="ed-live-dot" aria-hidden="true"></span><span>Edição de hoje</span></div>`:''}
        </header>

        <div class="ed-headline">
          <div class="ed-date">
            <span class="ed-date-wkd">${e(FULL_WKD[latestDt.getDay()])}</span>
            <span class="ed-date-num">${latestDt.getDate()}</span>
            <span class="ed-date-mon">${e(FULL_MON[latestDt.getMonth()])} · ${latestDt.getFullYear()}</span>
          </div>
          <div class="ed-title-wrap">
            <h2 class="ed-title">${e(latestEd?.hero_title||STATE.days[latestDate]?.hero_title||'')}</h2>
          </div>
        </div>

        <div class="ed-lede has-dropcap">${latestHeadline.split(/\n\n+/).map(p=>p.trim()).filter(Boolean).map(p=>`<p>${e(p)}</p>`).join('')}</div>

        ${(latestCatChipsHtml||latestToolsHtml)?`<div class="ed-tags">
          ${latestCatChipsHtml?`<div class="ed-tags-grp"><span class="ed-tags-lbl">Categorias</span><div class="ed-tags-row">${latestCatChipsHtml}</div></div>`:''}
          ${latestToolsHtml?`<div class="ed-tags-grp"><span class="ed-tags-lbl">Ferramentas</span><div class="ed-tags-row">${latestToolsHtml}</div></div>`:''}
        </div>`:''}

        <footer class="ed-foot">
          <button type="button" class="ed-cta">Ler edição <span class="ed-cta-arrow" aria-hidden="true">→</span></button>
          <div class="ed-foot-stats">
            <span class="ed-foot-stat"><b>${latestTotalNews}</b> notícias</span>
            <span class="ed-foot-sep" aria-hidden="true">·</span>
            <span class="ed-foot-stat"><b>${latestTotalTools}</b> ferramentas</span>
            <span class="ed-foot-sep" aria-hidden="true">·</span>
            <span class="ed-foot-stat"><b>${Object.keys(latestEd?.counts_by_category||{}).length}</b> categorias</span>
          </div>
        </footer>
      </div>
    </div>
  </div>
  ${_hlSectionCard}
  ${_ytSectionCard}
  ${_homeSections()}`;
}

/* ── Helper: seções abaixo do hero ── */

  const eds = STATE.editions?.editions || [];
  if (!eds.length) return '';

  const moreEds = eds.slice(0);

            <span class="eds-counter" id="eds-counter"></span>

  const _FILANG = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>`;
  const favHtml = `
  <section class="home-section" id="home-favorites" data-stagger>
    <div class="fav-card">
      <div class="eds-section-hd">
        <div class="eds-section-hd-text">

          Em breve — favoritos
        </span>
      </div>
    </div>
  </section>`;

  return favHtml + recentsHtml + catsHtml;
}

/* ====================================================
   DAY VIEW
   ==================================================== */
function renderDay(date) {
  const day = STATE.days[date];
  if (!day) return renderDayNotFound(date);

  // Filtra news que também aparecem como highlight para evitar duplicação visual
  const _hlUrlsForCounts = new Set((day.highlights||[]).map(h => h.url).filter(Boolean));
  const _newsForDisplay = (day.news||[]).filter(n => !_hlUrlsForCounts.has(n.url));
  const totalNews = _newsForDisplay.length;
  const totalTools = (day.tools||[]).length;
  const totalCats = new Set(_newsForDisplay.map(n=>n.category)).size;
  const dates = sortedDates();
  const idx = dates.indexOf(date);
  const prev = dates[idx+1];
  const next = dates[idx-1];
  const eds = STATE.editions?.editions || [];
  const edNum = eds.length - eds.findIndex(e=>e.date===date);
  const dt = new Date(date+'T00:00:00');
  const wkd = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'][dt.getDay()];
  const dayCatCounts = {};
  for (const n of _newsForDisplay) dayCatCounts[n.category] = (dayCatCounts[n.category] || 0) + 1;
  const dayCatOrder = Object.keys(CAT_COLORS);
  const dayCatEntries = Object.entries(dayCatCounts).sort((a,b)=>{
    const ia = dayCatOrder.indexOf(a[0]), ib = dayCatOrder.indexOf(b[0]);
    return (ia<0?99:ia) - (ib<0?99:ib);
  });
  let dayMapHtml = dayCatEntries.slice(0, 8).map(([cat, count]) => {
    const color = CAT_COLORS[cat] || '#888';
    const label = CAT_LABELS[cat] || cat;
    return `<button type="button" class="day-map-pill" style="--cc:${color}" title="${e(label)}" onclick="dayMapJump('${cat}')">${catIcon(cat, '📌', 14, true)}<span class="day-map-pill-name">${e(label)}</span><span class="day-map-count">${count}</span></button>`;
  }).join('');

  // Editorial-style header (mirrors home hero)
  const wkdShort = ['DOMINGO','SEGUNDA','TERÇA','QUARTA','QUINTA','SEXTA','SÁBADO'][dt.getDay()];
  const monShort = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'][dt.getMonth()];
  const dayNum = dt.getDate();
  const yearNum = dt.getFullYear();
  const isToday = (function(){ const t=new Date(); t.setHours(0,0,0,0); const dd=new Date(date+'T00:00:00'); dd.setHours(0,0,0,0); return t.getTime()===dd.getTime(); })();

  let h = `<section class="day-editorial-card is-editorial${isToday?' is-today':''}" data-stagger>
    <header class="ed-masthead">
      <div class="ed-masthead-l">
        <span class="ed-brand"><span class="ed-brand-csr">CSR</span><span class="ed-brand-news">NEWS</span></span>
        <span class="ed-issue">Edição Nº ${String(edNum).padStart(2,'0')}</span>
      </div>
      ${isToday?`<div class="ed-masthead-r is-today"><span class="ed-live-dot" aria-hidden="true"></span><span>Edição de hoje</span></div>`:''}
    </header>
    <div class="ed-headline">
      <div class="ed-date">
        <span class="ed-date-num">${dayNum}</span>
        <span class="ed-date-wkd">${wkdShort.slice(0,3)}</span>
        <span class="ed-date-mon">${monShort} · ${yearNum}</span>
      </div>
      <div class="ed-divider"></div>
      <div class="ed-title-wrap">
        <h1 class="ed-title">${e(day.hero_title||'Edição do dia')}</h1>
      </div>
    </div>
    ${(() => {
      const ledeRaw = day.edition_digest || day.hero_description || '';
      if (!ledeRaw) return '';
      const paras = ledeRaw.split(/\n\n+/).map(p=>p.trim()).filter(Boolean).map(p=>`<p>${e(p)}</p>`).join('');
      return `<div class="ed-lede has-dropcap">${paras}</div>`;
    })()}
    ${dayMapHtml ? `<div class="day-map-row"><span class="day-map-label">Mapa</span><div class="day-map-pills">${dayMapHtml}</div></div>` : ''}
    <footer class="ed-foot">
      <button type="button" class="ed-cta" onclick="nav('/')"><span class="ed-cta-arrow" aria-hidden="true">←</span> Voltar à home</button>
      <div class="ed-foot-stats">
        <span class="ed-foot-stat"><b>${totalNews}</b> notícias</span>
        <span class="ed-foot-sep">·</span>
        <span class="ed-foot-stat"><b>${totalTools}</b> ferramentas</span>
        <span class="ed-foot-sep">·</span>
        <span class="ed-foot-stat"><b>${totalCats}</b> categorias</span>
      </div>
    </footer>
  </section>
  <div class="day-content" data-explain-root>`;

  // Highlights — panel like home
  if (day.highlights?.length) {
    h += `<section class="home-section day-section--hl" data-stagger>
      <div class="fav-card day-hl-panel">
        <div class="eds-section-hd">
          <div class="eds-section-hd-text">
            <div class="home-sect-kicker">Curadoria</div>
            <h2 class="home-sect-title">Destaques da edição</h2>
          </div>
        </div>
        <div class="day-hl-grid home-hls-latest-grid">`;
    for (const item of day.highlights) {
      const cc = CAT_COLORS[item.category]||'#888';
      const paths = CAT_SVGS[item.category]||'';
      const bdgIco = paths ? `<svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="${cc}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;opacity:.7">${paths}</svg>` : '';
      const badge = `<span class="cube-hl-cat-text" style="color:${cc}">${bdgIco}${e(item.category_label||item.category)}</span>`;
      const imgInfo = _contentImageInfo(item);
      const dayFb = imgInfo?.kind === 'photo' ? _sourceImageUrl(item) : '';
      const dayFbAttrs = dayFb && dayFb !== imgInfo?.url ? ` data-fallback-src="${e(dayFb)}" data-add-class="is-source"` : '';
      const imgBanner = imgInfo?.kind === 'photo'
        ? `<div class="hero-hl-img-banner"><img src="${e(imgInfo.url)}" alt="" loading="lazy"${dayFbAttrs} data-hide-on-fail=".hero-hl-img-banner" onerror="_imgFallback(this)"></div>`
        : '';
      const summary = item.summary ? `<span class="hero-hl-summary">${e(item.summary)}</span>` : '';
      const hlClick = item.url ? `window.open('${item.url}','_blank','noopener')` : '';
      const hlMeta = _hlMetaHtml(item);
      h += `<article class="hero-hl-card" style="--cat-color:${cc}" onclick="${hlClick}">
        ${imgBanner}
        <div class="hero-hl-body">
          <div class="cube-hl-body">${badge}${_freshnessBadge(item)}<span class="cube-hl-text">${e(item.headline)}</span></div>
          ${summary}
          ${_explainHtml(item)}
          ${_learningHtml(item)}
          ${hlMeta}
        </div>
      </article>`;
    }
    h += `</div></div></section>`;
  }

  // (Digest removed — now lives inside the editorial header as lede)

  // Videos — panel like home
  const _dayVids = day.videos || [];
  if (_dayVids.length) {
    const _daySlides = _dayVids.map((v, i) => {
      const dur = v.duration ? `<span class="yt-duration">${v.duration}</span>` : '';
      const sep = (v.channel && v.published_at) ? `<span class="yt-slide-sep">·</span>` : '';
      const vdate = v.published_at ? `<span class="yt-slide-date">${v.published_at.slice(0,7).split('-').reverse().join('/')}</span>` : `<span class="yt-slide-date" id="yt-date-${i}"></span>`;
      const avatar = _ytAvatarHtml(v);
      return `<div class="yt-slide"><div class="yt-aspect" onclick="ytPlay(this,'${v.id}')"><img class="yt-thumb" src="https://img.youtube.com/vi/${v.id}/hqdefault.jpg" loading="lazy" alt=""><div class="yt-play-btn"></div>${dur}</div><div class="yt-slide-info"><div class="yt-slide-title" id="yt-title-${i}">${v.title||''}</div><div class="yt-slide-meta">${avatar}<span class="yt-slide-channel" id="yt-channel-${i}">${v.channel||''}</span>${sep}${vdate}</div></div></div>`;
    }).join('');
    const _SVG_PREV = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>`;
    const _SVG_NEXT = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>`;
    h += `<section class="home-section day-section--yt home-section--yt" data-stagger>
      <div class="fav-card">
        <div class="eds-section-hd">
          <div class="eds-section-hd-text">
            <div class="home-sect-kicker" style="color:var(--accent)">Vídeos</div>
          </div>
          <div class="eds-nav" id="vids-nav">
            <button class="eds-nav-btn" id="vids-prev" disabled onclick="vidsGo(vidsPage-1)" aria-label="Anterior">${_SVG_PREV}</button>
            <span class="eds-counter" id="vids-counter"></span>
            <button class="eds-nav-btn" id="vids-next" onclick="vidsGo(vidsPage+1)" aria-label="Próximo">${_SVG_NEXT}</button>
          </div>
        </div>
        <div class="eds-track-wrap"><div class="home-yt-track" id="vids-track">${_daySlides}</div></div>
        <div class="eds-dots" id="vids-dots"></div>
      </div>
    </section>`;
  }

  // Tools — moved BEFORE news
  if (day.tools?.length) {
    h += `<section class="home-section day-section--tools" data-stagger>
      <div class="fav-card day-tools-panel" id="day-tools-section">
        <div class="eds-section-hd">
          <div class="eds-section-hd-text">
            <div class="home-sect-kicker">Releases</div>
            <h2 class="home-sect-title">Ferramentas & Linguagens</h2>
          </div>
          <span class="section-meta">${day.tools.length} ${day.tools.length===1?'atualização':'atualizações'}</span>
        </div>
        <div class="tools-grid day-tools-grid">`;
    for (const t of day.tools) {
      const color = TOOL_COLORS[t.tool_key]||'#888';
      const isL = LANGS.includes(t.tool_key);
      const tgt = isL ? `/lang/${t.tool_key}` : `/tool/${t.tool_key}`;
      const tForSave = { ...t, _date: day.date, _kind: 'tool' };
      h += `<div class="tool-card" data-stagger style="--tc:${color}" onclick="nav('${tgt}')">
        <div class="tc-head">
          <div class="tc-icon" style="--tc:${color}">${toolIcon(t.tool_key,22)}</div>
          <div class="tc-body">
            <div class="tc-name">${e(t.name)}</div>
            <div class="tc-ver">${t.version?e(t.version)+' · ':''}${t.kind==='release'?'🚀 Release':'📰 News'}</div>
          </div>
        </div>
        <div class="tc-hl">${e(t.headline||'')}</div>
        <span class="tc-save">${_rlBtn(tForSave, 'tool')}</span>
      </div>`;
    }
    h += `</div></div></section>`;
  }

  // News — filter pills + flat masonry, no per-cat wrappers
  // Ordem alfabética por label da categoria (mesma do sidebar lateral)
  // Filtra duplicatas: itens cuja URL já é highlight não aparecem em news (evita mesmo card 2x na tela)
  const _catLbl = c => CAT_LABELS[c] || c || '';
  const _hlUrls = new Set((day.highlights||[]).map(h => h.url).filter(Boolean));
  const allNews = (day.news||[]).filter(n => !_hlUrls.has(n.url)).slice().sort((a,b)=>{
    const c = _catLbl(a.category).localeCompare(_catLbl(b.category), 'pt', { sensitivity: 'base' });
    if (c !== 0) return c;
    return (b.urgent?1:0)-(a.urgent?1:0) || new Date(b.published_at||b._date)-new Date(a.published_at||a._date);
  });
  const bycat = {};
  for (const n of allNews) (bycat[n.category]||(bycat[n.category]=[])).push(n);
  const sortedCats = Object.keys(bycat).sort((a,b) => _catLbl(a).localeCompare(_catLbl(b), 'pt', { sensitivity: 'base' }));

  if (allNews.length) {
    const filterPills = sortedCats.map(cat => {
      const items = bycat[cat];
      const color = CAT_COLORS[cat]||'#888';
      const fi = items[0];
      const label = e(fi.category_label||cat);
      return `<button type="button" class="day-news-filter" data-cat="${cat}" style="--cc:${color}" onclick="dayFilterNews('${cat}',this)">${catIcon(cat,fi.category_icon||'📌',14,true)} ${label} <span class="day-news-filter-count">${items.length}</span></button>`;
    }).join('');

    h += `<section class="home-section day-section--news" data-stagger>
      <div class="fav-card day-news-panel">
        <div class="eds-section-hd">
          <div class="eds-section-hd-text">
            <div class="home-sect-kicker">Notícias</div>
            <h2 class="home-sect-title">Todas as notícias</h2>
          </div>
          <span class="section-meta">${totalNews} ${totalNews===1?'item':'itens'}</span>
        </div>
        <div class="day-news-filters">
          <button type="button" class="day-news-filter is-active" data-cat="__all" onclick="dayFilterNews('__all',this)">Todas <span class="day-news-filter-count">${totalNews}</span></button>
          ${filterPills}
        </div>
        <div class="day-news-grid" id="day-news-grid">`;
    for (const item of allNews) {
      const color = CAT_COLORS[item.category]||'#888';
      h += `<div class="day-news-item" data-cat="${item.category}" style="--cc:${color}">${newsCard(item, color)}</div>`;
    }
    h += `</div></div></section>`;
  }

  // Day nav (cards)
  const prevDay = prev ? STATE.days[prev] : null;
  const nextDay = next ? STATE.days[next] : null;
  const prevNum = prev ? eds.length - eds.findIndex(e=>e.date===prev) : 0;
  const nextNum = next ? eds.length - eds.findIndex(e=>e.date===next) : 0;
  const fmtShort = d => {
    if (!d) return '';
    const dd = new Date(d+'T00:00:00');
    return ['DOM','SEG','TER','QUA','QUI','SEX','SÁB'][dd.getDay()] + ' ' + String(dd.getDate()).padStart(2,'0') + '.' + String(dd.getMonth()+1).padStart(2,'0');
  };
  h += `<nav class="day-pager" data-stagger>
    ${prev?`<button class="day-pager-card prev" onclick="nav('/day/${prev}')">
      <span class="day-pager-arr">←</span>
      <div class="day-pager-body">
        <div class="day-pager-lbl">Edição anterior</div>
        <div class="day-pager-meta">Nº ${String(prevNum).padStart(2,'0')} · ${fmtShort(prev)}</div>
        <div class="day-pager-title">${e(prevDay?.hero_title||'Edição anterior')}</div>
      </div>
    </button>`:'<span></span>'}
    ${next?`<button class="day-pager-card next" onclick="nav('/day/${next}')">
      <div class="day-pager-body">
        <div class="day-pager-lbl">Próxima edição</div>
        <div class="day-pager-meta">Nº ${String(nextNum).padStart(2,'0')} · ${fmtShort(next)}</div>
        <div class="day-pager-title">${e(nextDay?.hero_title||'Próxima edição')}</div>
      </div>
      <span class="day-pager-arr">→</span>
    </button>`:'<span></span>'}
  </nav>`;

  h += `</div>`; // .day-content
  return h;
}

   CATEGORY PAGE
   ==================================================== */
function renderSources() {
  const all = Object.values(STATE.sources).sort((a,b)=>a.name.localeCompare(b.name,'pt'));
  const total = all.length;
  const cards = all.map(s => {
    const imgUrl = (isDark() && s.image_dark) ? s.image_dark : s.image;
    const domain = (s.url||'').replace(/^https?:\/\//,'').replace(/\/.*$/,'');
    const img = imgUrl
      ? `<img src="${imgUrl}" alt="" onerror="this.parentNode.innerHTML='<svg width=\\'20\\' height=\\'20\\' viewBox=\\'0 0 24 24\\' fill=\\'none\\' stroke=\\'currentColor\\' stroke-width=\\'1.5\\'><circle cx=\\'12\\' cy=\\'12\\' r=\\'10\\'/><path d=\\'M2 12h20\\'/><path d=\\'M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z\\'/></svg>'">`
      : `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>`;
    return `<a class="source-card" href="${e(s.url||'#')}" target="_blank" rel="noopener noreferrer" data-name="${e(s.name.toLowerCase())}" data-url="${e(domain.toLowerCase())}">
      <div class="source-card-ico">${img}</div>
      <div class="source-card-name">${e(s.name)}</div>
      <div class="source-card-url">${e(domain)}</div>
    </a>`;
  }).join('');
  return `<div class="sources-page">
    <div class="sources-page-hdr">
      <div class="sources-page-title">Fontes</div>
      <div class="sources-page-sub">${total} fontes de conteúdo curadas</div>
      <div class="sources-search-wrap">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input class="sources-search" type="text" placeholder="Filtrar fontes…" oninput="_filterSources(this.value)" autocomplete="off" spellcheck="false">
      </div>
    </div>
    <div class="sources-grid" id="sources-grid">${cards}</div>
  </div>`;
}
function _filterSources(q) {
  const lq = q.trim().toLowerCase();
  let vis = 0;
  document.querySelectorAll('#sources-grid .source-card').forEach(el => {
    const match = !lq || el.dataset.name.includes(lq) || el.dataset.url.includes(lq);
    el.style.display = match ? '' : 'none';
    if (match) vis++;
  });
  let empty = document.getElementById('sources-empty');
  if (!vis && lq) {
    if (!empty) {
      empty = document.createElement('div');
      empty.id = 'sources-empty';
      empty.className = 'sources-empty';
      document.getElementById('sources-grid').appendChild(empty);
    }
    empty.textContent = `Nenhuma fonte encontrada para "${q}"`;
  } else if (empty) empty.remove();
}

function renderQuotes() {
  const all = (STATE.quotes || []).slice().sort((a,b)=>a.author.localeCompare(b.author,'pt'));
  const total = all.length;
  const cards = all.map(q => {
    const ico = _quoteIconUrl(q.url);
    const icoEl = ico
      ? `<img class="quote-pg-ico" src="${e(ico)}" alt="" onerror="this.style.display='none'">`
      : '';
    const ctxEl = q.url
      ? `<a class="quote-pg-ctx" href="${e(q.url)}" target="_blank" rel="noopener noreferrer">${icoEl}<span>${e(q.context||'')}</span><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg></a>`
      : (q.context ? `<span class="quote-pg-ctx no-link">${e(q.context)}</span>` : '');
    return `<div class="quote-pg-card" data-text="${e((q.text||'').toLowerCase())}" data-author="${e((q.author||'').toLowerCase())}">
      <div class="quote-pg-text">${e(q.text||'')}</div>
      <div class="quote-pg-meta">
        <span class="quote-pg-author">${e(q.author||'')}</span>
        ${ctxEl}
      </div>
    </div>`;
  }).join('');
  return `<div class="quotes-page">
    <div class="quotes-page-hdr">
      <div class="quotes-page-title">Citações</div>
      <div class="quotes-page-sub">${total} frases curadas</div>
      <div class="sources-search-wrap">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input class="sources-search" type="text" placeholder="Filtrar citações…" oninput="_filterQuotes(this.value)" autocomplete="off" spellcheck="false">
      </div>
    </div>
    <div class="quotes-grid" id="quotes-grid">${cards}</div>
  </div>`;
}
function _filterQuotes(q) {
  const lq = q.trim().toLowerCase();
  let vis = 0;
  document.querySelectorAll('#quotes-grid .quote-pg-card').forEach(el => {
    const match = !lq || el.dataset.text.includes(lq) || el.dataset.author.includes(lq);
    el.style.display = match ? '' : 'none';
    if (match) vis++;
  });
  let empty = document.getElementById('quotes-empty');
  if (!vis && lq) {
    if (!empty) {
      empty = document.createElement('div');
      empty.id = 'quotes-empty';
      empty.className = 'quotes-empty';
      document.getElementById('quotes-grid').appendChild(empty);
    }
    empty.textContent = `Nenhuma citação encontrada para "${q}"`;
  } else if (empty) empty.remove();
}

function renderCat(slug) {
  const isKnown = !!CAT_LABELS[slug];
  const info    = getCatInfo(slug);
  const color   = CAT_COLORS[slug] || '#888';
  const items   = getAllNews(n => n.category === slug);

  if (!items.length) {
    if (!isKnown) return _entityPage(
      _unknownIcon(),
      `"${e(slug)}" não encontrado`,
      'Esta categoria não existe no CSR News.',
      _suggestCats(slug)
    );
    return _entityPage(
      catIcon(slug, info.icon, 40),
      'Nenhum conteúdo ainda',
      `Ainda não há notícias em <strong>${e(info.label)}</strong> nas edições carregadas.`
    );
  }

  // Top tools nessa categoria
  const toolCount = {};
  items.forEach(it => (it.tags||[]).forEach(t => {
    const k = t.toLowerCase();
    if (TOOL_NAMES[k]) toolCount[k] = (toolCount[k]||0)+1;
  }));
  const topTools = Object.entries(toolCount).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const dateSet = new Set(items.map(i=>i._date));

  let h = `<div class="ent-hero" data-stagger style="--tc:${color}">
    <div class="ent-hero-bg"></div>
    <div class="ent-hero-content">
      <div class="ent-hero-eyebrow">
        <span class="ent-hero-pill">CATEGORIA</span>
        <span class="ent-hero-sep">·</span>
        <span>${items.length} ${items.length===1?'notícia':'notícias'}</span>
        <span class="ent-hero-sep">·</span>
        <span>${dateSet.size} ${dateSet.size===1?'edição':'edições'}</span>
      </div>
      <div class="ent-hero-row">
        <div class="ent-hero-icon">${catIcon(slug,info.icon,42)}</div>
        <h1 class="ent-hero-name">${e(info.label)}</h1>
      </div>
      ${info.description ? `<p class="ent-hero-desc">${e(info.description)}</p>` : ''}
      ${topTools.length ? `<div class="ent-hero-tools">
        <span class="ent-hero-tools-lbl">Ferramentas em destaque</span>
        ${topTools.map(([t,n])=>{
          const tc = TOOL_COLORS[t]||'#888';
          const isL = LANGS.includes(t);
          return `<button class="ent-tool-chip" style="--tc:${tc}" onclick="event.stopPropagation();nav('${isL?'/lang':'/tool'}/${t}')">
            ${toolIcon(t,14)} <span>${e(getToolName(t))}</span> <b>${n}</b>
          </button>`;
        }).join('')}
      </div>` : ''}
    </div>
  </div>`;

  return h + _groupedTimeline(items, color);
}

/* ====================================================
   LANGUAGE / TOOL PAGE
   ==================================================== */
function renderEntity(slug, kind) {
  const isKnown  = !!TOOL_NAMES[slug];
  const color    = TOOL_COLORS[slug] || '#888';
  const name     = getToolName(slug);
  const items    = getAllToolItems(slug);
  const kindLabel = kind === 'lang' ? 'LINGUAGEM' : 'FERRAMENTA';

  if (!items.length) {
    if (!isKnown) return _entityPage(
      _unknownIcon(),
      `"${e(slug)}" não encontrado`,
      `Esta ${kind==='lang'?'linguagem':'ferramenta'} não existe no CSR News.`,
      _suggestEntities(slug, kind)
    );
    return _entityPage(
      toolIcon(slug, 40),
      'Nenhum conteúdo ainda',
      `Ainda não há entradas sobre <strong>${e(name)}</strong> nas edições carregadas.`
    );
  }

  // Última versão (release)
  const releases = items.filter(i => i.kind === 'release' || i.version);
  const latestVersion = releases[0]?.version;
  // Categorias relacionadas
  const catCount = {};
  items.forEach(it => (it.categories||[it.category]).forEach(c => {
    if (c && CAT_LABELS[c]) catCount[c] = (catCount[c]||0)+1;
  }));
  const topCats = Object.entries(catCount).sort((a,b)=>b[1]-a[1]).slice(0,4);
  const dateSet = new Set(items.map(i=>i._date));

  let h = `<div class="ent-hero" data-stagger style="--tc:${color}">
    <div class="ent-hero-bg"></div>
    <div class="ent-hero-content">
      <div class="ent-hero-eyebrow">
        <span class="ent-hero-pill">${kindLabel}</span>
        <span class="ent-hero-sep">·</span>
        <span>${items.length} ${items.length===1?'entrada':'entradas'}</span>
        ${releases.length?`<span class="ent-hero-sep">·</span><span>${releases.length} release${releases.length===1?'':'s'}</span>`:''}
        <span class="ent-hero-sep">·</span>
        <span>${dateSet.size} ${dateSet.size===1?'edição':'edições'}</span>
      </div>
      <div class="ent-hero-row">
        <div class="ent-hero-icon big">${toolIcon(slug,52)}</div>
        <div class="ent-hero-name-block">
          <h1 class="ent-hero-name">${e(name)}</h1>
          ${latestVersion?`<span class="ent-hero-version">Última versão: <b>${e(latestVersion)}</b></span>`:''}
        </div>
      </div>
      ${topCats.length ? `<div class="ent-hero-tools">
        <span class="ent-hero-tools-lbl">Em categorias</span>
        ${topCats.map(([c,n])=>{
          const cc = CAT_COLORS[c]||'#888';
          return `<button class="ent-tool-chip" style="--tc:${cc}" onclick="event.stopPropagation();nav('/cat/${c}')">
            ${catIcon(c,'📌',14,true)} <span>${e(CAT_LABELS[c]||c)}</span> <b>${n}</b>
          </button>`;
        }).join('')}
      </div>` : ''}
    </div>
  </div>`;

  // Releases em destaque (apenas para tools com 2+ releases)
  if (kind === 'tool' && releases.length >= 2) {
    h += `<div class="rel-section" data-stagger>
      <div class="home-sect-kicker">Histórico</div>
      <h2 class="rel-section-title">Releases recentes</h2>
      <div class="rel-grid">
        ${releases.slice(0,6).map(r=>{
          const d = new Date((r.published_at||r._date+'T12:00:00').replace('Z',''));
          const dd = String(d.getDate()).padStart(2,'0');
          const mm = MONTHS_SHORT[d.getMonth()];
          return `<div class="rel-card" style="--tc:${color}">
            <div class="rel-card-ver">${e(r.version||'release')}</div>
            <div class="rel-card-date">${dd} ${mm}</div>

/* Masonry: distribui .day-news-item em N colunas (round-robin) preservando ordem.
   Cada coluna é um flex column independente — abrir/fechar o explain de um card só
   empurra os irmãos abaixo dele na mesma coluna, sem rebalancear as demais. */
function layoutDayNewsMasonry() {
  document.querySelectorAll('.day-news-grid').forEach(grid => {
    const visibleItems = [];
    const allItems = [];
    grid.querySelectorAll('.day-news-item').forEach(it => {
      allItems.push(it);
      if (it.style.display !== 'none') visibleItems.push(it);
    });
    if (!allItems.length) return;
    const minColW = 320, gap = 16;
    const w = grid.clientWidth || grid.parentElement?.clientWidth || 0;
    const cols = Math.max(1, Math.min(allItems.length, Math.floor((w + gap) / (minColW + gap)) || 1));
    const existing = [...grid.querySelectorAll(':scope > .day-news-col')];
    const sameCols = existing.length === cols && existing.every(c => c.classList.contains('day-news-col'));
    let colEls;
    if (sameCols) {
      colEls = existing;
      colEls.forEach(c => { while (c.firstChild) c.removeChild(c.firstChild); });
    } else {
      grid.innerHTML = '';
      colEls = [];
      for (let i = 0; i < cols; i++) {
        const c = document.createElement('div');
        c.className = 'day-news-col';
        grid.appendChild(c);
        colEls.push(c);
      }
    }
    allItems.forEach((it, idx) => colEls[idx % cols].appendChild(it));
  });
}

/**
 * Fallback inteligente para <img> em cards.
 * 1ª falha: troca src para data-fallback-src (ícone da fonte) e troca classe do wrapper
 *           (data-swap-from → data-swap-to) para o visual de placeholder centrado.
 * 2ª falha (ou sem fallback): esconde o ancestral indicado por data-hide-on-fail (ou o próprio <img>).
 */
function _imgFallback(img) {
  if (img.dataset.imgFallbackTried) {
    _imgFallbackHide(img);
    return;
  }
  const fb = img.dataset.fallbackSrc;
  if (!fb || img.src === fb) {
    _imgFallbackHide(img);
    return;
  }
  img.dataset.imgFallbackTried = '1';
  const target = img.parentElement;
  const from = img.dataset.swapFrom;
  const to = img.dataset.swapTo;
  const addCls = img.dataset.addClass;
  if (target) {
    if (from && to) {
      target.classList.remove(from);
      target.classList.add(to);
    }
    if (addCls) target.classList.add(addCls);
  }
  img.src = fb;
}

function _imgFallbackHide(img) {
  const sel = img.dataset.hideOnFail;
  const wrap = sel ? img.closest(sel) : img;
  if (!wrap) return;
  wrap.style.display = 'none';
  if (sel === '.nc-media' && wrap.parentElement) {
    wrap.parentElement.classList.remove('has-cover');
  }
}

/* ── Helper: timeline agrupada por data ── */
function _groupedTimeline(items, color, opts = {}) {
  const hasExplain = items.some(it => it.explain);
  // Group by _date desc (já vem ordenado de getAllNews/getAllToolItems)
  const groups = {};
  for (const it of items) {
    (groups[it._date]||(groups[it._date]=[])).push(it);
  }
  const dates = Object.keys(groups).sort((a,b)=>b.localeCompare(a));
  const toggleBtn = hasExplain
    ? `<button class="tl-explain-toggle" onclick="toggleExplains(this)" aria-expanded="false"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg><span class="tl-explain-toggle-lbl">Ver explicações</span></button>`
    : '';
  let h = `<div class="tl-list-grouped" data-explain-root data-explain-closed>
    ${toggleBtn}`;
  for (const date of dates) {
    const d = new Date(date+'T00:00:00');
    const wkd = ['DOM','SEG','TER','QUA','QUI','SEX','SÁB'][d.getDay()];
    const dd = String(d.getDate()).padStart(2,'0');
    const mm = MONTHS_SHORT[d.getMonth()];
    const yy = d.getFullYear();
    h += `<div class="tl-date-hdr" data-stagger>
      <button class="tl-date-link" onclick="nav('/day/${date}')">
        <span class="tl-dh-num">${dd}</span>
        <span class="tl-dh-mon">${mm}</span>
        <span class="tl-dh-meta"><span class="tl-dh-wkd">${wkd} · ${yy}</span><span class="tl-dh-count">${groups[date].length} ${groups[date].length===1?'item':'itens'}</span></span>
        <span class="tl-dh-arr">→</span>
      </button>
    </div>
    <div class="tl-day-items">`;
    for (const item of groups[date]) h += tlItemSimple(item, color, opts);
    h += `</div>`;
  }
  return h + `</div>`;
}

function _suggestCats(slug) {

    .filter(([k,v]) => k.includes(norm) || v.toLowerCase().includes(norm) || norm.includes(k))
    .slice(0,4);

    matches = Object.entries(totals).sort((a,b)=>b[1]-a[1]).slice(0,4)

function _suggestEntities(slug, kind) {
  const norm = slug.toLowerCase();

    .filter(k => k.includes(norm) || (TOOL_NAMES[k]||'').toLowerCase().includes(norm) || norm.includes(k))

function formatItemDate(value) {
  if (!value) return '';
  const d = new Date(String(value).replace(' ', 'T'));
  if (Number.isNaN(d.getTime())) return '';
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const hasTime = /T\d{2}:\d{2}/.test(String(value));
  const hh = String(d.getHours()).padStart(2,'0');
  const mi = String(d.getMinutes()).padStart(2,'0');
  return hasTime ? `${dd}/${mm} ${hh}:${mi}` : `${dd}/${mm}`;
}

function newsCard(item, color, opts = {}) {
  const lc = color||'var(--border)';
  const tags = (item.tags||[]).slice(0,5);
  const urg = item.urgent;
  const source = srcBadge(item);
  const pubDate = formatItemDate(opts.dateValue || item.published_at || item._date);
  const media = _newsImageHtml(item);
  const categoryLabel = item.category_label || CAT_LABELS[item.category] || item.category || '';

function renderDayNotFound(date) {
  let fmtDate = date;
  try {
    const [y, m, d] = date.split('-').map(Number);
    const wd = WEEKDAYS_PT_SHORT[new Date(y, m-1, d).getDay()];
    const mn = MONTHS_PT[m-1].toLowerCase();
    fmtDate = `${wd}, ${d} de ${mn} de ${y}`;
  } catch(_) {}
  const latest = sortedDates()[0];
  const isToday = date === getTodayStr();
  const title  = isToday ? 'Nenhuma edição hoje' : 'Nenhuma edição neste dia';
  const sub    = isToday
    ? 'Ainda não há edição do CSR News publicada para hoje.'
    : 'Não há edição do CSR News publicada nesta data.';

  // Card da última edição como sugestão
  let nearestCard = '';
  if (latest && latest !== date) {
    const ld = STATE.days[latest];
    const dt = new Date(latest+'T00:00:00');
    const wkd = ['DOM','SEG','TER','QUA','QUI','SEX','SÁB'][dt.getDay()];
    const dd = String(dt.getDate()).padStart(2,'0');
    const mm = String(dt.getMonth()+1).padStart(2,'0');
    const eds = STATE.editions?.editions || [];
    const num = String(eds.length - eds.findIndex(x=>x.date===latest)).padStart(2,'0');
    nearestCard = `<div class="nf-suggest-card" onclick="nav('/day/${latest}')">

      <div class="nf-sc-title">${e(ld?.hero_title||'Ver edição')}</div>

  }

    <div class="day-nf-tag">${e(fmtDate)}</div>

/* ====================================================
   MAIN RENDER
   ==================================================== */
function renderAll({ preserveScroll = false } = {}) {
  const {view, slug} = _state;
  document.body.dataset.view = view;

  // Sync calendar selection
  if (view==='day' && slug) {
    const d = new Date(slug);
    _calYear = d.getFullYear();
    _calMonth = d.getMonth();
  }

  renderSidebar();
  renderCalBar();
  renderCalendar();
  renderQuote();
  renderNavToday();

  // Nav active
  document.querySelectorAll('.nav-link').forEach(el=>el.classList.remove('active'));
  if (view==='home') document.querySelector('[data-v="home"]')?.classList.add('active');
  const _sbtn = document.getElementById('btn-sources');
  if (_sbtn) _sbtn.classList.toggle('active', view==='sources');
  const _qbtn = document.getElementById('btn-quotes');
  if (_qbtn) _qbtn.classList.toggle('active', view==='quotes');

  // Build content
  let content;
  if (!STATE.ready.editions) {
    content = view === 'day' ? daySkeleton() : homeSkeleton();
  } else {
    switch(view) {
      case 'home': content = STATE.ready.currentDay ? renderHome() : homeSkeleton(); break;
      case 'day':  content = STATE.days[slug] ? renderDay(slug) : STATE.notFound.has(slug) ? renderDayNotFound(slug) : daySkeleton(); break;
      case 'sources': content = renderSources(); break;
      case 'quotes':  content = renderQuotes(); break;
      case 'cat':  content = renderCat(slug); break;
      case 'lang': content = renderEntity(slug,'lang'); break;
      case 'tool': content = renderEntity(slug,'tool'); break;
      case 'saved':      content = renderSaved(); break;
      case 'read-later': content = renderSaved(); break;
      default:     content = STATE.ready.currentDay ? renderHome() : homeSkeleton();
    }
  }

  const main = document.getElementById('main');
  const hadContent = main && main.innerHTML.trim().length > 0;

  /* Scroll alvo agora é o body/window (sem scroll interno em #main) */
  const savedScroll = window.scrollY || 0;
  const applyContent = () => {
    if (!main) return;
    main.classList.remove('route-exit');
    // V4: tirar qbar-host de main antes do innerHTML wipe (se já estiver lá)
    const _qhostPrev = document.getElementById('quote-bar-host');
    const _qstash = document.getElementById('qbar-stash');
    if (_qhostPrev && _qstash && _qhostPrev.parentElement !== _qstash) {
      _qstash.appendChild(_qhostPrev);
    }
    main.innerHTML = content;
    // Agora move de volta para o topo de main
    const _qhost = document.getElementById('quote-bar-host');
    if (_qhost) main.insertBefore(_qhost, main.firstChild);
    if (preserveScroll) window.scrollTo({top: savedScroll, behavior:'instant'});
    else window.scrollTo({top: 0, behavior:'instant'});
    if (!preserveScroll) {
      let i = 0;
      main.querySelectorAll('[data-stagger]').forEach(el => {
        el.style.setProperty('--i', i++);
        el.classList.add('stagger-in');
      });
    } else if (view === 'home') {
      main.querySelectorAll('[data-stagger]').forEach(el => el.classList.add('stagger-instant'));
    }
    if (view === 'home' && STATE.ready.editions) initHeroRotation();
    if (view === 'home') { initHeroHighlights(); ytInit(); hlsInit(); vidsInit(); edsInit(); }
    if (view === 'day') { ytInitForDay(slug); }
    if (view === 'day' || view === 'saved' || view === 'read-later') {
      requestAnimationFrame(() => layoutDayNewsMasonry());
    }
    requestAnimationFrame(() => requestAnimationFrame(initHomeFallBg));
    if (_scrollToCat && view === 'day' && STATE.days[slug]) {
      const cat = _scrollToCat; _scrollToCat = null;
      setTimeout(() => {
        const el = document.getElementById('day-cat-' + cat);
        if (el) {
          const offset = el.getBoundingClientRect().top + window.scrollY - (parseInt(getComputedStyle(document.documentElement).getPropertyValue('--nh')) || 48) - 16;
          window.scrollTo({top: offset, behavior:'smooth'});
        }
      }, 80);
    }
    if (_scrollToTools && view === 'day' && STATE.days[slug]) {
      _scrollToTools = false;
      setTimeout(() => {
        const el = document.getElementById('day-tools-section');
        if (el) {
          const offset = el.getBoundingClientRect().top + window.scrollY - (parseInt(getComputedStyle(document.documentElement).getPropertyValue('--nh')) || 48) - 16;
          window.scrollTo({top: offset, behavior:'smooth'});
        }
      }, 80);
    }
    if (view === 'saved' || view === 'read-later') {
      const sortSel = document.getElementById('rl-sort');
      if (sortSel) sortSel.addEventListener('change', () => {
        STATE.readLaterSort = sortSel.value;
        localStorage.setItem('csrn-rl-sort', sortSel.value);
        renderAll({ preserveScroll: true });
      });
      document.getElementById('rl-export')?.addEventListener('click', exportReadLater);
      document.getElementById('rl-clear')?.addEventListener('click', () => {
        if (confirm('Limpar todos os itens salvos?')) {
          STATE.readLater = [];
          localStorage.setItem('csrn-read-later', '[]');
          renderAll();
        }
      });
    }
  };

  if (hadContent && main && !preserveScroll) {
    // Exit animation só em navegação real, não em mudança de tema
    main.classList.add('route-exit');
    setTimeout(applyContent, 150);
  } else {
    applyContent();
  }
}

/* ====================================================
   HAMBURGER / SIDEBAR TOGGLE
   ==================================================== */
function _updateSidebarBtn(open) {
  document.getElementById('hamburger').classList.toggle('sb-open', open);
}

function _isDesktopSidebar() {
  return window.innerWidth > 960;
}

function _syncSidebarBtn() {
  const sl = document.getElementById('sidebar-left');
  const open = _isDesktopSidebar()
    ? !document.body.classList.contains('sidebar-collapsed')
    : !!sl?.classList.contains('open');
  _updateSidebarBtn(open);
}

function _openSidebarOnHome() {
  if (_state?.view !== 'home' || !_isDesktopSidebar()) return;
  if (document.body.classList.contains('sidebar-collapsed')) {
    document.body.classList.remove('sidebar-collapsed');
    _syncSidebarBtn();
  }
}

function toggleSidebar() {
  if (!_isDesktopSidebar()) {
    const sl = document.getElementById('sidebar-left');
    const ov = document.getElementById('overlay');
    const opened = sl.classList.toggle('open');
    ov.classList.toggle('on', opened);
    document.body.classList.toggle('drawer-open', opened);
    _updateSidebarBtn(opened);
  } else {
    const collapsed = document.body.classList.toggle('sidebar-collapsed');
    _updateSidebarBtn(!collapsed);
  }
}

function closeSidebar() {
  document.getElementById('sidebar-left').classList.remove('open');
  document.getElementById('overlay').classList.remove('on');
  document.body.classList.remove('drawer-open');
  _syncSidebarBtn();
}

document.getElementById('hamburger').addEventListener('click', toggleSidebar);

// Desktop: sidebar começa aberta; mobile continua fechado como drawer.
_syncSidebarBtn();

/* ====================================================
   SIDEBAR TILE TOOLTIP
   ==================================================== */
(function() {
  const tip = document.getElementById('sb-tip');
  if (!tip) return;
  let activeEl = null;
  document.addEventListener('mouseover', e => {
    const el = e.target.closest('[data-tip]');
    if (!el) return;
    activeEl = el;
    tip.textContent = el.dataset.tip;
    const tc = el.dataset.tipColor;
    tip.style.borderColor = tc || 'var(--border)';
    tip.style.opacity = '1';
  });
  document.addEventListener('mousemove', e => {
    if (!activeEl || tip.style.opacity !== '1') return;
    const x = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8);
    const y = e.clientY - tip.offsetHeight - 10;
    tip.style.left = x + 'px';
    tip.style.top  = y + 'px';
  });
  document.addEventListener('mouseout', e => {
    if (e.target.closest('[data-tip]')) {
      tip.style.opacity = '0';
      tip.style.borderColor = 'var(--border)';
      activeEl = null;
    }
  });
})();

function renderSearchResults(q) {
  const all = _searchPool();
  const norm = (q||'').toLowerCase().trim();
  const filtered = norm
    ? all.filter(x => (x.label + ' ' + x.meta + ' ' + x.type).toLowerCase().includes(norm))
    : all.slice(0, 20);
  _searchItems = filtered;
  _searchSel = 0;
  const el = document.getElementById('search-results');
  if (!filtered.length) {
    el.innerHTML = `<div class="search-empty">Nada encontrado para "${q}"</div>`;
    return;
  }
  // Group by type
  const groups = {};
  filtered.forEach((x, i) => { (groups[x.type] = groups[x.type] || []).push({...x, _i: i}); });
  let h = '';
  for (const [type, arr] of Object.entries(groups)) {
    h += `<div class="search-group">${type}</div>`;
    arr.forEach(x => {
      const ico = x.iconUrl
        ? `<span class="search-item-icon"><img src="${x.iconUrl}" alt=""></span>`
        : `<span class="search-item-icon">${x.icon}</span>`;
      h += `<div class="search-item${x._i===0?' selected':''}" data-i="${x._i}" onclick="_searchPick(${x._i})">${ico}<span>${x.label}</span><span class="search-item-meta">${x.meta||''}</span></div>`;
    });
  }
  el.innerHTML = h;
}
function _searchPick(i) {
  const x = _searchItems[i];
  if (!x) return;
  closeSearch();
  setTimeout(() => x.go(), 50);
}
function _searchMove(dir) {
  if (!_searchItems.length) return;
  _searchSel = (_searchSel + dir + _searchItems.length) % _searchItems.length;
  document.querySelectorAll('.search-item').forEach(el => {
    el.classList.toggle('selected', Number(el.dataset.i) === _searchSel);
  });
  const sel = document.querySelector('.search-item.selected');
  if (sel) sel.scrollIntoView({block:'nearest'});
}

document.getElementById('search-input')?.addEventListener('input', e => renderSearchResults(e.target.value));
document.getElementById('search-input')?.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { e.preventDefault(); _searchMove(1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); _searchMove(-1); }
  else if (e.key === 'Enter') { e.preventDefault(); _searchPick(_searchSel); }
});

// Global keyboard shortcuts
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  const inField = tag === 'input' || tag === 'textarea' || e.target.isContentEditable;

  if (e.key === 'Escape') {
    closeSearch(); closeShortcuts();
    return;
  }

  if ((e.ctrlKey || e.metaKey) && (e.key === 'b' || e.key === 'B')) {
    e.preventDefault();
    toggleSidebar();
    return;
  }

  if (inField) return;

  if (e.key === '/') { e.preventDefault(); openSearch(); }
  else if (e.key === '?') { e.preventDefault(); openShortcuts(); }
  else if (e.key === 't' || e.key === 'T') { e.preventDefault(); toggleTheme(); }
  else if (e.key === 'h' || e.key === 'H') { e.preventDefault(); goToToday(); }
  else if (e.key === 'j' || e.key === 'J') {
    e.preventDefault();
    if (_state.view === 'home' || _state.view === 'day') calStepDay(-1);
  }
  else if (e.key === 'k' || e.key === 'K') {
    e.preventDefault();
    if (_state.view === 'home' || _state.view === 'day') calStepDay(1);
  }
});

// Scroll progress — agora ouve scroll do body/window
(function() {
  const bar = document.getElementById('scroll-progress');
  if (!bar) return;
  const update = () => {
    const doc = document.documentElement;
    const max = (doc.scrollHeight - doc.clientHeight);
    const pct = max > 0 ? (window.scrollY / max) * 100 : 0;
    bar.style.width = pct + '%';
  };
  window.addEventListener('scroll', update, {passive:true});
  window.addEventListener('resize', update, {passive:true});
  update();
})();

  let _fallShineIv = null;

  function syncFallBgToQbar() {
    const fall = document.getElementById('homeFallBg');
    if (!fall) return;
    // Tenta usar .qbar como referência (card de frase dos autores).
    // Se ele estiver oculto/colapsado, cai para .qbar-host (que é fixed e tem
    // o mesmo retângulo). Em última instância usa #main.
    let ref = document.querySelector('.qbar-host:not(.hidden):not(.closed) .qbar');
    if (!ref || ref.getBoundingClientRect().width <= 0) {
      ref = document.querySelector('.qbar-host:not(.hidden)');
    }
    if (!ref || ref.getBoundingClientRect().width <= 0) {
      ref = document.getElementById('main');
    }
    if (!ref) return;
    const r = ref.getBoundingClientRect();
    if (r.width <= 0) return;
    fall.style.left  = r.left + 'px';
    fall.style.right = Math.max(0, window.innerWidth - r.right) + 'px';
  }
  window._syncFallBgToQbar = syncFallBgToQbar;

  let _fallRO = null, _fallMO = null;
  window.initHomeFallBg = function initHomeFallBg() {
    const stage = document.getElementById('fallStage');
    if (!stage) return;
    // Limpa ciclo anterior e tiles
    if (_fallShineIv) { clearInterval(_fallShineIv); _fallShineIv = null; }
    stage.innerHTML = '';
    syncFallBgToQbar();
    if (!_fallRO && typeof ResizeObserver !== 'undefined') {
      _fallRO = new ResizeObserver(() => syncFallBgToQbar());
      const targets = [document.querySelector('.qbar-host'), document.getElementById('main')].filter(Boolean);
      targets.forEach(t => _fallRO.observe(t));
    }
    if (!_fallMO && typeof MutationObserver !== 'undefined') {
      const host = document.querySelector('.qbar-host');
      if (host) {
        _fallMO = new MutationObserver(() => syncFallBgToQbar());
        _fallMO.observe(host, { attributes: true, attributeFilter: ['class'] });
        _fallMO.observe(document.body, { attributes: true, attributeFilter: ['class'] });
      }
    }
    spawnHomeFallTiles();
  };
  window.addEventListener('resize', syncFallBgToQbar);

  function spawnHomeFallTiles() {
    const stage   = document.getElementById('fallStage');
    const emerge  = document.getElementById('fallEmerge');
    if (!stage) return;
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    // Monta lista e embaralha
    const subjects = [
      ...FT_LANGS.map(l => ({kind:'lang', src:l.logo, c:l.color, size:90, name:l.name})),
      ...FT_TOOLS.map(t => ({kind:'tool', src:t.logo, c:t.color, size:65, name:t.name, key:t.key})),
      ...FT_CATS.map(c  => ({kind:'cat',  svg:c.svg,  c:c.color, size:56, name:c.name})),
    ];
    for (let i = subjects.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [subjects[i], subjects[j]] = [subjects[j], subjects[i]];
    }

    const stageH = stage.clientHeight || (window.innerHeight - 48);
    const stageW = stage.clientWidth  || (window.innerWidth - 240);
    stage.style.setProperty('--stage-h', stageH + 'px');

    const rand = (a, b) => a + Math.random() * (b - a);
    const N       = 34;
    const COUNT   = Math.min(N, subjects.length);
    const BASE_DUR = 40;

    /* Posição do cubo girando em coordenadas relativas ao stage */
    function updateMask() {
      /* Fade no topo: tiles aparecem suavemente e somem no topo.
         O emerge overlay cuida do fade inferior. */
      const mask = 'linear-gradient(to bottom,transparent 0%,#000 10%,#000 100%)';
      stage.style.maskImage       = mask;
      stage.style.webkitMaskImage = mask;
    }

    function updateOverlay() {
      if (!emerge) return;
      /* Overlay no fundo: tiles emergem suavemente da base da tela. */
      emerge.style.bottom = '0';
      emerge.style.height = '160px';
    }

    /* ── Sistema de colunas (lanes) ── */
    const leftPct  = 5;
    const rightPct = 95;
    const availPx  = (rightPct - leftPct) / 100 * stageW;
    const LANE_TILE_MAX = 90;
    const LANE_GAP      = 18;
    const numLanes = Math.max(4, Math.floor(availPx / (LANE_TILE_MAX + LANE_GAP)));

    const laneDurations = Array.from({length: numLanes}, () => BASE_DUR * rand(0.9, 1.1));

    const laneOrder = [...Array(numLanes).keys()];
    for (let i = laneOrder.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [laneOrder[i], laneOrder[j]] = [laneOrder[j], laneOrder[i]];
    }

    const tileToLane = Array.from({length: COUNT}, (_, i) => laneOrder[i % numLanes]);
    const pts = Array.from({length: COUNT}, (_, i) => {
      const lane = tileToLane[i];
      const ny   = (i / COUNT + (Math.random() * 2 - 1) * 0.025 + 1) % 1;
      return [lane, ny];
    });

    function calcX(lane, size, sw) {
      const laneWidthPct = (rightPct - leftPct) / numLanes;
      const laneCenterPct = leftPct + (lane + 0.5) * laneWidthPct;
      const laneWidthPx   = availPx / numLanes;
      const maxJitterPx   = Math.max(0, laneWidthPx / 2 - size / 2 - 8);
      const maxJitterPct  = maxJitterPx / sw * 100;
      const jitter        = (Math.random() * 2 - 1) * maxJitterPct;
      const halfTilePct   = (size / 2) / sw * 100;
      const xPct = Math.max(leftPct + halfTilePct, Math.min(rightPct - halfTilePct, laneCenterPct + jitter));
      return xPct / 100 * sw - size / 2;
    }

    pts.forEach(([lane, ny], idx) => {
      const s    = subjects[idx % subjects.length];
      const { size } = s;
      const sw   = stage.clientWidth || stageW;
      const xPx  = calcX(lane, size, sw);
      const dur  = laneDurations[lane];
      const delay = -ny * dur;
      const wobbleDur   = rand(2.5, 4.5);
      const wobbleDelay = -rand(0, wobbleDur);

      const t = document.createElement('div');
      t.className = `fall-tile is-${s.kind}`;
      if (s.key) t.dataset.key  = s.key;
      t.dataset.lane = lane;
      t.dataset.size = size;
      t.style.cssText =
        `--size:${size}px;--c:${s.c};` +
        `--x:${xPx}px;` +
        `--dur:${dur}s;--delay:${delay}s;` +
        `--wobble-dur:${wobbleDur}s;--wobble-delay:${wobbleDelay}s`;

      const inner = s.kind === 'cat'
        ? `<svg viewBox="0 0 24 24">${s.svg}</svg>`
        : `<img src="${s.src}" alt="" onerror="this.style.display='none'">`;
      t.innerHTML = `<div class="inner">${inner}</div><span class="fall-label">${s.name}</span>`;

      /* Reinicia a animação ao fim do ciclo com novo jitter de posição */
      t.addEventListener('animationend', function(e) {
        if (e.animationName !== 'fall-move') return;
        const myLane = parseInt(this.dataset.lane ?? '0', 10);
        const sz     = parseInt(this.dataset.size ?? '56', 10);
        const swR    = stage.clientWidth || stageW;
        const newXPx  = calcX(myLane, sz, swR);
        const newDur  = laneDurations[myLane];
        this.style.setProperty('--x',     `${newXPx}px`);
        this.style.setProperty('--dur',   `${newDur}s`);
        this.style.setProperty('--delay', '0s');
        this.style.animationName = 'none';
        void this.offsetWidth;
        this.style.animationName = '';
      });

      stage.appendChild(t);
    });

    updateMask();
    updateOverlay();

    /* Atualiza máscara e overlay na rolagem/resize */
    let _rafPending = false;
    function scheduleUpdate() {
      if (_rafPending) return;
      _rafPending = true;
      requestAnimationFrame(() => {
        _rafPending = false;
        const sh = stage.clientHeight || (window.innerHeight - 48);
        stage.style.setProperty('--stage-h', sh + 'px');
        updateMask();
        updateOverlay();
      });
    }
    window.addEventListener('resize', scheduleUpdate, {passive: true});
    window.addEventListener('scroll', scheduleUpdate, {passive: true});

    /* Redistribui uniformemente ao voltar de outra aba */
    function reshuffleAll() {
      const tiles = [...stage.querySelectorAll('.fall-tile')];
      if (!tiles.length) return;
      const swR = stage.clientWidth || stageW;
      const newLaneOrder = [...Array(numLanes).keys()];
      for (let i = newLaneOrder.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [newLaneOrder[i], newLaneOrder[j]] = [newLaneOrder[j], newLaneOrder[i]];
      }
      const newTileLanes = tiles.map((_, i) => newLaneOrder[i % numLanes]);
      tiles.forEach((el, i) => {
        const lane = newTileLanes[i];
        const sz   = parseInt(el.dataset.size ?? '56', 10);
        const xPx  = calcX(lane, sz, swR);
        const ny   = (i / tiles.length + (Math.random() * 2 - 1) * 0.025 + 1) % 1;
        const dur  = laneDurations[lane];
        el.dataset.lane = lane;
        el.style.setProperty('--x',     `${xPx}px`);
        el.style.setProperty('--dur',   `${dur}s`);
        el.style.setProperty('--delay', `${-ny * dur}s`);
        el.style.animationName = 'none';
        void el.offsetWidth;
        el.style.animationName = '';
      });
    }

    /* Brilho periódico: 5 tiles aleatórios a cada 3 s */
    _fallShineIv = setInterval(() => {
      const st = document.getElementById('fallStage');
      if (!st) return;
      const all = [...st.querySelectorAll('.fall-tile')];
      const visible = all.filter(t => {
        const r = t.getBoundingClientRect();
        return r.bottom > 0 && r.top < window.innerHeight;
      });
      for (let i = visible.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [visible[i], visible[j]] = [visible[j], visible[i]];
      }
      visible.slice(0, 5).forEach(t => {
        t.classList.remove('is-shining');
        void t.offsetWidth;
        t.classList.add('is-shining');
      });
    }, 3000);

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible')
        requestAnimationFrame(() => requestAnimationFrame(reshuffleAll));
    });
    window.addEventListener('pageshow', e => {
      if (e.persisted || document.visibilityState === 'visible')
        requestAnimationFrame(() => requestAnimationFrame(reshuffleAll));
    });
  }
})();

/* ── YouTube Carousel ── */
const YT_SLIDE_W_SM = 220, YT_SLIDE_W_LG = 300, YT_GAP = 8;
let ytLarge = false;
function _ytSlideW() { return ytLarge ? YT_SLIDE_W_LG : YT_SLIDE_W_SM; }
function _ytTotal() { const t = document.getElementById('yt-track'); return t ? t.children.length : 0; }
let ytPage = 0;

function _ytPerView() {
  const wrap = document.getElementById('yt-track');
  if (!wrap) return 1;
  const wrapW = wrap.parentElement.clientWidth;
  return Math.max(1, Math.floor(wrapW / (_ytSlideW() + YT_GAP)));
}
function _ytPages(perView) { return Math.max(1, Math.ceil(_ytTotal() / perView)); }

function _ytRender(page) {
  const perView = _ytPerView();
  const pages = _ytPages(perView);
  page = Math.max(0, Math.min(pages - 1, page));
  ytPage = page;

  const track = document.getElementById('yt-track');
  if (track) track.style.transform = 'translateX(-' + (page * perView * (_ytSlideW() + YT_GAP)) + 'px)';

  const prev = document.getElementById('yt-prev');
  const next = document.getElementById('yt-next');
  if (prev) prev.disabled = page === 0;
  if (next) next.disabled = page >= pages - 1;
}

function ytGo(page) { _ytRender(page); }
function ytToggleSize() {
  ytLarge = !ytLarge;
  const carousel = document.querySelector('.yt-carousel');
  if (carousel) carousel.classList.toggle('yt-large', ytLarge);
  const icon = document.getElementById('yt-size-icon');
  if (icon) icon.innerHTML = ytLarge
    ? '<path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/>'
    : '<path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>';
  _ytRender(0);
}
function ytInit() { _ytRender(0); _ytFetchTitles(); }

const HLS_SLIDE_W = 360, HLS_GAP = 12;
let hlsTotal = 0, hlsPage = 0;
function _hlsPerView(){const t=document.getElementById('hls-track');if(!t)return 1;return Math.max(1,Math.floor(t.parentElement.clientWidth/(HLS_SLIDE_W+HLS_GAP)));}
function _hlsRender(page){
  const track=document.getElementById('hls-track');if(!track)return;
  const pv=_hlsPerView(),pages=Math.max(1,Math.ceil(hlsTotal/pv));
  page=Math.max(0,Math.min(pages-1,page));hlsPage=page;
  track.style.transform='translateX(-'+(page*pv*(HLS_SLIDE_W+HLS_GAP))+'px)';
  const prev=document.getElementById('hls-prev'),next=document.getElementById('hls-next'),ctr=document.getElementById('hls-counter'),nav=document.getElementById('hls-nav'),dots=document.getElementById('hls-dots');
  const show=pages>1;
  if(nav)nav.style.display=show?'':'none';if(dots)dots.style.display=show?'':'none';

  if(dots&&show)dots.innerHTML=Array.from({length:pages},(_,i)=>`<button class="eds-dot${i===page?' active':''}" onclick="hlsGo(${i})" aria-label="Página ${i+1}"></button>`).join('');
}
function hlsGo(page){_hlsRender(page);}
function hlsInit(){const t=document.getElementById('hls-track');if(!t)return;hlsTotal=t.children.length;_hlsRender(0);initDragScroll('hls-track',HLS_SLIDE_W,HLS_GAP);}
window.addEventListener('resize',()=>{if(document.getElementById('hls-track'))_hlsRender(hlsPage);});
