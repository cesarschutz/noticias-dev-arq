/* ── Editions carousel ── */
const EDS_SLIDE_W = 260, EDS_GAP = 14;
let edsTotal = 0, edsPage = 0;
function _edsPerView() {
  const wrap = document.getElementById('eds-track');
  if (!wrap) return 1;
  return Math.max(1, Math.floor(wrap.parentElement.clientWidth / (EDS_SLIDE_W + EDS_GAP)));
}
function _edsPages(perView) { return Math.max(1, Math.ceil(edsTotal / perView)); }
function _edsRender(page) {
  const track = document.getElementById('eds-track');
  if (!track) return;
  const perView = _edsPerView();
  const pages = _edsPages(perView);
  page = Math.max(0, Math.min(pages - 1, page));
  edsPage = page;
  track.style.transform = 'translateX(-' + (page * perView * (EDS_SLIDE_W + EDS_GAP)) + 'px)';
  const prevBtn = document.getElementById('eds-prev');
  const nextBtn = document.getElementById('eds-next');
  const counter  = document.getElementById('eds-counter');
  const navEl    = document.getElementById('eds-nav');
  const dotsEl   = document.getElementById('eds-dots');
  const showNav  = pages > 1;
  if (navEl)   navEl.style.display    = showNav ? '' : 'none';
  if (dotsEl)  dotsEl.style.display   = showNav ? '' : 'none';
  if (prevBtn) prevBtn.disabled        = page === 0;
  if (nextBtn) nextBtn.disabled        = page >= pages - 1;
  if (counter) counter.textContent     = showNav ? (page + 1) + ' / ' + pages : '';
  if (dotsEl && showNav) {
    dotsEl.innerHTML = Array.from({length: pages}, (_, i) =>
      `<button class="eds-dot${i === page ? ' active' : ''}" onclick="edsGo(${i})" aria-label="Página ${i+1}"></button>`
    ).join('');
  }
}
function edsGo(page) { _edsRender(page); }
function edsInit() {
  const track = document.getElementById('eds-track');
  if (!track) return;
  edsTotal = track.children.length;
  _edsRender(0);
  initDragScroll('eds-track', 260, 14);
}
window.addEventListener('resize', () => { if (document.getElementById('eds-track')) _edsRender(edsPage); });

function _ytFetchTitles(vids) {
  if (!vids) {
    const todayStr = new Date().toISOString().slice(0,10);
    const latestDate = (STATE.editions?.editions || [])[0]?.date || todayStr;
    vids = STATE.days[latestDate]?.videos || [];
  }
  vids.forEach((v, i) => {
    if (v.title) return;
    fetch('https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=' + v.id + '&format=json')
      .then(r => r.json())
      .then(d => {
        const title = document.getElementById('yt-title-' + i);
        const channel = document.getElementById('yt-channel-' + i);
        if (title && !v.title) title.textContent = d.title || '';
        if (channel && !v.channel) channel.textContent = d.author_name || '';
      })
      .catch(() => {});
  });
}
function ytInitForDay(date) {
  const vids = STATE.days[date]?.videos || [];
  if (!vids.length) return;
  vidsInit();
  _ytFetchTitles(vids);
}
window.addEventListener('resize', () => _ytRender(ytPage));

function ytPlay(el, id) {
  const iframe = document.createElement('iframe');
  iframe.src = 'https://www.youtube.com/embed/' + id + '?autoplay=1&rel=0&modestbranding=1';
  iframe.setAttribute('allow', 'accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture');
  iframe.setAttribute('allowfullscreen', '');
  iframe.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;border:none;display:block';
  el.innerHTML = '';
  el.appendChild(iframe);
}

/* ── Drag-scroll with side arrow overlays ── */
function initDragScroll(trackId, slideW, gap) {
  const track = document.getElementById(trackId);
  if (!track) return;
  const wrap = track.parentElement;

  // Wrap in a relative container for arrow overlay
  const outer = document.createElement('div');
  outer.className = 'drag-outer';
  wrap.parentNode.insertBefore(outer, wrap);
  outer.appendChild(wrap);

  const SVG_L = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>`;
  const SVG_R = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>`;

  const btnL = document.createElement('button');
  btnL.className = 'drag-arrow drag-arrow--l';
  btnL.setAttribute('aria-label', 'Anterior');
  btnL.innerHTML = SVG_L;

  const btnR = document.createElement('button');
  btnR.className = 'drag-arrow drag-arrow--r';
  btnR.setAttribute('aria-label', 'Próximo');
  btnR.innerHTML = SVG_R;

  outer.appendChild(btnL);
  outer.appendChild(btnR);

  let itemIdx = 0;
  const EASE = 'transform .35s cubic-bezier(0.25,0.46,0.45,0.94)';

  function goItem(n) {
    const total = track.children.length;
    const trackW = total * slideW + Math.max(0, total - 1) * gap;
    const maxOffset = Math.max(0, trackW - wrap.clientWidth);
    const offset = Math.max(0, Math.min(maxOffset, n * (slideW + gap)));
    itemIdx = Math.round(offset / (slideW + gap));
    track.style.transition = EASE;
    track.style.transform = `translateX(-${offset}px)`;
  }

  btnL.addEventListener('click', () => goItem(itemIdx - 1));
  btnR.addEventListener('click', () => goItem(itemIdx + 1));

  // Only horizontal scroll (trackpad swipe / shift+wheel) — throttled to 1 item per gesture
  let wheelLock = false;
  outer.addEventListener('wheel', e => {
    const dx = e.shiftKey ? e.deltaY : e.deltaX;
    if (Math.abs(dx) < 5) return;
    e.preventDefault();
    if (wheelLock) return;
    wheelLock = true;
    goItem(itemIdx + (dx > 0 ? 1 : -1));
    setTimeout(() => { wheelLock = false; }, 420);
  }, { passive: false });

  // Drag
  let dragging = false, startX = 0, startTx = 0, moved = false;
  function getTx() { return new DOMMatrix(getComputedStyle(track).transform).m41; }
  function snapNearest() {
    const n = Math.round(-getTx() / (slideW + gap));
    goItem(n);
  }

  outer.addEventListener('mousemove', e => {
    if (!dragging) return;
    const dx = e.clientX - startX;
    if (Math.abs(dx) > 3) moved = true;
    track.style.transition = 'none';
    track.style.transform = `translateX(${startTx + dx}px)`;
  });
  outer.addEventListener('mouseleave', () => {
    if (dragging) { dragging = false; snapNearest(); }
  });
  outer.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    dragging = true; moved = false;
    startX = e.clientX; startTx = getTx();
    e.preventDefault();
  });
  window.addEventListener('mouseup', e => {
    if (!dragging) return;
    dragging = false;
    const dx = e.clientX - startX;
    if (moved && Math.abs(dx) > 30) goItem(itemIdx + (dx < 0 ? 1 : -1));
    else snapNearest();
  });
}
