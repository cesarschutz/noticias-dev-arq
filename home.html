  background:color-mix(in srgb,var(--tc,var(--accent)) 10%,transparent);
  border:1px solid color-mix(in srgb,var(--tc,var(--accent)) 24%,transparent);
  color:var(--text);font-size:13px;font-weight:600;
  transition:all .15s;
}
.nf-sugg-chip:hover{background:color-mix(in srgb,var(--tc,var(--accent)) 18%,transparent);transform:translateY(-1px)}

/* ===== TIMELINE LIST ===== */
.tl-list{padding:0 0 60px}
.tl-item{
  display:flex;gap:20px;padding:18px 0;
  border-bottom:1px solid var(--border);
}
.tl-date{flex-shrink:0;width:44px;text-align:center;padding-top:2px}
.tl-day{font-size:22px;font-weight:600;letter-spacing:-0.5px;color:var(--text);line-height:1;font-variant-numeric:tabular-nums}
.tl-mon{font-size:10px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:0.5px;font-variant-numeric:tabular-nums}
.tl-content{flex:1;min-width:0}
.tl-title{font-size:16px;font-weight:600;letter-spacing:-0.3px;line-height:1.35;margin-bottom:6px;color:var(--text)}
.tl-title a{color:var(--text)}
.tl-title a:hover{color:var(--link);text-decoration:none}
.tl-summary{font-size:14px;color:var(--text-2);line-height:1.55;margin-bottom:6px}
.tl-footer{font-size:12px;color:var(--text-3);display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* ===== ITEM IMAGE ===== */
.tl-item-img-wrap{float:right;margin:0 0 8px 12px;flex-shrink:0}
.tl-item-img{
  display:block;width:88px;height:58px;object-fit:cover;
  border-radius:7px;border:1px solid var(--border);
}
.tl-item-img.tl-item-img-src{
  width:44px;height:44px;object-fit:contain;padding:6px;
  background:var(--surface-el);border-radius:9px;
}

/* ===== EXPLAIN (júnior / pleno / sênior) ===== */
.tl-explain-toggle{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11px;font-weight:600;color:var(--text-3);
  background:none;border:1px solid var(--border);border-radius:20px;
  padding:4px 12px;cursor:pointer;margin-bottom:14px;
  transition:color var(--tr-fast),border-color var(--tr-fast);
}
.tl-explain-toggle:hover{color:var(--text-2);border-color:var(--text-3)}
.tl-explain-toggle svg{flex-shrink:0;transition:transform .2s var(--ease-out)}
.tl-explain{
  border-radius:8px;border:1px solid var(--border);
  background:var(--surface-el);overflow:hidden;
  margin-bottom:8px;
}
[data-explain-closed] .tl-explain-toggle svg{transform:rotate(-90deg)!important}
.tl-explain-level{
  display:flex;align-items:baseline;gap:8px;
  padding:7px 12px;border-bottom:1px solid var(--border);
  font-size:13px;line-height:1.5;color:var(--text-2);
}
.tl-explain-level:last-of-type{border-bottom:none}
.tl-explain-lbl{
  flex-shrink:0;font-size:9px;font-weight:800;
  letter-spacing:0.8px;text-transform:uppercase;
  color:var(--lc,var(--accent));
  background:color-mix(in srgb,var(--lc,var(--accent)) 14%,transparent);
  border-radius:4px;padding:2px 6px;
}
.tl-explain-glossary{
  display:flex;flex-wrap:wrap;gap:5px;
  padding:8px 12px;border-top:1px solid var(--border);
  background:color-mix(in srgb,var(--surface-el) 60%,transparent);
}
.tl-explain-chip{
  display:inline-flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--border);
  border-radius:6px;padding:3px 9px;cursor:pointer;
  font-size:11px;font-weight:500;color:var(--text-2);
  text-align:left;transition:border-color var(--tr-fast),background var(--tr-fast);
}
.tl-explain-chip:hover{border-color:var(--accent);color:var(--text)}
.tl-explain-chip-def{
  display:none;font-size:11px;font-weight:400;
  color:var(--text-3);margin-top:3px;line-height:1.45;
  max-width:220px;white-space:normal;
}
.tl-explain-chip.open{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.tl-explain-chip.open .tl-explain-chip-def{display:block}
.tl-explain-chip.open .tl-explain-chip-term::after{content:' ×';opacity:.5}

/* ===== CALENDAR ===== */
.cal-title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.cal-month{font-size:11px;font-weight:600;letter-spacing:-0.1px;color:var(--text)}
.cal-nav{
  width:20px;height:20px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;color:var(--text-2);background:var(--surface-el);
  transition:background var(--tr);
}
.cal-nav:hover{background:var(--border)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.cal-wd{font-size:8px;font-weight:700;text-align:center;color:var(--text-3);padding:2px 0;letter-spacing:0.2px;text-transform:uppercase}
.cal-d{
  aspect-ratio:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  font-size:10px;border-radius:4px;position:relative;
  color:var(--text-3);font-variant-numeric:tabular-nums;
}
.cal-d.has{color:var(--text);font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums;transition:background var(--tr-fast),transform 0.08s var(--ease-out)}
.cal-d.has:hover{background:var(--surface-el)}
.cal-d.has:active{transform:scale(0.88)}
.cal-d.sel{background:var(--accent)!important;color:#fff!important}
.cal-d.today:not(.sel){outline:none;border:none;color:var(--accent);font-weight:700;}
.cal-d.today:not(.sel)::before{content:"";position:absolute;inset:auto 0 1px 0;margin:0 auto;width:4px;height:4px;border-radius:50%;background:var(--accent);}

/* ===== V2 HOME CARDS POLISH ===== */
/* Section spacing — more breathing room between cards */
.home-section{margin:36px 0 0!important}
.home-section:first-of-type{margin-top:24px!important}

/* Card padding — less inner air on large screens */
.fav-card{
  padding:clamp(20px,2vw,26px)!important;
  border-radius:14px!important;
}
@media(max-width:640px){
  .fav-card{padding:18px 16px!important;border-radius:12px!important}
}

/* Kicker — remove the leading bar; cleaner look */
.home-sect-kicker,.sect-kicker,.card-kicker{
  padding-left:0!important;
  font-size:11px!important;
  letter-spacing:.16em!important;
  font-weight:700!important;
  color:var(--accent)!important;
  margin-bottom:6px!important;
}
.home-sect-kicker::before,.sect-kicker::before,.card-kicker::before{display:none!important}
[data-theme="dark"] .home-sect-kicker::before,
[data-theme="dark"] .sect-kicker::before,
[data-theme="dark"] .card-kicker::before{display:none!important}

/* Section header — tighter rhythm */
.eds-section-hd{margin-bottom:18px!important}
.home-sect-title{margin-bottom:0!important;letter-spacing:-.022em!important}
.home-section-sub{margin-top:6px!important;font-size:13.5px!important;color:var(--text-3)!important}

/* Hide remaining redundant inner kickers (Edição atual / Edições anteriores / Edições recentes) */
.home-hls-prev-hd .home-sect-kicker{
  color:var(--text-3)!important;
  font-size:10.5px!important;
  letter-spacing:.12em!important;
  margin-bottom:10px!important;
}
.home-hls-prev-hd{margin-bottom:10px!important;padding-top:4px;border-top:1px dashed var(--border)}
.home-hls-prev-hd:first-child{border-top:none;padding-top:0}

/* ===== V2 GLOBAL POLISH — final pass ===== */

/* 1. Fall stage (logos no fundo) — mais discretos, viram ambiente */
.fall-tile{opacity:.55!important}
.fall-tile:hover{opacity:1!important}
.fall-tile .inner{filter:saturate(.85)}
.fall-tile:hover .inner{filter:saturate(1)}
.fall-label{opacity:.7!important}
.fall-tile:hover .fall-label{opacity:1!important}

/* 2. Quote bar — setas mais visíveis */
.qbar-btn{
  background:color-mix(in srgb,var(--text) 6%,transparent)!important;
  border:1px solid var(--border)!important;
  color:var(--text-2)!important;
}
.qbar-btn:hover{
  background:color-mix(in srgb,var(--accent) 14%,transparent)!important;
  color:var(--accent)!important;
  border-color:color-mix(in srgb,var(--accent) 40%,var(--border))!important;
}

/* 3. Hero highlight cards — aspect-ratio fixo nas imagens (anti-CLS) */
.hero-hl-img-banner{aspect-ratio:16/9;background:color-mix(in srgb,var(--cat-color,var(--accent)) 10%,var(--surface-el))!important}
.hero-hl-img-banner img{width:100%;height:100%!important;object-fit:cover}
.home-hls-latest-grid .hero-hl-img-banner img{height:100%!important}
.home-hls-track .hero-hl-img-banner img{height:100%!important}

/* 4. Hover state padronizado em todos os cards de notícia/destaque */
.hl-card,.hero-hl-card,.news-card{
  transition:transform .22s var(--ease-out,cubic-bezier(.2,.8,.2,1)),box-shadow .22s ease,border-color .22s ease!important;
}
.hl-card:hover,.hero-hl-card:hover,.news-card:hover{
  transform:translateY(-3px)!important;
}

/* 5. Carrossel — sem fade lateral (botões de navegação sempre visíveis) */

/* 6. Segmented controls (fav-seg / fav-tabs) — tab ativa com mais contraste */
.fav-seg-btn.active{
  background:var(--accent)!important;
  color:#fff!important;
  box-shadow:0 1px 2px rgba(0,0,0,.12),0 2px 8px color-mix(in srgb,var(--accent) 30%,transparent)!important;
}
.fav-seg-btn.active svg{color:#fff!important}
.fav-tab.active{
  background:color-mix(in srgb,var(--accent) 16%,transparent)!important;
  color:var(--accent)!important;
  font-weight:600!important;
}

/* 7. Border-radius pills/badges padronizado */
.home-cover-meta span{border-radius:8px!important}

/* 8. Hierarquia tipográfica — section titles um pouco menores que hero */
.home-section .home-sect-title{
  font-size:clamp(20px,2vw,26px)!important;
  font-weight:700!important;
  letter-spacing:-.020em!important;
}

/* 9. Footer da página — espaçamento e cor consistentes */
footer,.site-footer{
  margin-top:48px;
  padding:24px 0;
  color:var(--text-3);
  border-top:1px solid var(--border);
  font-size:13px;
}
footer a,.site-footer a{color:var(--text-2);text-decoration:none;transition:color .18s ease}
footer a:hover,.site-footer a:hover{color:var(--accent)}

/* 10. Reduced motion — respeita preferência do usuário */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
  .fall-tile{animation:none!important;transform:none!important}
}

/* ===== V2 EDITORIAL HERO — animar e dar vida ===== */
.home-cube-swiper.is-editorial .swiper-slide{
  background: var(--surface) !important;
  overflow: hidden !important;
}
[data-theme="dark"] .home-cube-swiper.is-editorial .swiper-slide{
  background:
    radial-gradient(circle at 100% 0%, color-mix(in srgb, var(--accent) 14%, transparent) 0%, transparent 45%),
    radial-gradient(circle at 0% 100%, color-mix(in srgb, var(--accent) 7%, transparent) 0%, transparent 40%),
    var(--surface) !important;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .home-cube-swiper.is-editorial .swiper-slide{
    background:
      radial-gradient(circle at 100% 0%, color-mix(in srgb, var(--accent) 14%, transparent) 0%, transparent 45%),
      radial-gradient(circle at 0% 100%, color-mix(in srgb, var(--accent) 7%, transparent) 0%, transparent 40%),
      var(--surface) !important;
  }
}

/* Decoração sutil — marca d'água radial atrás */
.home-cube-swiper.is-editorial .swiper-slide::after{
  content: none !important;
}
[data-theme="dark"] .home-cube-swiper.is-editorial .swiper-slide::after{
  content: "" !important;
  position: absolute;
  top: -20px; right: -30px;
  width: 280px; height: 280px;
  pointer-events: none;
  z-index: 0;
  filter: blur(20px);
  background: radial-gradient(circle, color-mix(in srgb, var(--accent) 8%, transparent) 0%, transparent 60%);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .home-cube-swiper.is-editorial .swiper-slide::after{
    content: "" !important;
    position: absolute;
    top: -20px; right: -30px;
    width: 280px; height: 280px;
    pointer-events: none;
    z-index: 0;
    filter: blur(20px);
    background: radial-gradient(circle, color-mix(in srgb, var(--accent) 8%, transparent) 0%, transparent 60%);
  }
}
[data-theme="dark"] .home-cube-swiper.is-editorial .swiper-slide::after{
  background: radial-gradient(circle, color-mix(in srgb, var(--accent) 8%, transparent) 0%, transparent 60%);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .home-cube-swiper.is-editorial .swiper-slide::after{
    background: radial-gradient(circle, color-mix(in srgb, var(--accent) 8%, transparent) 0%, transparent 60%);
  }
}

/* Number do dia sem sombra */
.is-editorial .ed-date-num{
  text-shadow: none;
}

/* Pill da edição com mais presença */
.is-editorial .ed-issue{
  background: color-mix(in srgb, var(--accent) 12%, transparent) !important;
  border-color: color-mix(in srgb, var(--accent) 35%, var(--border)) !important;
  color: var(--accent) !important;
  font-weight: 700 !important;
}

/* Stats no footer com leve pulso no número */
.is-editorial .ed-foot-stat b{
  color: var(--accent) !important;
}
.cal-dot{width:4px;height:4px;border-radius:50%;background:var(--accent);position:absolute;bottom:2px}

/* ===== CAL COMPACT BAR ===== */
.cal-mod{padding:8px 6px 8px;border-bottom:1px solid var(--border);margin-bottom:6px;}
.cal-bar{display:flex;align-items:center;gap:4px;padding:2px 0;}
.cal-arr{
  width:22px;height:22px;border-radius:var(--rp);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;line-height:1;color:var(--text-2);
  background:transparent;
  transition:background var(--tr),color var(--tr),transform 0.1s;
  flex-shrink:0;
}
.cal-arr:hover{background:var(--surface-el);color:var(--text);}
.cal-arr:active{transform:scale(0.92);}
.cal-arr:disabled{opacity:0.3;cursor:not-allowed;pointer-events:none;}
.cal-arr:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.cal-display{
  flex:1;display:flex;align-items:center;justify-content:center;
  position:relative;
  padding:4px 22px;border-radius:var(--r);
  background:transparent;color:var(--text-2);
  font-size:11px;font-weight:600;letter-spacing:-0.1px;
  transition:background var(--tr),color var(--tr);
  min-width:0;
}
.cal-display:hover{background:var(--surface-el);}
.cal-display:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.cal-display-date{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#8e8e93;}
.cal-mod:not(.cal-dim) .cal-display-date{color:var(--text);}
.cal-display-chev{
  position:absolute;right:6px;
  font-size:9px;color:#8e8e93;
  transition:transform 0.3s ease,opacity 0.2s,color 0.2s;
}
.cal-mod:not(.cal-dim) .cal-display-chev{color:var(--accent);}
.cal-mod.expanded .cal-display-chev{transform:rotate(180deg);}
/* Estado dim — não está visualizando um dia específico */
.cal-mod.cal-dim .cal-display{transition:opacity var(--tr),background var(--tr),color var(--tr);}
.cal-mod.cal-dim .cal-display:hover{opacity:1;}
.cal-expand{
  display:grid;
  grid-template-rows:0fr;
  transition:grid-template-rows 0.4s ease,margin-top 0.35s ease;
  margin-top:0;
}
.cal-mod.expanded .cal-expand{grid-template-rows:1fr;margin-top:4px;}
.cal-expand-inner{
  overflow:hidden;
  opacity:0;
  transform:translateY(-4px);
  transition:opacity 0.3s ease,transform 0.35s ease;
}
.cal-mod.expanded .cal-expand-inner{
  opacity:1;
  transform:translateY(0);
  transition:opacity 0.3s ease 0.05s,transform 0.35s ease 0.05s;
}
@media(prefers-reduced-motion:reduce){
  .cal-expand,.cal-expand-inner,.cal-display-chev{transition:none!important;}
}

/* ===== QUOTE BAR (fixa abaixo do header) =====
   Alinhada com a coluna de conteúdo (mesmo bloco que tudo abaixo) */
.qbar-host{
  position:fixed;top:var(--nh);
  left:calc(max(0px, (100vw - var(--page-max)) / 2) + var(--page-pad) + var(--app-frame-pad) + var(--sw) + var(--app-col-gap));
  right:calc(max(0px, (100vw - var(--page-max)) / 2) + var(--page-pad) + var(--app-frame-pad));
  z-index:180;
  display:block;pointer-events:none;
  padding:0;
}
.qbar-host>*{pointer-events:auto;}
.qbar{
  display:grid;
  grid-template-columns:auto 1fr;
  align-items:center;
  gap:14px;
  position:relative;
  width:100%;
  padding:10px 14px 12px 18px;
  background:var(--surface-card);
  border:1px solid var(--border);
  border-top:none;
  border-radius:0 0 14px 14px;
  transition:
    transform 0.42s cubic-bezier(0.32,0.72,0,1),
    opacity 0.28s ease;
}
.qbar-mascot{
  width:56px;height:78px;flex-shrink:0;
  display:flex;align-items:flex-end;justify-content:center;
  align-self:flex-end;
  margin-bottom:-12px;
  margin-left:-10px;
  transform-origin:50% 90%;
}
.qbar-mascot img{
  width:100%;height:100%;object-fit:contain;
  filter:drop-shadow(0 4px 10px rgba(0,0,0,0.18));
  display:block;
}
.qbar-mascot.is-pondering{
  animation:qbar-mascot-ponder 0.5s ease-in-out forwards;
}
.qbar-body{min-width:0;}
.qbar-main{display:block;}
.qbar-text{
  display:inline;
  font-family:var(--ff-quote);
  font-size:15px;line-height:1.52;letter-spacing:0.2px;
  color:var(--text);font-style:italic;font-weight:700;
}
.qbar-text::before{content:'\201C';}
.qbar-text::after{content:'\201D';}
.qbar-author{
  display:inline;
  white-space:nowrap;
  margin-left:8px;
  font-family:var(--ff-quote);
  font-size:13px;font-weight:700;font-style:italic;letter-spacing:0.2px;
  color:var(--accent);
}
.qbar-ctx-row{
  display:inline-flex;align-items:center;max-width:calc(100% - 70px);margin-top:3px;
  text-decoration:none!important;color:inherit;overflow:hidden;
}
.qbar-ctx-ico{width:14px;height:14px;object-fit:contain;border-radius:2px;flex-shrink:0;margin-right:4px;}
.qbar-ctx{
  font-size:12.5px;letter-spacing:0;color:var(--text-2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  min-width:0;flex-shrink:1;
}
.qbar-ctx-row:hover .qbar-ctx{
  color:var(--accent);
  border-bottom:0.5px solid var(--accent);
}
.qbar-link-ico{flex-shrink:0;margin-left:5px;color:var(--accent);opacity:0.6;transition:opacity 0.15s;}
.qbar-ctx-row:hover .qbar-link-ico{opacity:1;}
.qbar-actions{
  position:absolute;bottom:10px;right:14px;
  display:flex;flex-direction:row;align-items:center;gap:0;
}
.qbar-btn{
  display:flex;align-items:center;justify-content:center;
  width:28px;height:28px;font-size:18px;
  color:var(--accent);opacity:0.5;
  background:none;border:none;padding:0;
  transition:opacity 0.15s,transform 0.1s;
  cursor:pointer;
}
.qbar-btn:hover{opacity:1;}
.qbar-btn:active{transform:scale(0.88);}
.qbar-btn:focus-visible{outline:none;}
@media(max-width:480px){.qbar-btn{width:36px;height:36px;}}
.qbar-host.closed .qbar{
  transform:translateY(-100%);pointer-events:none;
  box-shadow:none;
}
.qbar-host.hidden{display:none;}
.qbar-chip{
  position:absolute;bottom:0;left:24px;
  transform:translateY(100%);
  display:flex;align-items:center;justify-content:center;
  height:20px;padding:0 12px;
  border-radius:0 0 10px 10px;
  overflow:hidden;
  background:var(--surface-card);
  border:1px solid var(--border);border-top:none;
  color:var(--accent);
  opacity:1;
  box-shadow:0 1px 2px rgba(0,0,0,0.06),0 6px 14px rgba(15,23,42,0.08);
  transition:background var(--tr);
  pointer-events:auto;
}
.qbar-host.closed .qbar-chip{pointer-events:auto;}
.qbar-chip:active{opacity:0.8;}
.qbar-chip:focus-visible{outline:none;}
body.qbar-open #main{
  padding-top:var(--qbar-h,72px);
  transition:padding-top 0.38s cubic-bezier(0.32,0.72,0,1);
}
body:not(.qbar-open) #main{
  padding-top:0;
  transition:padding-top 0.38s cubic-bezier(0.32,0.72,0,1);
}
@media(max-width:960px){
  .qbar-host{left:0;right:0;padding:0 var(--page-pad);}
}
@media(max-width:720px){
  .qbar{padding:8px 10px 10px 14px;gap:10px;grid-template-columns:36px 1fr;}
  .qbar-mascot{width:46px;height:64px;margin-bottom:-8px;align-self:end;}
}
@media(max-width:480px){
  .qbar{grid-template-columns:28px 1fr;}
  .qbar-mascot{width:34px;height:48px;margin-bottom:-8px;margin-left:-6px;}
}
@media(prefers-reduced-motion:reduce){
  .qbar,.qbar-chip,body.qbar-open #main,body:not(.qbar-open) #main{transition:none!important;}
  .qbar-host.closed .qbar{transform:none;display:none;}
  .qbar-mascot.is-pondering{animation:none!important;}
}
@keyframes qbar-mascot-think{
  0%   {transform:rotate(-2deg) translateY(0px);}
  28%  {transform:rotate(2.5deg) translateY(-1px);}
  56%  {transform:rotate(-1deg) translateY(0.5px);}
  78%  {transform:rotate(1.8deg) translateY(-0.5px);}
  100% {transform:rotate(-2deg) translateY(0px);}
}
@keyframes qbar-mascot-ponder{
  0%   {transform:scale(1);opacity:1;}
  35%  {transform:scale(1.08);opacity:1;}
  100% {transform:scale(1);opacity:1;}
}
.qbar-body{transition:opacity .24s ease;}
.qbar-body.is-changing{opacity:0;}

/* ===== DAY NAV CARDS ===== */

/* ===== DAY EDITORIAL CARD (edition page header) ===== */
.day-editorial-card{

    radial-gradient(circle at 100% 0%, color-mix(in srgb, var(--accent) 14%, transparent) 0%, transparent 45%),

}

      radial-gradient(circle at 100% 0%, color-mix(in srgb, var(--accent) 14%, transparent) 0%, transparent 45%),

      var(--surface);

}
[data-theme="dark"] .day-editorial-card::after{

  z-index:0;
  filter:blur(20px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .day-editorial-card::after{
    content:"";
    position:absolute;
    top:-20px;right:-30px;
    width:280px;height:280px;
    background:radial-gradient(circle, color-mix(in srgb, var(--accent) 8%, transparent) 0%, transparent 60%);
    pointer-events:none;
    z-index:0;
    filter:blur(20px);
  }
}
[data-theme="dark"] .day-editorial-card::after{
  background:radial-gradient(circle, color-mix(in srgb, var(--accent) 8%, transparent) 0%, transparent 60%);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .day-editorial-card::after{

@media(max-width:720px){

/* Mapa de categorias (totais por categoria dentro do day card) */
.day-map-row{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding-top:14px;margin-top:2px;
  border-top:1px dashed var(--border);
}

  font-family:var(--ff-text),system-ui,sans-serif;

}

}

  padding:5px 5px 5px 10px;border-radius:999px;

  border:1px solid var(--border);
  font-family:var(--ff-text),system-ui,sans-serif;
  font-size:12.5px;color:var(--text-2);

}
.day-map-pill:hover{
  border-color:color-mix(in srgb,var(--cc,var(--accent)) 50%,var(--border));

/* ===== DAY NEWS PANEL (filter pills + flat masonry) ===== */
.day-section--news{margin-top:8px}
.day-news-panel{padding:24px 24px 26px}
.day-news-panel .eds-section-hd{margin-bottom:14px}
.day-news-filters{
  display:flex;flex-wrap:wrap;gap:8px;

  padding:14px 24px 18px;

}
.day-news-filter{
  display:inline-flex;align-items:center;gap:7px;

  transition:border-color var(--tr-fast),background var(--tr-fast),color var(--tr-fast);
}
.day-news-filter:hover{border-color:color-mix(in srgb,var(--cc,var(--accent)) 40%,var(--border));color:var(--text)}
.day-news-filter.is-active{

}
.day-news-filter .day-news-filter-count{
  font-size:11px;font-weight:600;color:var(--text-3);

}

}
.day-news-grid{
  display:flex;

}

/* ===== DAY PAGER (prev/next edition) ===== */
.day-pager{
  display:grid;grid-template-columns:1fr 1fr;gap:16px;
  margin-top:56px;padding-top:28px;border-top:1px solid var(--border);
}
.day-pager-card{
  display:flex;align-items:center;gap:16px;
  padding:20px 22px;border-radius:var(--r-md);

}
.day-pager-card:hover .day-pager-arr{color:var(--accent)}
.day-pager-card.prev:hover .day-pager-arr{transform:translateX(-3px)}
.day-pager-card.next:hover .day-pager-arr{transform:translateX(3px)}
.day-pager-body{flex:1;min-width:0}
.day-pager-lbl{
  font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--text-3);margin-bottom:4px;
}
.day-pager-meta{
  font-size:11px;color:var(--text-3);margin-bottom:6px;
  font-variant-numeric:tabular-nums;
}
.day-pager-title{

@media(max-width:640px){.day-pager{grid-template-columns:1fr}}

.day-nav-btns{display:flex;justify-content:space-between;margin-top:48px;padding-top:20px;border-top:1px solid var(--border)}

.empty-state{padding:60px 40px;text-align:center}

.empty-text{font-size:17px;color:var(--text-2)}

.day-nf{

}

.nf-suggest-card{display:flex;flex-direction:column;align-items:flex-start;gap:6px;background:var(--surface);border-radius:var(--r-sm);
  padding:18px 56px 18px 22px;cursor:pointer;

  transition:all .18s var(--ease-spring);
  margin-bottom:24px;min-width:280px;max-width:380px;
}
.nf-suggest-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 1px 2px rgba(0,0,0,0.06),0 12px 28px color-mix(in srgb,var(--accent) 22%,transparent)}

  font-family:var(--ff-text);

}

  font-family:var(--ff-text);
  font-size:11px;font-weight:600;color:var(--text-3);letter-spacing:0.06em;
}
.nf-sc-title{
  font-family:var(--ff-display);

}
.nf-sc-arr{
  position:absolute;right:22px;top:50%;transform:translateY(-50%);

}
.nf-suggest-card:hover .nf-sc-arr{transform:translateY(-50%) translateX(4px)}
.day-nf-btn{
  padding:10px 22px;border-radius:var(--r-sm);

}
.day-nf-btn:hover{background:var(--border)}
.day-nf-btn:active{transform:scale(0.97)}
.day-nf-btn.primary{

}

/* ===== OVERLAY FOR MOBILE SIDEBAR ===== */

  line-height:1.22;letter-spacing:-0.028em;
  margin-bottom:10px;text-wrap:balance;
  color:var(--text);
  transition:color .2s ease;
}
.home-cube-swiper .cube-sum{
  font-size:13.5px;font-weight:400;line-height:1.65;
  color:var(--text-2);margin-bottom:14px;
}
.home-cube-swiper .cube-highlights{
  display:flex;flex-direction:column;gap:6px;
  padding-top:0;padding-bottom:0;
  margin-top:12px;
  text-align:left;
  flex:1;
}
.home-cube-swiper .cube-hl-row{
  display:flex;flex-direction:column;gap:6px;
  padding:9px 0;
  border-top:2px solid rgba(0,0,0,.06);
  transition:border-top-color .18s ease;
  overflow:hidden;
}
.home-cube-swiper .cube-hl-row:not(:has(.cube-hli-media)){position:relative;padding-left:8px;flex:1;padding-bottom:34px}
.home-cube-swiper .cube-hl-row:not(:has(.cube-hli-media))::before{content:'';position:absolute;inset:0 auto 0 0;width:3px;background:linear-gradient(180deg,var(--cat-color,var(--accent)),color-mix(in srgb,var(--cat-color,var(--accent)) 72%,transparent));border-radius:0 2px 2px 0}
.home-cube-swiper .cube-hl-row:has(.cube-hli-media){position:relative;padding:0;border:1px solid var(--border);border-radius:10px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.05);transition:border-color .18s ease,box-shadow .18s ease}
.home-cube-swiper .cube-hl-row:has(.cube-hli-media):hover{border-color:var(--cat-color,var(--accent))!important;box-shadow:0 4px 14px rgba(0,0,0,.10)}
.home-cube-swiper .cube-hl-row:has(.cube-hli-media)::before{content:'';position:absolute;inset:0 auto 0 0;width:4px;background:linear-gradient(180deg,var(--cat-color,var(--accent)),color-mix(in srgb,var(--cat-color,var(--accent)) 72%,transparent));z-index:2}
.home-cube-swiper .cube-hli-media{height:76px;overflow:hidden;line-height:0}
.home-cube-swiper .cube-hli-media img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s ease}
.home-cube-swiper .cube-hl-row:hover .cube-hli-media img{transform:scale(1.10)}
.home-cube-swiper .cube-hli-content{position:relative;padding:15px 10px 10px;background:var(--surface-card)}
.home-cube-swiper .cube-hli-content .cube-hl-cat-text{position:absolute;top:-12px;left:10px;display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:999px;background:color-mix(in srgb,var(--cat-color) 10%,var(--surface-card));border:1px solid color-mix(in srgb,var(--cat-color) 28%,transparent);box-shadow:0 3px 10px rgba(0,0,0,.10);font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.home-cube-swiper .cube-hli-content .cube-hl-text{display:block;font-size:13px;font-weight:700;line-height:1.35;margin-bottom:8px;padding-left:8px}
.home-cube-swiper .cube-hl-row:not(:has(.cube-hli-media)) .cube-hl-meta{position:absolute;bottom:9px;left:8px;right:0}
.home-cube-swiper .cube-hli-content .cube-hl-meta-source{padding:3px 7px;border-radius:999px;background:var(--surface-el);border:1px solid var(--border);font-size:11px;font-weight:700;color:var(--text-2)}
.home-cube-swiper .cube-hli-content .cube-hl-meta-time{display:inline-flex;align-items:center;line-height:1;gap:4px;padding:3px 7px;border-radius:999px;background:var(--surface-el);border:1px solid var(--border);font-size:11px;font-weight:700;color:var(--text-2)}
.home-cube-swiper .cube-hli-content .src-favicon{display:block}
.home-cube-swiper .cube-hl-row:hover{border-top-color:var(--cat-color,var(--accent))!important}
.home-cube-swiper .cube-hl-top{display:flex;align-items:flex-start;gap:10px}
.home-cube-swiper .cube-hl-row .cube-hl-text{color:var(--text)}
.home-cube-swiper .cube-hl-body{
  display:flex;flex-direction:column;gap:4px;flex:1;min-width:0;
}
.home-cube-swiper .cube-hl-badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:2px 8px;border-radius:999px;
  font-size:10px;font-weight:700;letter-spacing:0.4px;text-transform:uppercase;
  white-space:nowrap;align-self:flex-start;
  border:1px solid color-mix(in srgb,currentColor 35%,transparent);
}
.home-cube-swiper .cube-hl-cat-text{
  display:inline-flex;align-items:center;gap:4px;
  font-size:10px;font-weight:700;letter-spacing:0.4px;text-transform:uppercase;
  white-space:nowrap;
}
.home-cube-swiper .cube-hl-wrap{
  position:relative;width:40px;height:40px;flex-shrink:0;
  border-radius:8px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .home-cube-swiper .cube-hl-wrap{outline-color:rgba(255,255,255,.10)}
  :root:not([data-theme="light"]) .home-cube-swiper .cube-hl-row{border-top-color:rgba(255,255,255,.08)}
  :root:not([data-theme="light"]) .home-cube-swiper .cube-foot{border-top-color:rgba(255,255,255,.08)}
}
[data-theme="dark"] .home-cube-swiper .cube-hl-wrap{outline-color:rgba(255,255,255,.10)}
[data-theme="dark"] .home-cube-swiper .cube-hl-row{border-top-color:rgba(255,255,255,.08)}
[data-theme="dark"] .home-cube-swiper .cube-foot{border-top-color:rgba(255,255,255,.08)}
[data-theme="light"] .home-cube-swiper .cube-hl-row{border-top-color:rgba(0,0,0,.03)}
@media(prefers-color-scheme:light){
  :root:not([data-theme="dark"]) .home-cube-swiper .cube-hl-row{border-top-color:rgba(0,0,0,.03)}
}
.home-cube-swiper .cube-hl-img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:contain;border-radius:8px;padding:2px;
}
.home-cube-swiper .cube-hl-text{
  font-size:13px;font-weight:600;line-height:1.46;
  color:var(--text);transition:color .2s ease;
}
.home-cube-swiper .cube-foot{
  display:flex;justify-content:space-between;align-items:center;
  font-size:11.5px;font-weight:500;color:var(--text-3);
  margin-top:auto;padding-top:12px;
  border-top:1px solid var(--border);
}
.home-cube-swiper .cube-foot-cta{color:var(--accent);font-weight:600}
.home-cube-swiper .cube-foot-cta-text{position:relative;display:inline-block}
.home-cube-swiper .cube-foot-cta-text::after{
  content:"";position:absolute;left:0;right:0;bottom:-2px;
  height:1px;background:currentColor;
  transform:scaleX(0);transform-origin:left;
  transition:transform .25s ease;
}
.home-cube-swiper .swiper-slide:hover .cube-foot-cta-text::after{transform:scaleX(1)}
.home-cube-swiper .cube-chip{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 12px;background:var(--surface-el);
  border-radius:999px;font-weight:600;color:var(--text-2);
}
.home-cube-swiper .cube-chip svg{flex-shrink:0;color:var(--accent)}
.home-cube-swiper .cube-chip-sep{margin:0 4px;opacity:.4}
.home-cube-swiper .swiper-pagination{bottom:-24px!important}
.home-cube-swiper .swiper-pagination-bullet{background:currentColor;opacity:.35}
.home-cube-swiper .swiper-pagination-bullet-active{opacity:1}
[data-theme="dark"] .home-cube-swiper .swiper-pagination-bullet{background:#fff}
/* Card estático: mesmo visual do cubo, sem limite de largura */
.hero-cube-static{max-width:100%!important;margin:0!important;position:relative}
.hero-cube-static .cube-num{display:inline-flex}
.hero-cube-static .swiper-slide{cursor:pointer}
.hero-cube-cell .cube-hl-row{cursor:pointer}
.hero-cube-static .cube-kicker{font-size:12px}
.hero-cube-static .cube-headline{font-size:clamp(22px,2.3vw,27px);margin-bottom:10px;letter-spacing:-0.032em;line-height:1.2}
.hero-cube-static .cube-sum{font-size:15px;line-height:1.65;margin-bottom:0;white-space:pre-line}
.hero-cube-static .cube-hl-badge{font-size:10px}
.hero-cube-static .cube-hl-text{font-size:14px}
.hero-cube-static .cube-hl-summary{font-size:13px}
.hero-cube-static .cube-foot{border-top:none;font-size:12px}
.hero-cat-chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 14px}
.hero-cat-chip{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 10px;border-radius:999px;
  font-size:11px;font-weight:600;letter-spacing:.04em;
  background:color-mix(in srgb,var(--cc) 12%,transparent);
  color:var(--cc);
  border:1px solid color-mix(in srgb,var(--cc) 25%,transparent);
  cursor:pointer;transition:background .15s,border-color .15s;
  font-family:inherit;
}
.hero-cat-chip:hover{background:color-mix(in srgb,var(--cc) 22%,transparent);border-color:color-mix(in srgb,var(--cc) 45%,transparent)}
.hero-digest{font-family:var(--ff-text);font-size:14.5px;font-weight:400;line-height:1.62;color:var(--text-2);margin-bottom:14px}
.hero-digest p{margin:0}
.hero-digest p+p{margin-top:0.6em}
.hero-tools-wrap{margin:12px 0 8px;padding-top:12px;border-top:1px solid var(--border)}
.hero-tools-wrap .sb-tile-grid{justify-content:center;gap:6px}
.hero-tiles-row{display:flex;gap:12px;margin:12px 0 8px;padding-top:12px;border-top:1px solid var(--border)}
.hero-tiles-row > .hero-tools-wrap{flex:1;min-width:0;margin:0;padding-top:0;border-top:none}
.hero-tiles-row > .hero-tools-wrap + .hero-tools-wrap{border-left:1px solid var(--border);padding-left:12px}
.hero-cube-static .swiper-slide{overflow:hidden}
.hero-cube-static{padding-top:0}
.cube-mascote-sentado{
  position:absolute;right:-80px;bottom:-100px;
  height:85%;width:auto;left:auto;top:auto;
  pointer-events:none;z-index:0;
  opacity:0.09;
  filter:drop-shadow(0 8px 32px rgba(0,0,0,0.22));
}
.hero-cube-static .swiper-slide::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(to right,var(--surface) 50%,transparent 78%);
  pointer-events:none;z-index:1;
}
[data-theme="dark"] .hero-cube-static .swiper-slide::after,
:root:not([data-theme="light"]) .hero-cube-static .swiper-slide::after{
  background:linear-gradient(to right,#1d1d1f 50%,transparent 78%);
}
[data-theme="light"] .hero-cube-static .swiper-slide::after{
  background:linear-gradient(to right,#ffffff 50%,transparent 78%);
}
/* cube-num já é position:absolute — só sobe z-index sem quebrar posicionamento */
.hero-cube-static .cube-num{z-index:2}
.hero-cube-static .cube-kicker,
.hero-cube-static .cube-headline,
.hero-digest,.hero-cat-chips,.hero-tools-wrap,.hero-tiles-row,.cube-foot{position:relative;z-index:2}
@media(max-width:840px){

}

  .home-cube-swiper .cube-sum{font-size:13px;line-height:1.6}
  .home-cube-swiper .cube-hl-badge{font-size:9px}
  .home-cube-swiper .cube-hl-text{font-size:12.5px}

  /* Fixo — mobile */

  .hero-cube-static .cube-headline{font-size:20px;letter-spacing:-0.025em}
  .hero-cube-static .cube-sum{font-size:14px;line-height:1.62}
  .hero-cube-static .cube-hl-text{font-size:13px}
  .hero-cube-static .cube-hl-summary{font-size:11.5px}

}
/* rotator é só espaçamento — sem fundo nem borda própria */
.cube-hl-rotator{margin-top:14px}

[data-theme="dark"] .home-hl-swiper .swiper-slide{background:var(--surface);box-shadow:none}

.home-hl-swiper .cube-hl-row{padding:0;border-bottom:none;gap:14px;align-items:flex-start}

/* ===== YouTube Carousel ===== */
.yt-carousel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-s)}
.yt-section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
.yt-size-btn{background:none;border:none;padding:0;cursor:pointer;color:var(--accent);display:flex;align-items:center;line-height:1;transition:opacity .15s}
.yt-size-btn:hover{opacity:.7}
.yt-nav-wrap{position:relative}
.yt-nav-btn{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,0.92);border:none;box-shadow:0 1px 2px rgba(0,0,0,0.10),0 6px 16px rgba(0,0,0,0.18);display:flex;align-items:center;justify-content:center;color:#1d1d1f;padding:0;transition:background var(--tr-base),box-shadow var(--tr-base),transform var(--tr-fast);position:absolute;top:35%;z-index:10}
#yt-prev{left:6px}
#yt-next{right:6px}
.yt-nav-btn:hover:not(:disabled){background:#fff;box-shadow:0 1px 2px rgba(0,0,0,0.12),0 10px 24px rgba(0,0,0,0.22);transform:scale(1.06)}
.yt-nav-btn:active:not(:disabled){transform:scale(0.94);transition:transform 0.08s var(--ease-out)}
.yt-nav-btn:disabled{opacity:0.35;pointer-events:none}
.yt-track-wrap{overflow:hidden;line-height:0;padding:12px}
.yt-track{display:flex;gap:8px;transition:transform 0.38s cubic-bezier(0.25,0.46,0.45,0.94)}
.yt-slide{flex:0 0 260px;display:flex;flex-direction:column;gap:0;border-radius:10px;overflow:hidden;background:var(--surface)}
.yt-carousel.yt-large .yt-slide{flex:0 0 300px}
.yt-carousel.yt-large .yt-slide .yt-aspect{width:300px}
.yt-slide-title{font-size:12px;font-weight:500;color:var(--text);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;letter-spacing:-0.224px}
.yt-slide-meta{display:flex;align-items:center;gap:5px;line-height:1.4}
.yt-channel-avatar{width:14px;height:14px;border-radius:50%;object-fit:cover;flex-shrink:0;opacity:.85}
.yt-channel-avatar-fallback{display:inline-flex;align-items:center;justify-content:center;background:color-mix(in srgb, var(--accent) 22%, transparent);color:var(--text2);font-size:9px;font-weight:700;text-transform:uppercase;line-height:1;opacity:.85}
.home-yt-track .yt-channel-avatar-fallback{font-size:11px}
.yt-slide-channel{font-size:10px;color:var(--text-3);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.yt-slide-sep{font-size:10px;color:var(--text-3);flex-shrink:0;opacity:.5}
.yt-slide-date{font-size:10px;color:var(--text-3);white-space:nowrap;flex-shrink:0}
.yt-slide-info{background:transparent;padding:9px 10px 8px;display:flex;flex-direction:column;justify-content:space-between;flex:1;gap:4px}
[data-theme="dark"] .hero-cube-static .yt-slide-title{color:rgba(255,255,255,0.85)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero-cube-static .yt-slide-title{color:rgba(255,255,255,0.85)}}
.yt-aspect{position:relative;width:260px;aspect-ratio:16/9;cursor:pointer;overflow:hidden;border-radius:0;background:#000}
.yt-aspect iframe{position:absolute;inset:0;width:100%;height:100%;border:none;display:block}
.yt-thumb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:filter .25s var(--ease-out)}
.yt-aspect:hover .yt-thumb{filter:brightness(0.78)}
.yt-play-btn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;transition:opacity .2s}
.yt-aspect:hover .yt-play-btn{opacity:1}
.yt-play-btn::before{content:'';width:42px;height:30px;background:#ff0000;border-radius:8px;position:absolute;box-shadow:0 2px 12px rgba(0,0,0,0.5)}
.yt-play-btn::after{content:'';position:absolute;border:8px solid transparent;border-left:14px solid #fff;margin-left:4px}
.yt-duration{
  position:absolute;bottom:7px;right:7px;
  background:rgba(0,0,0,0.88);color:#fff;
  font-size:10px;font-weight:600;letter-spacing:0.01em;
  padding:2px 5px;border-radius:3px;
  pointer-events:none;line-height:1.5;
}
.yt-dots{display:flex;align-items:center;justify-content:center;gap:5px;padding:5px 0 6px;min-height:16px}
.yt-dot{width:5px;height:5px;border-radius:50%;background:var(--border);border:none;padding:0;cursor:pointer;transition:background var(--tr),transform var(--tr)}
.yt-dot.active{background:var(--accent);transform:scale(1.4)}
/* Labels estilo kicker dentro do card fixo */
.card-kicker{font-family:var(--ff-text);font-size:9px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:6px;margin-top:16px;margin-bottom:8px}
.card-kicker::before{content:"";width:14px;height:2px;background:var(--accent);border-radius:2px;flex-shrink:0}
/* carousel integrado dentro do card fixo */
.hero-cube-static .yt-carousel{background:transparent;border:none;box-shadow:none;border-radius:0;margin-top:0;padding-bottom:14px}
.hero-cube-static .yt-track-wrap{border-radius:var(--r-sm)}
/* mini-cards de highlights dentro do card fixo */

/* =============================================================
   CSR · FINAL POLISH · v1 (consolidado)
   Substitui: Professional Polish + Product Pass + Card Design
   Fix + Production Polish. Apenas acabamento visual; nenhum ID,
   classe, evento ou estrutura de DOM foi alterado.
   ============================================================= */

/* ── Design tokens unificados ──────────────────────────────── */
:root {
  /* Layout */
  --sw: 264px;
  --space-page: clamp(18px, 3.6vw, 52px);
  --content-wide: min(1180px, calc(100vw - 48px));
  --content-readable: min(980px, calc(100vw - 48px));
  /* Largura máxima global (alinhamento de TODOS os wrappers) */
  --page-max: min(96vw, 1480px);
  --page-pad: clamp(16px, 3vw, 32px);
  /* Frame interno de .app-layout (padding lateral + column-gap) */
  --app-frame-pad: 12px;
  --app-col-gap: 12px;

  /* Spacing scale (Apple 4pt baseline) */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 20px;
  --s-6: 24px;
  --s-7: 32px;
  --s-8: 48px;

  /* Radii (escala única — Apple §5: cards 8-12px, panéis até 18px) */
  --radius-xs: 5px;
  --radius-sm: 8px;
  --radius-md: 11px;
  --radius-lg: 14px;
  --radius-xl: 18px;
  --radius-pill: 980px;
  --panel-radius: 18px;
  --card-radius: 12px;

  /* Bordas e sombras consistentes — sombra Apple única e suave */
  --panel-border: var(--border);
  --elev-1:
    0 1px 2px rgba(0, 0, 0, .04);
  --elev-2:
    0 1px 2px rgba(0, 0, 0, .05),
    rgba(0, 0, 0, 0.18) 3px 5px 30px 0px;
  --elev-3:
    0 1px 2px rgba(0, 0, 0, .06),
    rgba(0, 0, 0, 0.22) 3px 5px 30px 0px;
  --elev-4:
    0 1px 2px rgba(0, 0, 0, .07),
    rgba(0, 0, 0, 0.26) 3px 6px 38px 0px;
  /* Aliases legados — agora apontam para a escala em camadas */
  --shadow-card: var(--elev-2);
  --shadow-card-hover: var(--elev-3);
  --shadow-soft: var(--elev-1);

  /* Foco unificado — anel mais sutil, mais Apple */
  --focus-ring: 0 0 0 3px color-mix(in srgb, var(--accent) 24%, transparent);
}
/* ── Dark mode redesign (paleta Apple — preto puro + cinema) ─ */
[data-theme="dark"] {
  --bg:        #000000;
  --bg-alt:    #000000;
  --surface:   #1c1c1e;
  --surface-el:#2a2a2d;
  --surface-card: #272729;
  --nav-bg:    rgba(0,0,0,.8);
  --text:      #f5f5f7;
  --text-2:    rgba(255,255,255,.8);
  --text-3:    rgba(255,255,255,.48);
  --text-dim:  rgba(255,255,255,.48);
  --text-soft: rgba(255,255,255,.30);
  --border:    rgba(255,255,255,.10);
  --accent:    #2997ff;
  --accent-h:  #409cff;
  --link:      #2997ff;
  --shadow:    0 1px 2px rgba(0,0,0,.40), 0 8px 24px rgba(0,0,0,.30);
  --shadow-s:  0 1px 2px rgba(0,0,0,.30), 0 4px 14px rgba(0,0,0,.25);
  --panel-border: rgba(255,255,255,.10);
  --elev-1:
    0 1px 2px rgba(0, 0, 0, .30);
  --elev-2:
    0 1px 2px rgba(0, 0, 0, .40),
    0 8px 24px rgba(0, 0, 0, .30);
  --elev-3:
    0 1px 2px rgba(0, 0, 0, .50),
    0 14px 38px rgba(0, 0, 0, .42);
  --elev-4:
    0 1px 2px rgba(0, 0, 0, .55),
    0 22px 56px rgba(0, 0, 0, .50);
  --shadow-card: var(--elev-2);
  --shadow-card-hover: var(--elev-3);
  --shadow-soft: var(--elev-1);
  --focus-ring: 0 0 0 3px color-mix(in srgb, var(--accent) 28%, transparent);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:        #000000;
    --bg-alt:    #000000;
    --surface:   #1c1c1e;
    --surface-el:#2a2a2d;
    --surface-card: #272729;
    --nav-bg:    rgba(0,0,0,.8);
    --text:      #f5f5f7;
    --text-2:    rgba(255,255,255,.8);
    --text-3:    rgba(255,255,255,.48);
    --text-dim:  rgba(255,255,255,.48);
    --text-soft: rgba(255,255,255,.30);
    --border:    rgba(255,255,255,.10);
    --accent:    #2997ff;
    --accent-h:  #409cff;
    --link:      #2997ff;
    --shadow:    0 1px 2px rgba(0,0,0,.40), 0 8px 24px rgba(0,0,0,.30);
    --shadow-s:  0 1px 2px rgba(0,0,0,.30), 0 4px 14px rgba(0,0,0,.25);
    --panel-border: rgba(255,255,255,.10);
    --elev-1:
      0 1px 2px rgba(0, 0, 0, .30);
    --elev-2:
      0 1px 2px rgba(0, 0, 0, .40),
      0 8px 24px rgba(0, 0, 0, .30);
    --elev-3:
      0 1px 2px rgba(0, 0, 0, .50),
      0 14px 38px rgba(0, 0, 0, .42);
    --elev-4:
      0 1px 2px rgba(0, 0, 0, .55),
      0 22px 56px rgba(0, 0, 0, .50);
    --shadow-card: var(--elev-2);
    --shadow-card-hover: var(--elev-3);
    --shadow-soft: var(--elev-1);
    --focus-ring: 0 0 0 3px color-mix(in srgb, var(--accent) 28%, transparent);
  }
}

/* ── Body & background ─────────────────────────────────────── */
body {
  font-family: var(--ff-text);
  letter-spacing: -0.022em;
  font-feature-settings: "kern", "liga", "calt";
  background: var(--bg);
}
[data-theme="dark"] body {
  background: var(--bg);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) body {
    background: var(--bg);
  }
}

/* ── Foco global acessível e consistente ──────────────────── */
:where(button, a, [onclick]) { -webkit-tap-highlight-color: transparent; }
:where(button, a, input, [tabindex]):focus-visible {
  outline: 2px solid color-mix(in srgb, var(--accent) 70%, transparent);
  outline-offset: 2px;
  box-shadow: var(--focus-ring);
  border-radius: inherit;
  transition: outline-color var(--tr-fast), box-shadow var(--tr-fast);
}

/* ── Nav refinado ──────────────────────────────────────────── */
.nav { border-bottom-color: color-mix(in srgb, var(--border) 78%, transparent); }
/* Nav alinhado com o resto da app (mesmo --page-max e --page-pad) */
.nav-inner { max-width: var(--page-max); padding: 0 var(--page-pad); }
.nav-logo { letter-spacing: -0.055em; }

/* ── App layout — token-driven ─────────────────────────────── */
.app-layout {
  max-width: var(--page-max);
  padding: var(--app-frame-pad) var(--page-pad);
  column-gap: var(--app-col-gap);
  grid-template-columns: var(--sw) minmax(0, 1fr);
}
.content-main { border-radius: var(--panel-radius); min-width: 0; background: transparent; }
body[data-view="home"] .content-main { border-radius: 0; }

/* ── Quote bar host — alinhado com a coluna de conteúdo ────── */
.qbar-host {
  left: calc(max(0px, (100vw - var(--page-max)) / 2) + var(--page-pad) + var(--app-frame-pad) + var(--sw) + var(--app-col-gap));
  right: calc(max(0px, (100vw - var(--page-max)) / 2) + var(--page-pad) + var(--app-frame-pad));
  padding: 0;
}
body.sidebar-collapsed .qbar-host {
  left: calc(max(0px, (100vw - var(--page-max)) / 2) + var(--page-pad) + var(--app-frame-pad));
  right: calc(max(0px, (100vw - var(--page-max)) / 2) + var(--page-pad) + var(--app-frame-pad));
}

/* =============================================================
   SIDEBAR — refinada e consistente
   ============================================================= */
.sidebar-left {
  border-radius: var(--panel-radius);
  background: var(--surface);
  border-color: var(--panel-border);
  box-shadow:
    0 1px 2px rgba(0, 0, 0, .04),
    0 8px 24px rgba(0, 0, 0, .06);
}
[data-theme="dark"] .sidebar-left {
  background: var(--surface);
  box-shadow:
    0 1px 2px rgba(0, 0, 0, .40),
    0 12px 32px rgba(0, 0, 0, .35);
}

/* Brand icon — assinatura no topo da sidebar */
.sb-brand {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 14px 6px;
}
.brand-icon {
  width: 42px; height: 42px;
  border-radius: 16px;
  background: linear-gradient(135deg,
    color-mix(in srgb, var(--accent) 22%, transparent),
    color-mix(in srgb, var(--accent) 8%, transparent));
  border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--border));
  display: grid; place-items: center;
  box-shadow: 0 1px 2px rgba(0,0,0,0.08), 0 6px 20px color-mix(in srgb, var(--accent) 14%, transparent);
  overflow: hidden; flex-shrink: 0;
}
.brand-icon img {
  width: 42px; height: 42px;
  object-fit: cover;
  transform: scale(1.28);
  object-position: center 18%;
}
.sb-brand-name {
  font-family: var(--ff-display);
  font-weight: 800; letter-spacing: -.04em;
  font-size: 16px; line-height: 1;
  color: var(--text);
}
.sb-brand-name .sb-brand-news {
  background: var(--accent); color: #fff;
  font-size: 11px; padding: 3px 5px;
  border-radius: 6px; line-height: 1; margin-left: 2px;
}
.sb-brand-sub {
  font-size: 11px; color: var(--text-3);
  margin-top: 4px; font-weight: 600;
}

/* Overview da edição em destaque */
.sb-overview {
  margin: 10px 10px 10px;
  padding: 13px 14px;
  border-radius: var(--radius-md);
  border: 1px solid color-mix(in srgb, var(--accent) 18%, var(--border));
  background: linear-gradient(135deg,
    color-mix(in srgb, var(--accent) 12%, var(--surface)) 0%,
    color-mix(in srgb, var(--surface) 92%, transparent) 100%);
  text-align: left;
  display: flex; flex-direction: column; gap: 4px;
  color: var(--text); cursor: pointer;
  transition: transform .18s var(--ease-out), border-color .18s, background .18s;
}
.sb-overview:hover {
  transform: translateY(-1px);
  border-color: color-mix(in srgb, var(--accent) 36%, var(--border));
}
.sb-overview-kicker { font-size: 10.5px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; color: var(--accent); }
.sb-overview-title { font-size: 14px; font-weight: 700; letter-spacing: -.025em; line-height: 1.2; }
.sb-overview-date { font-size: 12px; color: var(--text-3); font-weight: 600; }
.sb-overview-stats { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
.sb-overview-stats span {
  font-size: 11px; font-weight: 600; color: var(--text-2);
  background: color-mix(in srgb, var(--surface-el) 82%, transparent);
  border: 1px solid var(--border);
  border-radius: var(--radius-pill);
  padding: 2px 7px;
}

/* Calendário compacto na sidebar */
.cal-mod { padding: 10px 10px 8px; margin: 0; border-bottom: 1px solid var(--panel-border); }
.cal-bar {
  display: flex; align-items: center; gap: 4px;
  background: color-mix(in srgb, var(--surface-el) 82%, transparent);
  border: 1px solid var(--border);
  border-radius: var(--radius-pill);
  padding: 3px;
}
.cal-display { font-weight: 700; letter-spacing: -.02em; }
.cal-display:hover { background: var(--surface); }

/* Section headers */
.sb-section { border-top-color: color-mix(in srgb, var(--border) 72%, transparent); }
.sb-section-hdr {
  padding: 12px 16px 8px;
  background: transparent;
  color: var(--accent);
  font-size: 11px; font-weight: 700; letter-spacing: .11em;
}
.sb-section-hdr-left svg { color: var(--accent); }

/* Ícones da sidebar */
.sb-icon { border-radius: var(--radius-sm); }

/* Itens da sidebar */
.sb-item {
  margin: 1px 10px 1px 14px;
  padding: 7px 10px 7px 9px;
  border-radius: var(--radius-md);
  font-size: 13.5px;
  border-left-width: 2px;
}
.sb-item.active { font-weight: 700; }

/* Tiles (ferramentas e linguagens) */
.sb-icon-section { padding: 6px 12px 14px; }
.sb-subgroup { margin-bottom: 10px; }
.sb-subgroup-lbl {
  justify-content: center;
  padding-left: 0;
  color: var(--text-3);
  letter-spacing: .08em;
  font-size: 10.5px; font-weight: 700;
}
.sb-tile-grid { gap: 6px; justify-content: center; }
.sb-tile-grid-langs { justify-content: center; }
.sb-tile { width: 39px; height: 39px; border-radius: 10px; opacity: .94; }
.sb-tile-lang { width: 45px; height: 45px; border-radius: 12px; }
.sb-tile:hover {
  transform: translateY(-2px) scale(1.08);
  box-shadow: 0 10px 26px color-mix(in srgb, var(--tc, #888) 18%, transparent);
}
[data-theme="dark"] .sb-tile:hover {
  box-shadow: 0 12px 30px color-mix(in srgb, var(--tc, #888) 30%, transparent);
}

/* =============================================================
   HOME — hero, cube, sections
   ============================================================= */
/* Wrappers top-level: largura total da coluna de conteúdo.
   Alinhamento horizontal compartilhado com qbar, day-header, ent-hero, etc.
   Padding interno mínimo — o respiro lateral fica em --page-pad de .app-layout. */
.home-hero {
  max-width: none; margin: 0;
  padding: clamp(8px, 1.2vw, 14px) 0 18px;
}
.home-section {
  max-width: none; margin: 18px 0 0;
  padding: 0;
}

/* Cube hero estático */
.home-cube-swiper.hero-cube-static .swiper-slide {
  min-height: clamp(430px, 48vw, 620px);
  border-radius: var(--radius-xl);
  padding: clamp(22px, 3vw, 36px);
  border-color: var(--panel-border);
  box-shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 12px 32px rgba(15, 23, 42, .08), 0 32px 80px rgba(15, 23, 42, .08);
  display: flex; flex-direction: column;
  justify-content: flex-end;
  isolation: isolate;
}
[data-theme="dark"] .hero-cube-static .swiper-slide {
  box-shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 16px 40px rgba(0, 0, 0, .35), 0 36px 80px rgba(0, 0, 0, .30);
}
.hero-cube-static .swiper-slide::after {
  content: "";
  position: absolute; inset: auto 0 0 0;
  height: 48%;
  background: linear-gradient(180deg, transparent, color-mix(in srgb, var(--surface-card) 84%, transparent));
  pointer-events: none; z-index: -1;
}
.hero-cube-static .cube-headline {
  max-width: 920px;
  font-weight: 700;
  letter-spacing: -.038em;
}
.hero-digest {
  max-width: 88ch;
  font-size: 15px;
  line-height: 1.72;
  letter-spacing: -.012em;
}

/* Meta da capa (chips) */
.home-cover-meta {
  display: flex; align-items: center; flex-wrap: wrap;
  gap: 8px; margin: 0 0 16px;
  color: var(--text-2);
}
.home-cover-meta span {
  display: inline-flex; align-items: center;
  min-height: 26px; padding: 4px 10px;
  border-radius: var(--radius-pill);
  border: 1px solid var(--border);
  background: color-mix(in srgb, var(--surface-card) 72%, transparent);
  font-size: 11px; font-weight: 700;
  letter-spacing: .04em; text-transform: uppercase;
}
.home-cover-meta .home-cover-ed {
  color: var(--accent);
  border-color: color-mix(in srgb, var(--accent) 30%, var(--border));
  background: color-mix(in srgb, var(--accent) 9%, var(--surface-card));
}

/* CTA da capa */
.home-cover-actions {
  display: flex; align-items: center; flex-wrap: wrap;
  gap: 12px; margin-top: 22px;
}
.home-cover-primary {
  min-height: 42px; padding: 0 18px;
  border: 0; border-radius: var(--radius-pill);
  background: var(--accent); color: #fff;
  font-size: 13px; font-weight: 700;
  letter-spacing: -.01em; cursor: pointer;
  box-shadow: 0 1px 2px rgba(0,0,0,0.10), 0 8px 22px color-mix(in srgb, var(--accent) 28%, transparent);
  transition: background var(--tr-base), transform var(--tr-fast), box-shadow var(--tr-base);
}
.home-cover-primary:hover {
  background: var(--accent-h);
  transform: translateY(-1px);
  box-shadow: 0 1px 2px rgba(0,0,0,0.12), 0 14px 32px color-mix(in srgb, var(--accent) 38%, transparent);
}
.home-cover-primary:active { transform: translateY(0) scale(.98); transition: transform 0.08s var(--ease-out); }
.home-cover-note { font-size: 13px; color: var(--text-3); font-weight: 600; }
.home-section-sub {
  max-width: 66ch; margin: 6px 0 0;
  color: var(--text-3);
  font-size: 13.5px; line-height: 1.55;
}

/* Hierarquia tipográfica das seções (Apple SF Pro Display tightening) */
.home-sect-title, .sect-title {
  font-family: var(--ff-display);
  font-weight: 700;
  letter-spacing: -.028em;
}
.day-hero-title, .ent-hero-name {
  font-family: var(--ff-display);
  font-weight: 700;
  letter-spacing: -.036em;
}
.home-sect-kicker, .sect-kicker, .card-kicker {
  letter-spacing: .15em;
  font-weight: 700;
  position: relative;
  padding-left: 44px;
}
.home-sect-kicker::before, .sect-kicker::before, .card-kicker::before {
  content: ""; position: absolute;
  left: 0; top: 50%; transform: translateY(-50%);
  width: 34px; height: 2px;
  background: var(--accent);
  border-radius: 2px;
}
[data-theme="dark"] .home-sect-kicker::before,
[data-theme="dark"] .sect-kicker::before,
[data-theme="dark"] .card-kicker::before {
  box-shadow: none;
}

/* hcv-pulse — badges urgentes não pulsam em sincronia */
.hcv-pulse { animation-delay: calc(var(--hcv-i, 0) * .15s); }

/* Stagger blur mais suave no dark */
[data-theme="dark"] .stagger-in { filter: blur(3px); }

/* Section head (título + meta) */
.section-head {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 18px; margin: 36px 0 14px;
}
.section-head .sect-title { margin: 6px 0 0; }
.section-meta {
  flex: 0 0 auto;
  color: var(--text-3);
  font-size: 12.5px; font-weight: 700;
  letter-spacing: .08em; text-transform: uppercase;
}

/* Card de favoritos (painel) */
.fav-card {
  border-radius: var(--radius-xl);
  padding: clamp(20px, 2.6vw, 34px);
  background: color-mix(in srgb, var(--surface) 82%, transparent);
  border: 1px solid var(--panel-border);
  box-shadow: var(--elev-2);
}
[data-theme="dark"] .fav-card { box-shadow: var(--elev-3); }

/* =============================================================
   CARDS UNIVERSAIS — sombras e bordas consistentes
   ============================================================= */
.fav-card, .day-digest, .news-card, .hl-card, .tool-card,
.source-card, .quote-pg-card, .day-nav-card,
.rel-card, .nf-suggest-card {
  box-shadow: var(--shadow-card);
}
.fav-card:hover, .news-card:hover, .hl-card:hover, .tool-card:hover,
.source-card:hover, .quote-pg-card:hover, .day-nav-card:hover,
.rel-card:hover, .nf-suggest-card:hover {
  box-shadow: var(--shadow-card-hover);
}
[data-theme="dark"] .hl-card:hover,
[data-theme="dark"] .tool-card:hover,
[data-theme="dark"] .source-card:hover {
  border-color: rgba(255,255,255,.18);
}

/* News card — padrão "media estoura padding" preservado */
.news-card {
  position: relative;
  padding: 20px;
  border-radius: var(--card-radius);
  border: 1px solid color-mix(in srgb, var(--border) 92%, transparent);
  background: linear-gradient(180deg,
    color-mix(in srgb, var(--surface-card) 96%, var(--surface-el) 4%),
    var(--surface-card));
  overflow: hidden;
}
.news-card::before {
  content: '';
  position: absolute;
  inset: 0 0 auto 0;
  height: 4px;
  background: linear-gradient(90deg, var(--lc, var(--accent)), color-mix(in srgb, var(--lc, var(--accent)) 70%, #fff));
  z-index: 3;
  pointer-events: none;
}
.news-card.urgent::before {
  background: linear-gradient(90deg, #FF453A, color-mix(in srgb, #FF453A 70%, #fff));
}
[data-theme="dark"] .news-card {
  border-color: rgba(255, 255, 255, .085);
  background: linear-gradient(180deg,
    color-mix(in srgb, var(--surface-card) 92%, var(--surface-el) 8%),
    var(--surface-card));
}
.news-card:hover {
  border-color: var(--lc, var(--accent));
}
.news-card + .news-card { margin-top: 12px; }
.hl-grid .news-card { margin: 0; }
.tl-day-items .news-card { margin: 0; }

/* News-card meta row */
.nc-meta {
  display: flex; align-items: center; flex-wrap: nowrap;
  gap: 8px; margin: 0 0 12px;
  color: var(--text-3);
  font-size: 11.5px; font-weight: 700;
  min-height: 28px;
  min-width: 0;
}
.nc-read-time {
  display: inline-flex; align-items: center; gap: 4px;
  color: var(--text-3);
  white-space: nowrap;
  flex-shrink: 0;
}
.nc-meta .nc-source-top { flex-shrink: 0; margin-left: auto; }
.nc-meta .nc-read-time { margin-left: auto; }
.nc-meta .nc-source-top + .nc-read-time { margin-left: 0; }
.nc-meta-pill {
  display: inline-flex; align-items: center; gap: 5px;
  min-height: 24px; padding: 3px 9px;
  border-radius: var(--radius-pill);
  background: color-mix(in srgb, var(--lc, var(--accent)) 9%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--lc, var(--accent)) 22%, var(--border));
  color: color-mix(in srgb, var(--lc, var(--accent)) 84%, var(--text));
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.nc-source-top {
  display: inline-flex; align-items: center;
  min-height: 26px; padding: 4px 10px;
  border-radius: var(--radius-pill);
  border: 1px solid var(--border);
  background: color-mix(in srgb, var(--surface-el) 58%, transparent);
  color: var(--text-2);
  font-weight: 700;
}
[data-theme="dark"] .nc-source-top {
  background: rgba(255, 255, 255, .045);
  border-color: rgba(255, 255, 255, .08);
}

.nc-title {
  max-width: 78ch;
  font-size: 17.5px; font-weight: 700;
  line-height: 1.34; letter-spacing: -.03em;
}
.nc-title a { text-decoration: none; }
.nc-summary {
  max-width: 92ch;
  margin-top: 10px;
  color: color-mix(in srgb, var(--text) 66%, transparent);
  font-size: 14.5px; line-height: 1.7;
}
[data-theme="dark"] .nc-summary { color: rgba(255, 255, 255, .68); }

.nc-footer {
  display: flex; flex-direction: column; gap: 10px;
  margin-top: 14px; padding-top: 12px;
  border-top: 1px solid color-mix(in srgb, var(--border) 72%, transparent);
}
.nc-footer .tags { min-width: 0; margin: 0; justify-content: center; flex-wrap: wrap; width: 100%; }
.nc-footer-row {
  display: flex; align-items: center; gap: 10px;
  width: 100%;
  min-height: 28px;
}
.nc-footer-row .nc-open { margin-right: auto; }
.nc-footer-row .mini-btn.bm { margin-left: auto; }
.nc-open { white-space: nowrap; font-size: 11.5px; font-weight: 700; color: var(--accent); }
.nc-open:hover { text-decoration: none; color: var(--accent-h); }

/* Tags / chips */
.tags { margin-left: auto; justify-content: flex-end; }
.tag {
  border: 1px solid var(--border);
  background: color-mix(in srgb, var(--surface-el) 78%, transparent);
  font-weight: 600;
}

/* Mídia que estoura padding */
.news-card .nc-media,
.tl-item-s .nc-media {
  border: 0;
  background: var(--surface-el);
  overflow: hidden;
}
.news-card .nc-media-photo,
.tl-item-s .nc-media-photo,
.news-card .nc-media-source,
.tl-item-s .nc-media-source {
  position: relative;
  width: calc(100% + 40px);
  aspect-ratio: 16 / 9;
  height: auto;
  margin: -20px -20px 18px;
  border: 0;
  border-radius: var(--card-radius) var(--card-radius) 0 0;
  overflow: hidden;
}
.news-card .nc-media-source,
.tl-item-s .nc-media-source {
  display: flex; align-items: center; justify-content: center;
  background:
    radial-gradient(circle at 22% 20%,
      color-mix(in srgb, var(--lc, var(--accent)) 24%, transparent), transparent 38%),
    linear-gradient(135deg,
      color-mix(in srgb, var(--surface-el) 82%, var(--surface-card)),
      var(--surface-card));
}
[data-theme="dark"] .news-card .nc-media-source,
[data-theme="dark"] .tl-item-s .nc-media-source {
  background:
    radial-gradient(circle at 22% 20%,
      color-mix(in srgb, var(--lc, var(--accent)) 30%, transparent), transparent 42%),
    linear-gradient(135deg, rgba(255, 255, 255, .07), rgba(255, 255, 255, .025));
}
.news-card .nc-media-source::before,
.tl-item-s .nc-media-source::before {
  content: "";
  position: absolute; inset: 18px;
  border: 1px solid color-mix(in srgb, var(--border) 72%, transparent);
  border-radius: var(--card-radius);
  pointer-events: none;
}
.news-card .nc-media-source img,
.tl-item-s .nc-media-source img {
  width: min(96px, 28%);
  height: min(96px, 52%);
  object-fit: contain;
  border-radius: var(--radius-lg);
  padding: 14px;
  background: color-mix(in srgb, var(--surface-card) 82%, transparent);
  box-shadow:
    0 18px 45px rgba(0, 0, 0, .12),
    0 0 0 1px color-mix(in srgb, var(--border) 90%, transparent);
}
[data-theme="dark"] .news-card .nc-media-source img,
[data-theme="dark"] .tl-item-s .nc-media-source img {
  background: rgba(255, 255, 255, .08);
  box-shadow: 0 18px 45px rgba(0, 0, 0, .34), 0 0 0 1px rgba(255, 255, 255, .09);
}
.news-card .nc-media-source::after,
.tl-item-s .nc-media-source::after {
  content: "";
  position: absolute; inset: auto 0 0;
  height: 38%;
  background: linear-gradient(180deg, transparent,
    color-mix(in srgb, var(--surface-card) 75%, transparent));
  pointer-events: none;
}
[data-theme="dark"] .news-card .nc-media-source::after,
[data-theme="dark"] .tl-item-s .nc-media-source::after {
  background: linear-gradient(180deg, transparent, rgba(0, 0, 0, .18));
}
/* ===== Source-fallback nos cards de DESTAQUES (hero-hl, cube-hl) ===== */
.hero-hl-img-banner.is-source,
.cube-hli-media.is-source {
  position: relative;
  display: flex !important; align-items: center; justify-content: center;
  overflow: hidden;
  background:
    radial-gradient(circle at 22% 20%,
      color-mix(in srgb, var(--cat-color, var(--accent)) 24%, transparent), transparent 42%),
    linear-gradient(135deg,
      color-mix(in srgb, var(--surface-el) 82%, var(--surface-card)),
      var(--surface-card)) !important;
}
[data-theme="dark"] .hero-hl-img-banner.is-source,
[data-theme="dark"] .cube-hli-media.is-source {
  background:
    radial-gradient(circle at 22% 20%,
      color-mix(in srgb, var(--cat-color, var(--accent)) 32%, transparent), transparent 46%),
    linear-gradient(135deg, rgba(255, 255, 255, .07), rgba(255, 255, 255, .025)) !important;
}
.hero-hl-img-banner.is-source::before,
.cube-hli-media.is-source::before {
  content: "";
  position: absolute; inset: 14px;
  border: 1px solid color-mix(in srgb, var(--border) 65%, transparent);
  border-radius: 12px;
  pointer-events: none;
  z-index: 1;
}
.cube-hli-media.is-source::before { inset: 8px; border-radius: 8px; }
.hero-hl-img-banner.is-source::after,
.cube-hli-media.is-source::after {
  content: "";
  position: absolute; inset: auto 0 0;
  height: 38%;
  background: linear-gradient(180deg, transparent,
    color-mix(in srgb, var(--surface-card) 75%, transparent));
  pointer-events: none;
  z-index: 1;
}
[data-theme="dark"] .hero-hl-img-banner.is-source::after,
[data-theme="dark"] .cube-hli-media.is-source::after {
  background: linear-gradient(180deg, transparent, rgba(0, 0, 0, .22));
}
/* Override do <img>: anula o height:100%!important e cover originais */
.hero-hl-img-banner.is-source img,
.cube-hli-media.is-source img {
  width: auto !important;
  height: auto !important;
  max-width: 56% !important;
  max-height: 62% !important;
  object-fit: contain !important;
  padding: 10px !important;
  background: color-mix(in srgb, var(--surface-card) 82%, transparent) !important;
  border-radius: 12px !important;
  box-shadow:
    0 10px 28px rgba(0, 0, 0, .14),
    0 0 0 1px color-mix(in srgb, var(--border) 80%, transparent) !important;
  transform: none !important;
  filter: none !important;
  position: relative;
  z-index: 2;
}
.cube-hli-media.is-source img {
  max-width: 50% !important;
  max-height: 56% !important;
  padding: 6px !important;
  border-radius: 8px !important;
}
[data-theme="dark"] .hero-hl-img-banner.is-source img,
[data-theme="dark"] .cube-hli-media.is-source img {
  background: rgba(255, 255, 255, .08) !important;
  box-shadow: 0 10px 28px rgba(0, 0, 0, .38), 0 0 0 1px rgba(255, 255, 255, .09) !important;
}
/* Hover não anima o ícone-fonte */
.hero-hl-card:hover .hero-hl-img-banner.is-source img,
.cube-hl-row:hover .cube-hli-media.is-source img {
  transform: none !important;
  filter: none !important;
}
.news-card .nc-media-photo img,
.tl-item-s .nc-media-photo img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
  transition: transform .24s ease, filter .24s ease;
}
.news-card:hover .nc-media-photo img,
.tl-item-s:hover .nc-media-photo img {
  transform: scale(1.025);
  filter: saturate(1.04) contrast(1.03);
}

.tl-item-s .nc-media-photo,
.tl-item-s .nc-media-source {
  width: calc(100% + 36px);
  margin: -16px -16px 16px -20px;
  border-radius: var(--radius-md) var(--radius-md) 0 0;
}

/* Highlight cards (com cover) */
.hl-card, .tool-card {
  border-radius: var(--card-radius);
  border: 1px solid var(--panel-border);
}
.hl-card {
  overflow: hidden;
  padding: 0;
  gap: 0;
}
.hl-card-top { padding-bottom: 2px; }
.hl-title {
  font-size: 16px; font-weight: 700;
  letter-spacing: -.026em;
}
.hl-summary { font-size: 13.5px; line-height: 1.6; }
.hl-card .nc-media { background: var(--surface-el); }
.hl-card .nc-media-photo {
  position: relative;
  width: 100%;
  height: clamp(170px, 22vw, 245px);
  margin: 0;
  border: 0; border-radius: 0;
}
.hl-card .nc-media-photo::after {
  content: "";
  position: absolute; inset: auto 0 0;
  height: 44%;
  background: linear-gradient(180deg, transparent, rgba(0, 0, 0, .34));
  pointer-events: none;
}
.hl-card .nc-media-photo img {
  display: block; width: 100%; height: 100%;
  object-fit: cover;
  transition: transform .24s ease, filter .24s ease;
}
.hl-card:hover .nc-media-photo img {
  transform: scale(1.035);
  filter: saturate(1.05) contrast(1.03);
}
.hl-card-body {
  display: flex; flex: 1; flex-direction: column;
  gap: 10px; padding: 18px;
}
.hl-card.has-cover .hl-card-body { padding-top: 16px; }
.hl-card .hl-footer {
  margin-top: auto;
  padding-top: 10px;
  border-top: 1px solid color-mix(in srgb, var(--border) 72%, transparent);
}

.hl-grid, .tools-grid { gap: 16px; }

/* =============================================================
   DAY VIEW
   ============================================================= */
/* Largura total da coluna de conteúdo — alinha com home-hero, qbar, etc.
   A largura legível de texto é controlada nos elementos internos (h1, p). */
.day-header, .day-content, .ent-hero,
.tl-list-grouped, .rel-section {
  max-width: none;
  margin-left: 0;
  margin-right: 0;
}
.day-header {
  position: relative;
  border: 1px solid var(--panel-border);
  border-radius: var(--radius-xl);
  background: var(--surface-card);
  box-shadow: var(--elev-2);
  margin-top: 18px;
  padding-top: clamp(34px, 5vw, 60px);
  overflow: hidden;
}
.day-header::before {
  content: "";
  position: absolute; inset: 0 auto 0 0;
  width: 4px;
  background: var(--accent);
}
.day-hero-desc { max-width: 74ch; }

.day-eyebrow {
  width: max-content; max-width: 100%;
  padding: 5px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-pill);
  background: color-mix(in srgb, var(--surface-el) 70%, transparent);
}

.day-topic-strip {
  display: flex; align-items: center; flex-wrap: wrap;
  gap: 8px; margin: 22px 0 0;
}
.day-topic-label {
  color: var(--text-3);
  font-size: 11px; font-weight: 800;
  letter-spacing: .13em; text-transform: uppercase;
}
.day-topic-pill {
  min-height: 30px;
  display: inline-flex; align-items: center; gap: 7px;
  border: 1px solid color-mix(in srgb, var(--cc, var(--accent)) 26%, var(--border));
  border-radius: var(--radius-pill);
  background: color-mix(in srgb, var(--cc, var(--accent)) 9%, var(--surface));
  color: var(--text);
  padding: 4px 12px;
  font-size: 12.5px; font-weight: 700;
  cursor: pointer;
  transition: color .15s, transform .15s, background .15s;
}
.day-topic-pill:hover {
  color: var(--cc, var(--accent));
  transform: translateY(-1px);
}
.day-topic-pill-more {
  cursor: default;
  color: var(--text-3);
  border-color: var(--border);
  background: color-mix(in srgb, var(--surface-el) 70%, transparent);
}
.day-topic-pill-more:hover { color: var(--text-3); transform: none; }

.day-stats { gap: 14px; }
.day-stat {
  min-width: 120px;
  padding: 12px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: color-mix(in srgb, var(--surface) 78%, transparent);
  box-shadow: 0 1px 0 rgba(255, 255, 255, .35) inset;
}

.day-content { display: flex; flex-direction: column; gap: 18px; }
.day-digest {
  border: 1px solid color-mix(in srgb, var(--accent) 18%, var(--border));
  border-left: 5px solid var(--accent);
  border-radius: var(--radius-lg);
  background: linear-gradient(135deg,
    color-mix(in srgb, var(--accent) 8%, var(--surface-card)),
    var(--surface-card));
}
.day-digest-text { font-size: 15px; color: var(--text-2); line-height: 1.65; }

/* Cat group card */
.cat-group {
  margin: 4px 0 22px;
  padding: 18px;
  border: 1px solid var(--panel-border);
  border-radius: 22px;
  background: color-mix(in srgb, var(--surface-card) 80%, transparent);
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 16px;
}
.cat-group > .cat-group-hdr {
  grid-column: 1 / -1;
}
.cat-group > .news-card {
  margin: 0;
}
.cat-group-hdr {
  margin: -4px 0 0;
  padding: 0 0 14px;
  border-bottom: 0;
}
.cat-group-hdr .cg-icon,
.cat-group-hdr > span:first-child {
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--cc, var(--accent)) 24%, transparent) inset;
}
.cg-name {
  font-size: 21px;
  font-weight: 850;
  letter-spacing: -.035em;
}
.cg-count {
  font-weight: 700;
  color: var(--text-3);
}

/* Timeline list grouped */
.tl-list-grouped { padding-bottom: 80px; }
.tl-day-items {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 16px;
  padding-left: 0;
  border-left: 0;
  margin-left: 0;
}
.tl-date-hdr {
  position: static;
  background: transparent;
  margin: 34px 0 14px;
}
.tl-date-link {
  padding: 0 0 12px;
  border-radius: 0;
  background: transparent;
}
.tl-date-link:hover { background: transparent; }
.tl-day-items .news-card { margin: 0; }

.tl-item-s {
  border-radius: var(--radius-md);
  padding: 16px 16px 16px 20px;
  margin: 6px 0;
  background: color-mix(in srgb, var(--surface-card) 82%, transparent);
  border: 1px solid var(--panel-border);
}
.tl-item-s::before { left: -6px; top: 24px; }
.tl-item-s .tl-summary { line-height: 1.66; }

/* Explain (júnior/pleno/sênior) */
.tl-explain {
  display: block;
  margin: 14px 0 2px;
  padding: 6px 10px;
  border-radius: var(--radius-md);
  border: 1px solid color-mix(in srgb, var(--border) 80%, transparent);
  background: color-mix(in srgb, var(--surface-el) 48%, transparent);
  overflow: hidden;
  transition: border-color .2s var(--ease-out), background .2s var(--ease-out), padding .2s var(--ease-out);
}
[data-theme="dark"] .tl-explain {
  background: rgba(255, 255, 255, .032);
  border-color: rgba(255, 255, 255, .075);
}
.tl-explain-head {
  width: 100%;
  padding: 0;
  min-height: 26px;
}
.tl-explain-head-btn {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 4px 4px 4px 2px;
  background: transparent;
  border: 0;
  border-radius: 6px;
  color: inherit;
  cursor: pointer;
  font: inherit;
  text-align: left;
  -webkit-tap-highlight-color: transparent;
  transition: background .16s var(--ease-out);
}
.tl-explain-head-btn:hover {
  background: color-mix(in srgb, var(--accent) 6%, transparent);
}
.tl-explain-head-btn:focus-visible {
  outline: 2px solid color-mix(in srgb, var(--accent) 50%, transparent);
  outline-offset: 2px;
}
.tl-explain-title {
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--text);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: -.01em;
}
.tl-explain-qicon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  color: var(--accent);
}
.tl-explain-qicon svg {
  width: 15px;
  height: 15px;
  display: block;
}
.tl-explain-card-toggle {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  color: var(--text-3);
  transition: color .16s var(--ease-out);
}
.tl-explain-head-btn:hover .tl-explain-card-toggle {
  color: var(--text);
}
.tl-explain-card-toggle svg {
  width: 14px;
  height: 14px;
  flex-shrink: 0;
  transition: transform .22s var(--ease-out);
}
.tl-explain.is-collapsed {
  border-color: color-mix(in srgb, var(--border) 68%, transparent);
  background: color-mix(in srgb, var(--surface-el) 30%, transparent);
}
.tl-explain:not(.is-collapsed) .tl-explain-card-toggle svg {
  transform: rotate(180deg);
}
.tl-explain-body {
  display: grid;
  grid-template-rows: 1fr;
  opacity: 1;
  margin-top: 10px;
  transition: grid-template-rows .26s var(--ease-out), opacity .18s var(--ease-out), margin-top .22s var(--ease-out);
}
.tl-explain-body-inner {
  min-height: 0;
  overflow: hidden;
  display: grid;
  gap: 8px;
}
.tl-explain.is-collapsed .tl-explain-body {
  grid-template-rows: 0fr;
  opacity: 0;
  margin-top: 0;
  pointer-events: none;
}
.tl-explain-level {
  display: grid;
  grid-template-columns: 72px minmax(0, 1fr);
  align-items: center;
  gap: 14px;
  min-height: 78px;
  padding: 8px 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  color: color-mix(in srgb, var(--text) 68%, transparent);
  font-size: 13px; line-height: 1.58;
}
.tl-explain-level + .tl-explain-level {
  border-top: 1px solid color-mix(in srgb, var(--border) 58%, transparent);
  padding-top: 10px;
}
[data-theme="dark"] .tl-explain-level {
  background: transparent;
  color: rgba(255, 255, 255, .66);
}
.tl-explain-lbl {
  width: 66px;
  height: 66px;
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}
.tl-explain-mascot {
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center bottom;
}
.tl-explain-copy {
  min-width: 0;
}
.tl-explain-glossary {
  display: flex; flex-wrap: wrap; gap: 7px;
  padding: 2px 0 0;
  background: transparent; border-top: 0;
}
.tl-explain-chip {
  min-height: 30px;
  display: inline-flex; flex-direction: row; align-items: center;
  border-radius: var(--radius-pill);
  padding: 5px 10px;
  background: color-mix(in srgb, var(--surface-card) 78%, transparent);
  color: var(--text-2);
  font-size: 11.5px; font-weight: 600;
  border: 1px solid var(--border);
  transition: border-color .15s, color .15s, background .15s;
}
[data-theme="dark"] .tl-explain-chip {
  background: rgba(255, 255, 255, .04);
  border-color: rgba(255, 255, 255, .075);
}
.tl-explain-chip:hover {
  border-color: color-mix(in srgb, var(--accent) 34%, var(--border));
  color: var(--text);
}
.tl-explain-chip.open {
  flex: 1 1 100%;
  align-items: flex-start;
  flex-direction: column;
  border-radius: var(--radius-md);
  padding: 10px 12px;
  border-color: color-mix(in srgb, var(--accent) 38%, var(--border));
  background: color-mix(in srgb, var(--accent) 7%, var(--surface-card));
}
.tl-explain-chip-def {
  max-width: 78ch;
  margin-top: 5px;
  color: var(--text-2);
  font-size: 12px; line-height: 1.5;
}
.tl-explain-chip-term { color: var(--text); }

/* ── .tl-explain — variante tabs (Júnior / Pleno / Sênior) ─────────── */
.tl-explain--tabs .tl-explain-tabs {
  display: flex;
  width: 100%;
  gap: 2px;
  border-bottom: 1px solid color-mix(in srgb, var(--border) 70%, transparent);
  margin: 0 0 6px;
  padding: 0;
  flex-wrap: nowrap;
}
.tl-explain-tab {
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 1 1 0;
  width: 0;
  min-width: 0;
  padding: 6px 8px 8px;
  background: transparent;
  border: 0;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  color: var(--text-3);
  cursor: pointer;
  opacity: .55;
  transition: opacity .15s var(--ease-out), border-color .15s var(--ease-out);
}
.tl-explain-tab:hover { opacity: .85; }
.tl-explain-tab.is-active {
  opacity: 1;
  border-bottom-color: var(--lc, var(--accent));
}
.tl-explain-tab img {
  width: 32px;
  height: 32px;
  object-fit: contain;
  object-position: center bottom;
  display: block;
}
.tl-explain-panels { display: block; }
.tl-explain-panel {
  display: none;
  font-size: 13px;
  line-height: 1.58;
  padding: 8px 4px 4px;
  color: color-mix(in srgb, var(--text) 72%, transparent);
}
[data-theme="dark"] .tl-explain-panel { color: rgba(255,255,255,.72); }
.tl-explain-panel.is-active { display: block; }

/* Entity hero (cat / lang / tool) */
.ent-hero {
  border: 1px solid var(--panel-border);
  border-radius: var(--radius-xl);
  background: color-mix(in srgb, var(--surface-card) 86%, transparent);
  box-shadow: var(--elev-2);
  margin-top: 18px;
}
.ent-hero-tools { margin-top: 8px; }

/* Sources / Quotes pages */
.sources-page, .quotes-page {
  max-width: none;
  padding: clamp(24px, 4vw, 48px) 0 88px;
}
.sources-page-title, .quotes-page-title {
  font-size: clamp(28px, 4vw, 42px);
  font-weight: 800;
  letter-spacing: -.045em;
}
.sources-page-sub, .quotes-page-sub { font-size: 14px; }
.sources-grid, .quotes-grid { gap: 14px; }
.source-card, .quote-pg-card {
  border-radius: var(--radius-lg);
  background: linear-gradient(180deg,
    var(--surface-card),
