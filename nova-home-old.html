odutivos em Spring Boot e integrações AI com JetBrains AI Assistant. Ponto central: JVM finalmente tem história AI tooling 'grown-up'.","why_it_matters":"Para times Java, abril marca ponto em que Leyden + virtual threads + AI Assistant passam de POC para produção.","source":"JetBrains Blog","url":"https://blog.jetbrains.com/idea/2026/04/java-annotated-monthly-april-2026/","published_at":"2026-04-07T09:00:00-03:00","image":"https://www.google.com/s2/favicons?domain=jetbrains.com&sz=256","tags":["jetbrains","java","leyden","virtual-threads"]},{"tool_key":"java","name":"Java & JVM","icon":"☕","kind":"news","headline":"TechLife: 'Java em abril/2026 — Leyden amadurece, Spring fica mais esperto, JVM se reinventa para a era IA'","description":"Análise de ecossistema em 20/abr: Java 26 entregue, Project Leyden reduz cold start em ordem de grandeza, Spring Boot com AI tooling nativo, JVM firma-se como runtime competitivo para serviços IA-heavy. Benchmark Leyden: startup de aplicação Spring cai de segundos para milissegundos.","why_it_matters":"Argumento cold-start que empurrou arquitetos para Go/Node perde força; JVM volta a mesa para serverless e agents.","source":"TechLife","url":"https://techlife.blog/posts/java-ecosystem-april-2026/","published_at":"2026-04-20T11:00:00-03:00","image":"https://www.google.com/s2/favicons?domain=techlife.blog&sz=256","tags":["java","jvm","leyden","spring"]}],"quotes":[{"text":"Any organization that designs a system will produce a design whose structure is a copy of the organization's communication structure.","author":"Melvin Conway","context":"Relevante para entender service mesh multicluster e a decisão de Team Topologies por trás","related_to":"cat:enterprise"},{"text":"The cheapest, fastest, and most reliable components are those that aren't there.","author":"Gordon Bell","context":"Aplicável à remoção do ingress-nginx e gitRepo no Kubernetes 1.36","related_to":"tool:kubernetes"},{"text":"Security is a process, not a product.","author":"Bruce Schneier","context":"Breach da Vercel mostra que OAuth apps de terceiros são o novo perímetro","related_to":"cat:sec"},{"text":"Make it work, make it right, make it fast.","author":"Kent Beck","context":"Spec-driven development na era agentic reafirma: o teste é o contrato","related_to":"cat:design"},{"text":"Observability is not about knowing what's broken. It's about knowing what's normal.","author":"Charity Majors","context":"Grafana 13 com Loki sobre Kafka amplifica o 'normal' em escala","related_to":"cat:obs"}],"sources":[{"name":"Kubernetes Blog","url":"https://kubernetes.io/blog/"},{"name":"Grafana Labs Press","url":"https://grafana.com/press/"},{"name":"The Register","url":"https://www.theregister.com/"},{"name":"Anthropic News","url":"https://www.anthropic.com/news"},{"name":"Simon Willison's Weblog","url":"https://simonwillison.net/"},{"name":"InfoQ","url":"https://www.infoq.com/"},{"name":"The New Stack","url":"https://thenewstack.io/"},{"name":"CNCF Blog","url":"https://www.cncf.io/blog/"},{"name":"GitHub Changelog","url":"https://github.blog/changelog/"},{"name":"Databricks Blog","url":"https://www.databricks.com/blog"},{"name":"Instaclustr","url":"https://www.instaclustr.com/blog/"},{"name":"Spring Blog","url":"https://spring.io/blog/"},{"name":"Keycloak Blog","url":"https://www.keycloak.org/blog"},{"name":"Envoy Gateway","url":"https://gateway.envoyproxy.io/news/releases/"},{"name":"Bytecode Alliance","url":"https://bytecodealliance.org/articles/"},{"name":"GitGuardian Blog","url":"https://blog.gitguardian.com/"}]},"2026-04-20":{"date":"2026-04-20","weekday":"Segunda-feira","formatted_date":"Segunda, 20 de Abril de 2026","generated_at":"2026-04-20T23:23:00-03:00","hero_title":"Semana abre com service mesh sidecarless em multicluster, Claude Code Opus 4.7 e Patch Tuesday de 163 CVEs","hero_description":"Edição cobre janela de 3 dias e abre com convergência pesada em três frentes: Istio 1.29 promove ambient multicluster a beta (marco para arquiteturas multi-cloud sem sidecar), Anthropic lança Claude Code com Opus 4.7 e contexto de 1M tokens, e Microsoft publica 163 CVEs incluindo zero-day SharePoint já sob exploração ativa. No radar: RedSun Defender, Axios npm hijack, Cloudflare Agents Week, Ingress-NGINX aposentado, ThoughtWorks Radar Vol 34 com 'cognitive debt' em destaque.","highlights":[{"category":"distarch","category_label":"Sist. Distribuídos","category_icon":"🕸","source_array":"tools","tool_key":"istio","name":"Istio","kind":"release","version":"1.29","headline":"Istio 1.29 entrega Ambient Multi-Network Multicluster em Beta e Gateway API Inference Extension","why_it_matters":"Ambient sidecarless multicluster reduz overhead de service mesh em arquiteturas multi-cloud — quebra dogma de 'sidecar inevitável' para mesh maduro.","source":"Istio Blog","url":"https://istio.io/latest/blog/2026/ambient-multinetwork-multicluster-beta/","published_at":"2026-04-08T10:00:00-03:00","tags":["istio","ambient","multicluster","service-mesh"]},{"category":"aiops","category_label":"AIOps & Agents","category_icon":"🧠","source_array":"tools","tool_key":"claudecode","name":"Claude Code","kind":"release","version":"Opus 4.7","headline":"Claude Code ganha Opus 4.7 com contexto de 1M tokens e modo Plan melhorado","why_it_matters":"Contexto de 1M tokens viabiliza refactorings cross-repo que antes exigiam agent orchestration manual — reduz fricção em arquiteturas grandes.","source":"Anthropic","url":"https://www.anthropic.com/news/claude-opus-4-7","published_at":"2026-04-15T10:00:00-03:00","tags":["claude-code","opus","1m-context","ai-coding"]},{"category":"sec","category_label":"Segurança & IAM","category_icon":"🔐","source_array":"news","urgent":true,"severity":"critical","headline":"Microsoft corrige 163 CVEs no Patch Tuesday de abril — SharePoint zero-day explorado ativamente","summary":"O Patch Tuesday de abril de 2026 traz 163 correções, com destaque para CVE-2026-32201, uma falha de spoofing no SharePoint Server já sob exploração ativa, e CVE-2026-33824 (CVSS 9.8), um RCE no serviço Windows IKE. Arquitetos devem priorizar patching em servidores SharePoint expostos e, onde não for possível aplicar, bloquear UDP 500/4500 para reduzir o blast-radius.","why_it_matters":"SharePoint é coluna vertebral de colaboração corporativa — exploração ativa exige patching imediato em toda frota Windows.","source":"Tenable","url":"https://www.tenable.com/blog/microsofts-april-2026-patch-tuesday-addresses-163-cves-cve-2026-32201","published_at":"2026-04-14T18:00:00-03:00","read_time":4,"cves":["CVE-2026-32201","CVE-2026-33824"],"tags":["patch-tuesday","sharepoint","zero-day","windows"]}],"news":[{"category":"sec","category_label":"Segurança & IAM","category_icon":"🔐","urgent":true,"breaking":false,"severity":"critical","headline":"Microsoft corrige 163 CVEs no Patch Tuesday de abril — SharePoint zero-day explorado ativamente","summary":"O Patch Tuesday de abril de 2026 traz 163 correções, com destaque para CVE-2026-32201, uma falha de spoofing no SharePoint Server já sob exploração ativa, e CVE-2026-33824 (CVSS 9.8), um RCE no serviço Windows IKE. Arquitetos devem priorizar patching em servidores SharePoint expostos e, onde não for possível aplicar, bloquear UDP 500/4500 para reduzir o blast-radius.","why_it_matters":"SharePoint é coluna vertebral de colaboração corporativa — exploração ativa exige patching imediato em toda frota Windows.","source":"Tenable","url":"https://www.tenable.com/blog/microsofts-april-2026-patch-tuesday-addresses-163-cves-cve-2026-32201","published_at":"2026-04-14T18:00:00-03:00","read_time":4,"cves":["CVE-2026-32201","CVE-2026-33824"],"tags":["patch-tuesday","sharepoint","zero-day","windows"]},{"category":"sec","category_label":"Segurança & IAM","category_icon":"🔐","urgent":true,"severity":"high","headline":"RedSun: zero-day no Windows Defender permite restaurar arquivos maliciosos com privilégios elevados","summary":"Publicada em 15 de abril, a RedSun explora erro lógico no tratamento de arquivos marcados com cloud tag pela Windows Cloud Files API — em vez de quarentena, o Defender reescreve o arquivo detectado no local original com privilégios elevados. Atores maliciosos começaram a weaponizar a falha em 16 de abril e, até fim do mês, ainda não há patch oficial.","why_it_matters":"Security baseline 'só aplicar patches' deixa de ser suficiente — arquitetos precisam revisar dependência do Defender como única camada de EDR em endpoints.","source":"Picus Security","url":"https://www.picussecurity.com/resource/blog/bluehammer-redsun-windows-defender-cve-2026-33825-zero-day-vulnerability-explained","published_at":"2026-04-17T14:00:00-03:00","read_time":5,"cves":["CVE-2026-33825"],"tags":["windows-defender","zero-day","edr","endpoint-security"]},{"category":"sec","category_label":"Segurança & IAM","category_icon":"🔐","urgent":true,"severity":"critical","headline":"Axios comprometido: supply chain hijack atinge 100M downloads/semana no npm","summary":"Google Threat Intelligence atribuiu ao UNC1069 (nexus Coreia do Norte) o hijack do Axios: um classic token legado bypassou todas as OIDC/SLSA em produção e publicou versões com postinstall hook carregando RAT multiplataforma. O incidente expõe limitação crítica de tokens legados convivendo com provenance moderna no npm.","why_it_matters":"Ter SLSA Level 2 não protege se a hierarquia de auth permite fallback para token clássico — arquitetos precisam auditar se npm tokens legados ainda estão ativos nos publishers críticos.","source":"SOCRadar","url":"https://socradar.io/blog/axios-npm-supply-chain-attack-2026-ciso-guide/","published_at":"2026-04-18T10:00:00-03:00","read_time":6,"tags":["supply-chain","npm","axios","slsa","sigstore"]},{"category":"sec","category_label":"Segurança & IAM","category_icon":"🔐","urgent":true,"severity":"high","headline":"Fortinet FortiClient EMS: CVE-2026-35616 sob exploração ativa","summary":"A watchTowr reporta exploração ativa do CVE-2026-35616, vulnerabilidade crítica no Fortinet FortiClient EMS já utilizada para pivot em ambientes corporativos. O padrão de ataque segue o histórico Fortinet: PoC público → weaponization em dias. Recomendação: ativar FortiGuard IPS e restringir acesso à console administrativa.","why_it_matters":"EMS é canal privilegiado de push de políticas — um RCE ali vira controle total sobre a frota de endpoints da empresa.","source":"watchTowr Labs","url":"https://watchtowr.com/resources/fortinet-forticlient-ems-zero-day-cve-2026-35616-active-exploitation-underway/","published_at":"2026-04-18T09:00:00-03:00","read_time":5,"cves":["CVE-2026-35616"],"tags":["fortinet","forticlient","rce","ems"]},{"category":"ai","category_label":"IA & LLMs","category_icon":"🤖","urgent":false,"breaking":true,"headline":"OpenAI libera GPT-6 globalmente com janela de 2M tokens","summary":"Confirmado em 7 de abril e disponibilizado no dia 14, o GPT-6 duplica a janela de contexto do GPT-5 para 2M tokens e chega com preço de US$ 2,50/1M input e US$ 12/1M output — patamar competitivo vs. Gemini 2.5 Pro e Claude Opus 4.7. Foco em reasoning multimodal e melhor tool-calling em agentes.","why_it_matters":"Janela de 2M tokens muda a economia de RAG: para muitos domínios vira mais barato colar tudo no prompt do que manter pipeline de retrieval.","source":"OpenAI","url":"https://openai.com/index/introducing-gpt-6/","published_at":"2026-04-14T09:00:00-03:00","read_time":4,"tags":["openai","gpt-6","llm","context-window"]},{"category":"ai","category_label":"IA & LLMs","category_icon":"🤖","urgent":false,"headline":"Meta lança família Llama 4 com 10M tokens em MoE — contexto recorde","summary":"A família Llama 4 apresenta o Scout com janela de 10M tokens — a maior de qualquer modelo público — e o Maverick com 400B parâmetros e 1M tokens nativamente multimodal. Ambos usam arquitetura Mixture-of-Experts (MoE) para inferência mais barata que modelos densos equivalentes.","why_it_matters":"Open-weight em tier de fronteira muda o cálculo de build-vs-buy para plataformas de IA — rodar Llama 4 on-prem vira viável para compliance-heavy industries.","source":"Meta AI","url":"https://ai.meta.com/blog/llama-4-multimodal-intelligence/","published_at":"2026-04-05T09:00:00-03:00","read_time":5,"tags":["meta","llama-4","moe","open-weight"]},{"category":"ai","category_label":"IA & LLMs","category_icon":"🤖","headline":"Gemini 2.5 Pro e Flash chegam com reasoning multimodal nativo","summary":"A série Gemini 2.5 Pro foi lançada em 1º de abril com janela de 1M tokens (expansível para 2M em preview) e entrada multimodal unificada: vídeo, imagens, áudio e texto no mesmo prompt sem etapa separada de embeddings. O Flash chegou dois dias depois como variante cost-optimized.","why_it_matters":"Modalidades unificadas simplificam arquitetura de agentes multimodais — um único endpoint em vez de pipeline de conversão a imagem/áudio.","source":"LLM Stats","url":"https://llm-stats.com/llm-updates","published_at":"2026-04-01T10:00:00-03:00","read_time":4,"tags":["google","gemini","multimodal","reasoning"]},{"category":"aiops","category_label":"AIOps & Agents","category_icon":"🧠","breaking":true,"headline":"Claude Code Opus 4.7 bate 87,6% no SWE-bench Verified e default sobe para xhigh","summary":"Lançado em 16 de abril, o Opus 4.7 salta para 87,6% no SWE-bench Verified (vs 80,8%), 64,3% no SWE-bench Pro e 70% no CursorBench. A release introduz comando /ultrareview, extende auto mode para Max e eleva o nível padrão de esforço para xhigh em todos os planos.","why_it_matters":"xhigh como default muda custo operacional — arquitetos precisam revisar quotas e guardrails de agentes antes que a fatura explode.","source":"AI Tool Analysis","url":"https://aitoolanalysis.com/claude-code/","published_at":"2026-04-16T15:00:00-03:00","read_time":5,"tags":["claude-code","anthropic","swe-bench","agents"]},{"category":"aiops","category_label":"AIOps & Agents","category_icon":"🧠","headline":"Cursor 3 lança Agents Window com orquestração paralela de agentes","summary":"Lançado em 2 de abril, o Cursor 3 marca a virada da indústria de autocomplete assistivo para orquestração agentic. A release traz Agents Window dedicada para rodar múltiplos agentes em paralelo entre repos, Design Mode para trabalho visual e melhorias de coordenação multi-agente.","why_it_matters":"Paralelismo de agentes exige novos padrões de isolamento e revisão humana — sem guardrails, branch hygiene vira caos.","source":"Creati AI News","url":"https://creati.ai/ai-news/2026-04-06/cursor-3-agent-first-interface-claude-code-codex/","published_at":"2026-04-06T12:00:00-03:00","read_time":4,"tags":["cursor","ide","agents","ai-coding"]},{"category":"aiops","category_label":"AIOps & Agents","category_icon":"🧠","headline":"MCP + LangGraph consolidam padrão produção para multi-agentes","summary":"O LangGraph (runtime stateful com checkpointing e human-in-the-loop) e o Model Context Protocol (servers versionados na rede com toolbox ao vivo) finalmente compõem limpo via langchain-mcp-adapters. O pacote converte schemas MCP em BaseTool do LangChain, permitindo que qualquer nó LangGraph chame tools remotas.","why_it_matters":"Multi-agent orchestration sai do experimental — arquitetos podem padronizar em cima de dois componentes estáveis em vez de framework proprietário.","source":"Qodo Blog","url":"https://www.qodo.ai/blog/building-agentic-flows-with-langgraph-model-context-protocol/","published_at":"2026-04-15T11:00:00-03:00","read_time":7,"tags":["mcp","langgraph","agents","langchain"]},{"category":"aiops","category_label":"AIOps & Agents","category_icon":"🧠","headline":"ClickHouse adquire Langfuse por US$ 400M e consolida LLM observability","summary":"Em janeiro de 2026 a ClickHouse fechou a aquisição da Langfuse por US$ 400M como parte de sua Série D, movimento que sinaliza a importância estratégica do LLM observability na stack de data infrastructure. A Langfuse permanece open-source e framework-agnostic — LangChain, LlamaIndex, OpenAI SDK, LiteLLM, Vercel AI SDK, e custom stacks via Python/TypeScript.","why_it_matters":"Combinação ClickHouse+Langfuse dá às áreas de plataforma um stack de telemetria LLM coerente — armazenamento colunar embaixo, UI de eval em cima.","source":"ZenML Blog","url":"https://www.zenml.io/blog/langfuse-vs-langsmith","published_at":"2026-04-10T10:00:00-03:00","read_time":6,"tags":["langfuse","clickhouse","llm-observability","acquisition"]},{"category":"cloud","category_label":"Cloud","category_icon":"☁️","breaking":true,"headline":"AWS e Google Cloud lançam multicloud oficial com peering direto via NCC","summary":"AWS e GCP anunciaram colaboração multicloud conjunta: Partner Cross-Cloud Interconnect com VPC Peering passa para GA, e Network Connectivity Center (NCC) entra em preview para orquestração. É o primeiro passo de um produto de networking que incluirá Azure ainda em 2026 — fim da era do 'transit gateway improvisado'.","why_it_matters":"Multi-cloud networking nativo reduz dependência de appliances de terceiros (Megaport, Aviatrix) — arquitetos podem replanejar landing zones cross-cloud.","source":"CIO Dive","url":"https://www.ciodive.com/news/aws-google-link-cloud-products/806705/","published_at":"2026-04-17T13:00:00-03:00","read_time":4,"tags":["aws","gcp","multicloud","networking"]},{"category":"cloud","category_label":"Cloud","category_icon":"☁️","headline":"Cloudflare Agents Week entrega Dynamic Workers, Sandboxes GA e AI Gateway unificado","summary":"De 13 a 17 de abril, a Agents Week 2026 da Cloudflare liberou Dynamic Workers (runtime isolate-based para código gerado por LLM, startup em ms e milhões de execuções concorrentes), Cloudflare Sandboxes GA, Cloudflare Mesh (private networking para agents) e AI Gateway como camada unificada sobre 14+ provedores de inferência.","why_it_matters":"Para quem opera agentes autônomos, Dynamic Workers remove o dilema container-vs-VM para sandbox de código — e Cloudflare Mesh traz Zero Trust para conexões agent→DB.","source":"Cloudflare","url":"https://www.cloudflare.com/agents-week/updates/","published_at":"2026-04-17T15:00:00-03:00","read_time":6,"tags":["cloudflare","edge","workers","agents"]},{"category":"devops","category_label":"DevOps & Plataformas","category_icon":"⚙️","urgent":true,"headline":"Ingress NGINX aposentado pelo SIG Network — migração obrigatória","summary":"Em 24 de março o SIG Network e o Security Response Committee do Kubernetes retiraram oficialmente o Ingress NGINX: não haverá mais releases, bugfixes ou correções de CVE. Clusters em produção ainda usando o controller precisam migrar para Gateway API, Ingress NGINX INC-managed ou alternativas (Traefik, Contour, Cilium).","why_it_matters":"Essa é a maior migração forçada do ecossistema K8s em 2026 — adiar vira risco de CVE sem patch em caminho crítico de tráfego.","source":"Kubernetes Blog","url":"https://kubernetes.io/blog/2025/10/24/ingress-nginx-retirement/","published_at":"2026-03-24T10:00:00-03:00","read_time":5,"tags":["kubernetes","ingress","nginx","gateway-api"]},{"category":"devops","category_label":"DevOps & Plataformas","category_icon":"⚙️","headline":"Kubernetes v1.36 sai dia 22/04 com depreciação de externalIPs e remoção do gitRepo","summary":"Release planejada para 22 de abril, o K8s v1.36 deprecia oficialmente o campo externalIPs do Service (historicamente explorável via CVE-2020-8554; remoção em v1.43) e remove o gitRepo volume driver — workloads precisam migrar para init containers ou git-sync sidecars. KEP-4815 (DRA Partitionable Devices) entra como principal feature nova.","why_it_matters":"Dois legados tóxicos saem do path crítico de cluster — plataformas precisam auditar uso e planejar migração antes do EOL real em v1.43.","source":"Kubernetes Blog","url":"https://kubernetes.io/blog/2026/03/30/kubernetes-v1-36-sneak-peek/","published_at":"2026-03-30T10:00:00-03:00","read_time":5,"tags":["kubernetes","v1.36","deprecation","kep"]},{"category":"obs","category_label":"Observabilidade & SRE","category_icon":"📈","headline":"OpenTelemetry Declarative Configuration atinge estabilidade","summary":"A InfoQ reporta que o formato declarativo de configuração do OpenTelemetry — que permite definir pipelines de traces, métricas e logs em um único YAML lido pelo SDK na inicialização — atingiu estabilidade. Marylia Gutierrez (Grafana Labs) demonstrou o setup em community call: fim do código boilerplate de configuração espalhado por apps.","why_it_matters":"Configuração declarativa destrava observability-as-code real — um único YAML versionado substitui dezenas de flags e env vars por ambiente.","source":"InfoQ","url":"https://www.infoq.com/news/2026/04/opentelemetry-declarative-config/","published_at":"2026-04-15T09:00:00-03:00","read_time":5,"tags":["opentelemetry","observability","configuration"]},{"category":"backend","category_label":"Backend & Runtimes","category_icon":"🔧","headline":"Spring Boot 4.0.5 modulariza stack em 70+ JARs e recomenda Java 21/25","summary":"A versão 4.0.5 (26/03) consolida a refatoração do Spring Boot 4.0 (nov/25): 70+ JARs focados, Jackson 3 como default JSON, baseline Java 17 mas recomendação forte para Java 21/25 se quiser aproveitar virtual threads e otimizações recentes da JVM. Quarkus 3.27 da Red Hat chegou com integração Hibernate ORM 7 e tooling AI.","why_it_matters":"Modularização reduz classpath pollution em serviços menores — arquitetos podem enxugar imagens Docker e startup time aproveitando módulos seletivos.","source":"TechLife Blog","url":"https://techlife.blog/posts/java-ecosystem-april-2026/","published_at":"2026-04-08T11:00:00-03:00","read_time":6,"tags":["spring-boot","java","quarkus","virtual-threads"]},{"category":"backend","category_label":"Backend & Runtimes","category_icon":"🔧","headline":"Spin v3.5 traz primeiro RC WASIp3 com async nativo em WebAssembly","summary":"A Fermyon publicou o Spin v3.5 com o primeiro RC de suporte a WASI Preview 3, habilitando async I/O nativo em workloads WebAssembly no backend. O runtime entrou no CNCF Sandbox como containerd shim — mesmo kubectl, mesmo Helm, mas Wasm embaixo. Wasmtime já tem suporte experimental ao WASI 0.3, com GA previsto para final de 2026.","why_it_matters":"Async em WASM encerra a maior objeção de produção a Wasm serverless — startup em ms + pool de conexões reais viabiliza workloads latency-sensitive.","source":"The New Stack","url":"https://thenewstack.io/wasi-1-0-you-wont-know-when-webassembly-is-everywhere-in-2026/","published_at":"2026-04-12T10:00:00-03:00","read_time":6,"tags":["webassembly","wasi","spin","wasmtime"]},{"category":"backend","category_label":"Backend & Runtimes","category_icon":"🔧","headline":"TypeScript 7 (Project Corsa) reescrito em Go promete 10x de speedup","summary":"A Microsoft confirma o Project Corsa: TypeScript 7.0 totalmente reescrito em Go para compilação nativa com paralelismo shared-memory e promessa de 10x de speedup. A versão atual 6.0 saiu em 23 de março como último marco antes do salto.","why_it_matters":"CI builds caindo em ordens de magnitude libera velocity em monorepos grandes — arquitetos podem revisitar estratégia de build matrix.","source":"DEV Community","url":"https://dev.to/jsgurujobs/bun-vs-deno-vs-nodejs-in-2026-benchmarks-code-and-real-numbers-2l9d","published_at":"2026-04-09T14:00:00-03:00","read_time":4,"tags":["typescript","corsa","go","compiler"]},{"category":"data","category_label":"Dados & Streaming","category_icon":"🗄️","breaking":true,"headline":"Databricks anuncia Apache Iceberg v3 em Public Preview","summary":"A Databricks abriu o Public Preview do Iceberg v3 com row-level concurrency, tipos de dado mais ricos (incluindo VARIANT) e melhor suporte a workloads operacionais. Unity Catalog Managed Iceberg v3 adiciona Row Lineage e Deletion Vectors. Em paralelo, Snowflake liberou write em Iceberg externamente managed pelo Unity Catalog no Azure.","why_it_matters":"Iceberg v3 empurra o open lakehouse para paridade com Delta em concorrência — arquitetos podem consolidar storage único para OLAP e operacional.","source":"Databricks Blog","url":"https://www.databricks.com/blog/next-era-open-lakehouse-apache-icebergtm-v3-public-preview-databricks","published_at":"2026-04-15T12:00:00-03:00","read_time":6,"tags":["iceberg","databricks","lakehouse","unity-catalog"]},{"category":"data","category_label":"Dados & Streaming","category_icon":"🗄️","urgent":true,"severity":"high","headline":"pgvector 0.8.2 corrige buffer overflow em build paralelo de índices HNSW","summary":"A release 0.8.2 do pgvector foi publicada corrigindo CVE-2026-3172, buffer overflow em builds paralelos de índice HNSW. Instalações que executaram REINDEX CONCURRENTLY ou CREATE INDEX em paralelo com versões anteriores devem atualizar imediatamente e avaliar se o índice precisa ser reconstruído.","why_it_matters":"pgvector virou coluna vertebral de RAG em Postgres — vuln no build de índice ataca o path quente de ingestão de embeddings.","source":"PostgreSQL News","url":"https://www.postgresql.org/about/news/pgvector-082-released-3245/","published_at":"2026-04-10T11:00:00-03:00","read_time":3,"cves":["CVE-2026-3172"],"tags":["pgvector","postgresql","cve","hnsw"]},{"category":"integ","category_label":"Integração & Eventos","category_icon":"🔌","headline":"AsyncAPI v3.1 lança com binding ROS 2 e interop maior com OpenAPI","summary":"A spec AsyncAPI v3.1 chegou em janeiro com binding ROS 2 e foco em reutilizar schemas de OpenAPI, RAML, Avro, GraphQL, Protobuf e XSD. O objetivo anunciado na AsyncAPI Conference (Paris) é consolidar um único formato para descrever APIs síncronas e event-driven sem perder os contratos existentes.","why_it_matters":"Contratos de eventos como cidadãos de primeira classe no design de API evita drift entre produtor e consumidor — CDC, webhooks e Kafka ganham documentação versionada.","source":"AsyncAPI","url":"https://www.asyncapi.com/roadmap","published_at":"2026-04-05T10:00:00-03:00","read_time":5,"tags":["asyncapi","event-driven","openapi","schema"]},{"category":"frontend","category_label":"Frontend & Web","category_icon":"🎨","headline":"Next.js 16.2 chega com Server Fast Refresh, Subresource Integrity e tree-shaking de imports dinâmicos","summary":"A release 16.2 do Next.js traz Turbopack com Server Fast Refresh (hot reload fine-grained no server-side), Web Worker Origin para libs WASM em Workers, Subresource Integrity para bundles JS e tree-shaking de dynamic imports — mais de 200 melhorias de performance. Adiciona também AGENTS.md em create-next-app e next-browser experimental para forward de logs.","why_it_matters":"SRI em produção fecha vetor clássico de supply chain no frontend — e tree-shaking de dynamic imports reduz bundles de apps grandes sem refactoring.","source":"Vercel","url":"https://nextjs.org/blog/next-16-2","published_at":"2026-04-14T09:00:00-03:00","read_time":5,"tags":["nextjs","vercel","turbopack","sri"]},{"category":"frontend","category_label":"Frontend & Web","category_icon":"🎨","headline":"React Server Components deixam de ser experimento e entram na mainstream em 2026","summary":"Case studies da Vercel relatam redução de 70% em TTFB e 40% em custo de servidor com a adoção de RSC + streaming SSR em e-commerce de produção. SolidStart, TanStack Start e SvelteKit trouxeram out-of-order streaming e Server Functions para seus respectivos ecossistemas — consolidando o modelo híbrido onde cada componente decide se roda no servidor, cliente ou ambos.","why_it_matters":"Hora de revisitar arquitetura de apps Next/Remix/Nuxt — ganhos de 70% em TTFB mudam budget de performance e SEO.","source":"SitePoint","url":"https://www.sitepoint.com/react-server-components-streaming-performance-2026/","published_at":"2026-04-11T10:00:00-03:00","read_time":7,"tags":["react","rsc","streaming-ssr","nextjs"]},{"category":"testing","category_label":"Testes & Qualidade","category_icon":"⚗️","headline":"Grafana k6 Browser alinha API com Playwright e vira padrão para load testing frontend","summary":"A Grafana documentou o caminho de migração scripts Playwright → k6 browser: API roughly-compatible, mesma estratégia de selectors, suporte a fluxos hybrid (Playwright dirigindo browser + k6 gerando carga). k6 Studio ganhou features modernas para ampliar adoption sobre Locust e Gatling.","why_it_matters":"Engineers podem reusar scripts E2E do Playwright como carga — elimina duplicação entre 'teste funcional' e 'teste de performance'.","source":"Grafana Labs","url":"https://grafana.com/blog/2025/10/02/a-closer-look-at-grafana-k6-browser-alignment-with-playwright-modern-features-for-frontend-testing-and-what-s-next/","published_at":"2026-04-09T12:00:00-03:00","read_time":5,"tags":["k6","playwright","load-testing","performance"]},{"category":"distarch","category_label":"Sist. Distribuídos","category_icon":"🕸","breaking":true,"headline":"Istio 2026 chega com Ambient Multicluster beta e Gateway API Inference Extension","summary":"No KubeCon Europe 2026, a comunidade Istio anunciou Ambient Multicluster beta — roteamento entre clusters sem sidecars — Gateway API Inference Extension beta (inferência ML integrada no fluxo de mesh) e suporte experimental a agentgateway. É a virada do service mesh para a era de agentes autônomos e workloads AI com SLA.","why_it_matters":"Ambient multicluster desbloqueia mesh cross-região/cloud sem a penalidade operacional dos sidecars — e Inference Extension padroniza routing para LLMs no mesh.","source":"InfoQ","url":"https://www.infoq.com/news/2026/04/istio-ai-multicluster/","published_at":"2026-04-10T10:00:00-03:00","read_time":6,"tags":["istio","service-mesh","ambient","gateway-api"]},{"category":"distarch","category_label":"Sist. Distribuídos","category_icon":"🕸","headline":"Temporal lança Worker Versioning: workflow roda em uma única versão de código","summary":"Recém-anunciado, o Worker Versioning resolve uma das dores clássicas de durable execution: compatibilidade entre versões de código durante rollout. Cada workflow passa a rodar em uma versão fixa, eliminando problemas de determinismo entre replays em workers novos. Kafka + Temporal consolida padrão para orchestração confiável em sistemas event-driven.","why_it_matters":"Rollouts de serviços com long-running workflows deixam de exigir trabalhos manuais de migração — plataformas podem operar CI/CD contínuo sem medo de inconsistência.","source":"Temporal Blog","url":"https://temporal.io/blog/what-is-durable-execution","published_at":"2026-04-12T11:00:00-03:00","read_time":6,"tags":["temporal","durable-execution","workflow","versioning"]},{"category":"enterprise","category_label":"Arq. Corporativa","category_icon":"🗺️","breaking":true,"headline":"ThoughtWorks Technology Radar Vol. 34 alerta para 'cognitive debt' da era AI","summary":"O Volume 34 do Technology Radar (15/04) marca inflexão editorial: menos celebração de tools novas, mais maturidade e volta aos fundamentos. A tese central é que a geração maciça de código por IA introduz 'cognitive debt' — lacuna cognitiva entre desenvolvedores e sistemas — e que o remédio é reinvestir em engenharia básica, legibilidade e testes.","why_it_matters":"Para CTOs e arquitetos-chefe, é sinal para reforçar code review, documentação e engenharia de base antes que o pushback dos próximos incidentes chegue.","source":"ThoughtWorks","url":"https://www.thoughtworks.com/about-us/news/2026/combat-ai-cognitive-debt-radar-v34","published_at":"2026-04-15T10:00:00-03:00","read_time":8,"tags":["tech-radar","thoughtworks","ai","engineering"]},{"category":"enterprise","category_label":"Arq. Corporativa","category_icon":"🗺️","headline":"State of Platform Engineering Vol. 4 mostra 2,3x mais adoção com PM dedicado","summary":"O relatório Vol. 4 do State of Platform Engineering identifica sete especializações dentro do papel (Head, Product Manager, Infrastructure, DevEx, Security, Observability, AI) e mostra que equipes com PM dedicado têm 2,3x mais adoção interna. DORA continua relevante, mas elite trackea também business outcome, AI attribution e DevEx quantificado.","why_it_matters":"Estruturar time de plataforma como produto — com PM, roadmap e metrics de adoção — virou divisor de águas entre plataformas que escalam e as que viram 'golden cage'.","source":"Platform Engineering","url":"https://platformengineering.org/blog/platform-engineering-maturity-in-2026","published_at":"2026-04-08T09:00:00-03:00","read_time":7,"tags":["platform-engineering","dora","devex","team-topologies"]},{"category":"fundamentals","category_label":"Fundamentos de Computação","category_icon":"🧱","headline":"'Designing Data-Intensive Applications' 2ª edição atualiza o clássico de Kleppmann","summary":"Publicada no início de 2026 em co-autoria com Chris Riccomini, a segunda edição do DDIA expande o tratamento de streaming (Flink, Kafka Streams), adiciona capítulo sobre sistemas com consistência eventual moderna e atualiza benchmarks de storage engines. Permanece o reference de fundamentos para engenheiros que precisam pensar sobre trade-offs de replicação, partitioning e consenso.","why_it_matters":"Atualização rara de obra que se tornou currículo informal de senior engineer — leitura obrigatória para quem faz design review de sistemas distribuídos.","source":"Javarevisited","url":"https://medium.com/javarevisited/i-read-designing-data-intensive-applications-2nd-edition-and-its-awesome-417103df5aab","published_at":"2026-04-02T10:00:00-03:00","read_time":8,"tags":["ddia","kleppmann","distributed-systems","fundamentals"]},{"category":"fintech","category_label":"Fintech & Pagamentos","category_icon":"💳","urgent":true,"headline":"Pix por Aproximação (NFC) vira obrigatório para instituições em 22/04","summary":"O Banco Central determinou que todas as instituições participantes do Pix precisam oferecer NFC Pix até 22 de abril. Usuários poderão pagar do saldo em conta ou do limite de crédito, efetivamente substituindo cartão contactless em qualquer terminal. É o maior movimento do Pix desde a chegada do Pix Automático em 2024.","why_it_matters":"Para bancos e fintechs, prazo-relâmpago significa review imediato de apps, SDKs de wallet e testes de integração em TEF — quem perder a onda vira legado em meses.","source":"Rio Times Online","url":"https://www.riotimesonline.com/brazil-fintech-2026-complete-guide/","published_at":"2026-04-16T09:00:00-03:00","read_time":5,"tags":["pix","nfc","bcb","open-finance"]},{"category":"design","category_label":"Design & Padrões","category_icon":"🏛️","headline":"Martin Fowler será keynote do DDD Europe 2026 — entrevista sobre o estado da arquitetura","summary":"Martin Fowler, Chief Scientist da ThoughtWorks, foi confirmado como keynote do DDD Europe 2026 em Antwerp. O formato é inédito: em vez de palestra tradicional, ele será entrevistado sobre o estado atual da arquitetura de software, evolução do DDD e desafios para times construindo sistemas domain-driven em 2026.","why_it_matters":"Atenção ao formato 'entrevista' como sinal da maturidade do campo — menos sermão, mais conversa reflexiva sobre trade-offs reais em produção.","source":"DDD Europe","url":"https://2026.dddeurope.com/blog/martin-fowler-to-keynote-at-ddd-europe-2026/","published_at":"2026-04-06T10:00:00-03:00","read_time":4,"tags":["ddd","fowler","conference","architecture"]}],"tools":[{"tool_key":"claudecode","name":"Claude Code","kind":"release","version":"Opus 4.7","headline":"Claude Code ganha Opus 4.7 com contexto de 1M tokens e modo Plan melhorado","why_it_matters":"Contexto de 1M tokens viabiliza refactorings cross-repo que antes exigiam agent orchestration manual — reduz fricção em arquiteturas grandes.","source":"Anthropic","url":"https://www.anthropic.com/news/claude-opus-4-7","published_at":"2026-04-15T10:00:00-03:00","tags":["claude-code","opus","1m-context","ai-coding"]},{"tool_key":"cursor","name":"Cursor IDE","kind":"release","version":"3.0","headline":"Cursor 3.0 lança Multi-Agent Panel e integração nativa com MCP","why_it_matters":"Multi-Agent Panel permite despachar tarefas paralelas em múltiplos contextos — marco na mudança de paradigma de 'autocomplete inteligente' para 'orchestrator de agents'.","source":"Cursor","url":"https://cursor.com/blog/cursor-3","published_at":"2026-04-10T12:00:00-03:00","tags":["cursor","multi-agent","mcp","ide"]},{"tool_key":"vscode","name":"VS Code","kind":"release","version":"1.112","headline":"VS Code 1.112 traz Autopilot de navegação e debugging de browser via MCP","why_it_matters":"Debugging de browser direto no editor via MCP reduz context-switching entre IDE, DevTools e Copilot Chat — produtividade tangível para times frontend.","source":"Microsoft","url":"https://code.visualstudio.com/updates/v1_112","published_at":"2026-04-10T09:00:00-03:00","tags":["vscode","mcp","autopilot","debugging"]},{"tool_key":"intellij","name":"IntelliJ IDEA","kind":"release","version":"2026.1","headline":"IntelliJ IDEA 2026.1 adiciona suporte a Codex, Cursor-style agents e protocolo ACP","why_it_matters":"JetBrains adota ACP (Agent Client Protocol) como padrão aberto — sinal de convergência em como IDEs vão conversar com agents, reduzindo risco de lock-in.","source":"JetBrains","url":"https://blog.jetbrains.com/idea/2026/04/intellij-idea-2026-1/","published_at":"2026-04-08T11:00:00-03:00","tags":["intellij","acp","codex","agents"]},{"tool_key":"argocd","name":"Argo CD","kind":"release","version":"v3.3.7","headline":"Argo CD v3.3.7 corrige regressão em ApplicationSets e melhora performance do server-side diff","why_it_matters":"ApplicationSets são coluna vertebral de GitOps em escala — regressão corrigida evitava drift silencioso em times com centenas de apps.","source":"Argo Project","url":"https://github.com/argoproj/argo-cd/releases/tag/v3.3.7","published_at":"2026-04-16T15:00:00-03:00","tags":["argocd","gitops","applicationsets"]},{"tool_key":"ghactions","name":"GitHub Actions","kind":"news","headline":"GitHub Actions adiciona VNET failover automático para runners Azure-hosted","why_it_matters":"Failover automático entre VNETs melhora SLA de CI/CD sem exigir arquitetura multi-runner manual — simplifica compliance de DR em orgs regulamentadas.","source":"GitHub Changelog","url":"https://github.blog/changelog/2026-04-02-github-actions-vnet-failover/","published_at":"2026-04-02T14:00:00-03:00","tags":["github-actions","vnet","failover","azure"]},{"tool_key":"kubernetes","name":"Kubernetes","kind":"news","headline":"Kubernetes v1.36 Sneak Peek: HPA scale-to-zero estável, user namespaces GA, Ingress-NGINX aposentado","why_it_matters":"HPA scale-to-zero + user namespaces estáveis alteram a equação de custo/segurança de plataformas — arquitetos devem revisar design de multi-tenancy e autoscaling.","source":"Kubernetes Blog","url":"https://kubernetes.io/blog/2026/03/30/kubernetes-v1-36-sneak-peek/","published_at":"2026-03-30T10:00:00-03:00","tags":["kubernetes","v1.36","hpa","user-namespaces"]},{"tool_key":"istio","name":"Istio","kind":"release","version":"1.29","headline":"Istio 1.29 entrega Ambient Multi-Network Multicluster em Beta e Gateway API Inference Extension","why_it_matters":"Ambient sidecarless multicluster reduz overhead de service mesh em arquiteturas multi-cloud — quebra dogma de 'sidecar inevitável' para mesh maduro.","source":"Istio Blog","url":"https://istio.io/latest/blog/2026/ambient-multinetwork-multicluster-beta/","published_at":"2026-04-08T10:00:00-03:00","tags":["istio","ambient","multicluster","service-mesh"]},{"tool_key":"springboot","name":"Spring Boot","kind":"release","version":"4.0.5","headline":"Spring Boot 4.0.5 entrega correções de CVE e compatibilidade com Jakarta EE 11","why_it_matters":"Primeira patch release do branch 4.0 com Jakarta EE 11 estável — remove bloqueio para migração definitiva de frotas em Spring Boot 3.x.","source":"Spring","url":"https://spring.io/blog/2026/04/16/spring-boot-4-0-5-available-now","published_at":"2026-04-16T14:00:00-03:00","tags":["spring-boot","jakarta-ee","java"]},{"tool_key":"postgres","name":"PostgreSQL","kind":"news","headline":"pgvector 0.8.2 corrige CVE-2026-3172 (buffer overflow em HNSW index builds)","why_it_matters":"Vector DBs em Postgres viraram padrão para RAG — CVE em code path de build de índice afeta qualquer pipeline de ingestão de embeddings.","source":"pgvector","url":"https://github.com/pgvector/pgvector/releases/tag/v0.8.2","published_at":"2026-04-14T11:00:00-03:00","cves":["CVE-2026-3172"],"tags":["postgres","pgvector","vector-db","rag"]},{"tool_key":"databricks","name":"Databricks","kind":"news","headline":"Databricks promove Iceberg v3 REST Catalog a Public Preview com branching e tagging","why_it_matters":"Iceberg v3 com branching traz 'git para data' mainstream — muda pattern de data pipelines: testes e rollback antes de merge na tabela principal.","source":"Databricks","url":"https://www.databricks.com/blog/iceberg-v3-public-preview","published_at":"2026-04-14T10:00:00-03:00","tags":["databricks","iceberg","lakehouse","branching"]},{"tool_key":"keycloak","name":"Keycloak","kind":"release","version":"26.6.0","headline":"Keycloak 26.6.0 adiciona JWT grant type e DPoP estável para client authentication","why_it_matters":"DPoP estável bloqueia token replay em APIs públicas — passo importante para orgs migrando de bearer tokens simples para prova-de-posse real.","source":"Keycloak","url":"https://www.keycloak.org/2026/04/keycloak-2660-released","published_at":"2026-04-10T09:00:00-03:00","tags":["keycloak","dpop","oauth","jwt"]},{"tool_key":"docker","name":"Docker","kind":"release","version":"Desktop 4.46","headline":"Docker Desktop 4.46 expande Model Runner com suporte GGUF e integra Compose AI","why_it_matters":"Model Runner evolui para hub local de modelos com API compatível com OpenAI — rodar LLM offline em dev vira workflow de 1 comando.","source":"Docker","url":"https://docs.docker.com/desktop/release-notes/","published_at":"2026-04-17T13:00:00-03:00","tags":["docker","model-runner","local-llm","compose"]},{"tool_key":"java","name":"Java & JVM","kind":"news","headline":"JEP 501 (Project Leyden AOT Code Caching) entra em rampa para Java 25 GA","why_it_matters":"AOT Code Caching pode cortar startup de apps Spring Boot grandes em até 40% — muda equação de serverless e scale-to-zero para workloads JVM.","source":"OpenJDK","url":"https://openjdk.org/jeps/501","published_at":"2026-04-12T10:00:00-03:00","tags":["java","leyden","aot","jep"]}],"quotes":[{"text":"Sidecars resolveram o problema de hoje ao preço do problema de amanhã. Ambient é um reconhecimento honesto disso.","author":"Louis Ryan","related_to":"tool:istio","context":"Co-criador do Istio, sobre a evolução para ambient mode e multicluster."},{"text":"Cada nova versão de LLM empurra o gargalo um andar acima — o problema nunca é 'gerar código', é 'decidir o que gerar'.","author":"Kent Beck","related_to":"cat:aiops","context":"Reflexão recorrente de Beck sobre a coevolução de programadores e agents."},{"text":"Se sua estratégia de segurança depende de 'aplicar o patch rápido', você não tem estratégia de segurança.","author":"Daniel Miessler","related_to":"cat:sec","context":"Análise sobre Patch Tuesday e a fragilidade de depender só de patching reativo."},{"text":"A dívida cognitiva é mais perigosa que a dívida técnica — você paga juros sem saber.","author":"Rebecca Parsons","related_to":"cat:enterprise","context":"CTO Emerita da ThoughtWorks, sobre a introdução do conceito no Tech Radar Vol 34."},{"text":"Data como 'git' não é metáfora — é o modelo mental correto. Branches, tags e revert são primitivas, não luxo.","author":"Ryan Blue","related_to":"tool:databricks","context":"Criador do Apache Iceberg, sobre a maturação do branching na v3."}],"sources":[{"name":"Tenable Blog","url":"https://www.tenable.com/blog"},{"name":"Anthropic News","url":"https://www.anthropic.com/news"},{"name":"Istio Blog","url":"https://istio.io/latest/blog/"},{"name":"Kubernetes Blog","url":"https://kubernetes.io/blog/"},{"name":"GitHub Changelog","url":"https://github.blog/changelog/"},{"name":"InfoQ","url":"https://www.infoq.com/"},{"name":"The New Stack","url":"https://thenewstack.io/"},{"name":"CNCF","url":"https://www.cncf.io/"},{"name":"ThoughtWorks Radar","url":"https://www.thoughtworks.com/radar"},{"name":"Spring Blog","url":"https://spring.io/blog"},{"name":"Databricks Blog","url":"https://www.databricks.com/blog"},{"name":"pgvector GitHub","url":"https://github.com/pgvector/pgvector"},{"name":"Keycloak Blog","url":"https://www.keycloak.org/blog"},{"name":"Picus Security","url":"https://www.picussecurity.com/resource/blog"},{"name":"Cloudflare Blog","url":"https://blog.cloudflare.com/"},{"name":"Hacker News","url":"https://news.ycombinator.com/"},{"name":"Lobste.rs","url":"https://lobste.rs/"}]}},"quotes":[{"text":"Qualquer tolo pode escrever código que um computador entenda. Bons programadores escrevem código que seres humanos entendam.","author":"Martin Fowler","context":"Legibilidade como princípio de arquitetura — do livro Refactoring","related_to":"cat:arqsw","url":"https://martinfowler.com/bliki/BeckDesignRules.html"},{"text":"Se você tem medo de implantar na sexta-feira, o problema não é a sexta — é o seu processo de implantação.","author":"Jez Humble","context":"Continuous Delivery como resposta ao medo de deploy","related_to":"cat:devops","url":"https://continuousdelivery.com/2015/02/why-enterprises-must-adopt-devops-to-enable-continuous-delivery/"},{"text":"Dívida técnica não é ruim. Dívida técnica que ninguém sabe que existe é.","author":"Martin Fowler","context":"Sobre o quadrante de dívida técnica — consciência é o que distingue estratégia de descaso","related_to":"cat:arqsw","url":"https://martinfowler.com/bliki/TechnicalDebtQuadrant.html"},{"text":"Teste manual repetitivo não é garantia de qualidade — é postergação de automação.","author":"Lisa Crispin","context":"Agile Testing Condensed — a automação libera o testador para o trabalho cognitivo","related_to":"cat:devops","url":"https://lisacrispin.com/2018/08/22/whole-team-approach-to-test-automation/"},{"text":"Todo mundo quer escalabilidade. Ninguém quer pagar o preço em complexidade que ela exige.","author":"Martin Kleppmann","context":"Designing Data-Intensive Applications — escolhas arquiteturais envolvem trade-offs reais","related_to":"cat:arqsol","url":"https://dataintensive.net/"},{"text":"Você não tem um problema de microsserviços. Você tem um problema de domínio que agora está espalhado em 30 serviços.","author":"Sam Newman","context":"Building Microservices — decomposição ruim vira sistema distribuído quebrado","related_to":"cat:arqsol","url":"https://samnewman.io/books/building_microservices_2nd_edition/"},{"text":"Zero-trust significa que você não confia nem na sua própria rede interna. Se isso incomoda alguém, esse alguém nunca leu um relatório de breach.","author":"John Kindervag","context":"Criador do modelo zero-trust na Forrester em 2010","related_to":"cat:sec","url":"https://www.forrester.com/blogs/tag/zero-trust/"},{"text":"Observabilidade não é um painel bonito — é a capacidade de fazer perguntas que você ainda não sabia que precisaria fazer.","author":"Charity Majors","context":"Fundadora da Honeycomb — diferencia monitoring de observability","related_to":"cat:obs","url":"https://www.honeycomb.io/blog/observability-a-manifesto"},{"text":"Se você só testa em produção, produção é o seu ambiente de teste — e seus clientes são os QAs.","author":"Michael Feathers","context":"Working Effectively with Legacy Code — testes como rede de segurança","related_to":"cat:arqsw","url":"https://michaelfeathers.silvrback.com/characterization-testing"},{"text":"Código que você tem medo de mudar é código que você não entende. E software que não muda morre.","author":"Kent Beck","context":"Extreme Programming Explained — refatoração contínua como higiene","related_to":"cat:arqsw","url":"https://www.kentbeck.com/posts/tidy-first"},{"text":"Mover rápido quebrando coisas é uma ilusão. Você paga a conta com juros — e o banco cobra em horas de plantão.","author":"Nicole Forsgren","context":"Accelerate — velocidade sustentável vem de qualidade, não de pressa","related_to":"cat:devops","url":"https://itrevolution.com/product/accelerate/"},{"text":"Organizações que projetam sistemas são limitadas a produzir designs que são cópias de suas estruturas de comunicação.","author":"Melvin Conway","context":"Lei de Conway — arquitetura espelha o organograma","related_to":"cat:arqsol","url":"https://www.melconway.com/Home/Committees_Paper.html"},{"text":"Otimização prematura é a raiz de todos os males. Mas ignorar performance até o último minuto é a raiz de produtos mortos.","author":"Donald Knuth","context":"Structured Programming with go to Statements — a frase original com contexto completo","related_to":"general","url":"https://web.archive.org/web/20130731202547/http://pplab.snu.ac.kr/courses/adv_pl05/papers/p261-knuth.pdf"},{"text":"Simplicidade é pré-requisito para confiabilidade.","author":"Edsger Dijkstra","context":"EWD648 — complexidade é inimiga da correção","related_to":"general","url":"https://www.cs.utexas.edu/users/EWD/transcriptions/EWD06xx/EWD648.html"},{"text":"Não existe arquitetura de solução sem trade-off. Se alguém te mostra uma sem trade-offs, pode ser certeza que ele está vendendo algo.","author":"Mark Richards","context":"Fundamentals of Software Architecture — everything in architecture is a trade-off","related_to":"cat:arqsol","url":"https://www.oreilly.com/library/view/fundamentals-of-software/9781492043447/"},{"text":"Monólito primeiro. Só depois, se o domínio provar que é necessário, particione.","author":"Martin Fowler","context":"MonolithFirst — separar por engano cria mais dor do que monolito bem modelado","related_to":"cat:arqsw","url":"https://martinfowler.com/bliki/MonolithFirst.html"},{"text":"DDD não é sobre modelagem de dados. É sobre falar a mesma língua que o negócio fala.","author":"Eric Evans","context":"Domain-Driven Design — Ubiquitous Language como fundação","related_to":"cat:arqsw","url":"https://www.domainlanguage.com/wp-content/uploads/2016/05/DDD_Reference_2015-03.pdf"},{"text":"Event sourcing é fácil de explicar e brutalmente difícil de operar. Não faça isso porque está na moda.","author":"Greg Young","context":"Sobre o custo real de event sourcing em produção","related_to":"cat:integ","url":"https://cqrs.wordpress.com/documents/cqrs-and-event-sourcing-synergy/"},{"text":"A rede é confiável. A latência é zero. A largura de banda é infinita. Todas mentiras que seu código acredita até falhar.","author":"Peter Deutsch","context":"As 8 Falácias da Computação Distribuída — ponto 1, 2 e 3","related_to":"cat:arqsol","url":"https://en.wikipedia.org/wiki/Fallacies_of_distributed_computing"},{"text":"Idempotência não é luxo em sistemas distribuídos — é a diferença entre um retry e uma catástrofe.","author":"Pat Helland","context":"Data on the Outside vs Data on the Inside — papers seminais de sistemas distribuídos","related_to":"cat:integ","url":"https://pathelland.substack.com/p/idempotence-is-not-a-medical-condition"},{"text":"Consistência eventual não é desculpa para design preguiçoso. É um convite para pensar em invariantes com mais cuidado.","author":"Pat Helland","context":"Paper Life Beyond Distributed Transactions","related_to":"cat:data","url":"https://www.ics.uci.edu/~cs223/papers/cidr07p15.pdf"},{"text":"O log é a estrutura de dados mais subestimada da engenharia de software.","author":"Jay Kreps","context":"Co-criador do Kafka — sobre o poder do append-only log","related_to":"tool:kafka","url":"https://engineering.linkedin.com/distributed-systems/log-what-every-software-engineer-should-know-about-real-time-datas-unifying"},{"text":"Kafka não é uma fila. Tratar Kafka como fila é o primeiro passo para um sistema distribuído quebrado.","author":"Jay Kreps","context":"Streams vs queues — mental model importa","related_to":"tool:kafka","url":"https://www.confluent.io/blog/okay-store-data-apache-kafka/"},{"text":"API é contrato. Contrato quebrado sem versionamento é vendor lock-in ao contrário — o cliente fica refém do seu bug.","author":"Roy Fielding","context":"Tese de doutorado sobre REST e hypermedia","related_to":"cat:integ","url":"https://www.ics.uci.edu/~fielding/pubs/dissertation/top.htm"},{"text":"Enterprise Integration Patterns existe porque ninguém quer admitir que a maior parte do software é mover dados entre sistemas.","author":"Gregor Hohpe","context":"EIP — catálogo fundamental de padrões de integração","related_to":"cat:integ","url":"https://www.enterpriseintegrationpatterns.com/"},{"text":"Arquitetura é sobre as coisas que são caras de mudar. Se é fácil de mudar, não é arquitetura — é código.","author":"Ralph Johnson","context":"Citada por Fowler em Who Needs an Architect","related_to":"cat:arqsw","url":"https://martinfowler.com/ieeeSoftware/whoNeedsArchitect.pdf"},{"text":"Todo arquiteto que se recusa a escrever código acaba desenhando sistemas impossíveis de construir.","author":"Robert C. Martin","context":"Clean Architecture — o arquiteto é o melhor programador do time","related_to":"cat:arqsw","url":"https://blog.cleancoder.com/uncle-bob/2012/08/13/the-clean-architecture.html"},{"text":"A primeira regra de uma hierarquia de dependências: dependências apontam para abstrações, nunca para detalhes.","author":"Robert C. Martin","context":"Dependency Inversion Principle — o D do SOLID","related_to":"cat:arqsw","url":"https://web.archive.org/web/20110714224327/http://www.objectmentor.com/resources/articles/dip.pdf"},{"text":"Se você não consegue descrever o fluxo principal do seu sistema em um diagrama C4 de nível 2, você não entende o seu sistema.","author":"Simon Brown","context":"C4 Model — visualizar arquitetura é pré-requisito para comunicá-la","related_to":"tool:structurizr","url":"https://c4model.com/"},{"text":"Arquitetura como código não é luxo — é a única forma de manter a documentação verdadeira enquanto o sistema evolui.","author":"Simon Brown","context":"Structurizr DSL — diagramas que vivem no repositório","related_to":"tool:structurizr","url":"https://structurizr.com/"},{"text":"A beleza do código é inversamente proporcional à quantidade de comentários que explicam o que ele faz.","author":"Kent Beck","context":"Smalltalk Best Practice Patterns — código autoexplicativo","related_to":"cat:arqsw","url":"https://www.kentbeck.com/posts"},{"text":"Se o deploy é um evento, você perdeu. Deploy tem que ser um não-evento: frequente, sem drama, sem rollback improvisado.","author":"Charity Majors","context":"Deploys vs releases — feature flags separam os dois","related_to":"cat:devops","url":"https://charity.wtf/2020/08/19/how-often-should-you-deploy/"},{"text":"Ninguém foi demitido por escolher Kubernetes. Mas muita gente deveria ter sido — elas escolheram Kubernetes sem precisar.","author":"Kelsey Hightower","context":"Kubernetes é poderoso, mas é overengineering para muitos casos","related_to":"tool:kubernetes","url":"https://github.com/kelseyhightower/kubernetes-the-hard-way"},{"text":"Platform engineering não é devops rebatizado. É o reconhecimento de que nem todo time deveria virar especialista em Kubernetes.","author":"Gregor Hohpe","context":"The Software Architect Elevator","related_to":"cat:devops","url":"https://architectelevator.com/book/"},{"text":"A melhor forma de escalar um time é escalando a capacidade de cada engenheiro tomar boas decisões — não adicionando mais aprovações.","author":"Nicole Forsgren","context":"Accelerate — high-trust, high-performance organizations","related_to":"cat:devops","url":"https://cloud.google.com/devops/state-of-devops"},{"text":"Chaos Engineering é a aceitação de que seu sistema vai falhar. A questão é se você quer descobrir como na sua frente ou na frente do cliente.","author":"Nora Jones","context":"Pioneira em Chaos Engineering na Netflix","related_to":"cat:devops","url":"https://principlesofchaos.org/"},{"text":"SLO sem error budget é só número em dashboard. Error budget é o que transforma confiabilidade em decisão de produto.","author":"Liz Fong-Jones","context":"SRE na prática — budget como ferramenta de negociação","related_to":"cat:obs","url":"https://sre.google/sre-book/embracing-risk/"},{"text":"Um alerta que ninguém age é ruído. Ruído treina o time a ignorar alertas — incluindo os que importam.","author":"Cindy Sridharan","context":"Distributed Systems Observability","related_to":"cat:obs","url":"https://copyconstruct.medium.com/monitoring-in-the-time-of-cloud-native-c87c7a5bfa3e"},{"text":"Logs sem correlação entre serviços são diário de bordo — não ferramenta de diagnóstico.","author":"Cindy Sridharan","context":"Observability as a discipline","related_to":"cat:obs","url":"https://copyconstruct.medium.com/logs-and-metrics-6d34d3026e38"},{"text":"Segurança é característica emergente de um sistema bem projetado — não é uma camada que você adiciona no final.","author":"Bruce Schneier","context":"Applied Cryptography — segurança como propriedade arquitetural","related_to":"cat:sec","url":"https://www.schneier.com/books/"},{"text":"Senha em código é o equivalente digital de deixar a chave embaixo do tapete — com a diferença de que qualquer crawler pode copiá-la em segundos.","author":"Bruce Schneier","context":"Secrets Management — princípio básico ignorado","related_to":"cat:sec","url":"https://www.schneier.com/blog/archives/2016/09/stealing_credentials_.html"},{"text":"Supply chain attacks só são uma surpresa para quem nunca olhou para a sua árvore de dependências.","author":"Kelly Shortridge","context":"Security Chaos Engineering","related_to":"cat:sec","url":"https://kellyshortridge.com/"},{"text":"A melhor senha é aquela que nunca precisa existir. Passwordless não é novidade — é correção de um erro histórico.","author":"Troy Hunt","context":"Have I Been Pwned — sobre o futuro da autenticação","related_to":"cat:sec","url":"https://www.troyhunt.com/passwords-evolved-authentication-guidance-for-the-modern-era/"},{"text":"Toda IA é probabilística. Todo arquiteto que trata resposta de LLM como verdade está projetando um sistema que mente em escala.","author":"Andrej Karpathy","context":"Sobre hallucination como feature, não bug, de LLMs","related_to":"cat:ai","url":"https://karpathy.medium.com/software-2-0-a64152b37c35"},{"text":"Retrieval-Augmented Generation é atestar que o modelo sozinho não sabe o que você precisa. Isso não é fraqueza — é honestidade arquitetural.","author":"Patrick Lewis","context":"Paper original de RAG — 2020","related_to":"cat:ai","url":"https://arxiv.org/abs/2005.11401"},{"text":"AI coding tools não substituem juízo. Elas amplificam o juízo do usuário — bom ou ruim.","author":"Simon Willison","context":"LLM tools e qualidade do prompt","related_to":"cat:ai","url":"https://simonwillison.net/2023/Aug/3/weird-world-of-llms/"},{"text":"Generative AI é cara. Não caro em dólares — caro em cycles que poderiam ter sido gastos em engenharia que você realmente precisa.","author":"Simon Willison","context":"Sobre o custo oculto da experimentação com LLMs","related_to":"cat:ai","url":"https://simonwillison.net/tags/llms/"},{"text":"Vendor lock-in em cloud não é quando você usa serviços proprietários. É quando você não consegue responder em quanto tempo sairia se quisesse.","author":"Gregor Hohpe","context":"The Software Architect Elevator — cloud strategy real","related_to":"cat:aws","url":"https://architectelevator.com/cloud/cloud-strategy-book/"},{"text":"Lift-and-shift para cloud sem refatoração entrega o pior dos dois mundos: o custo da cloud com a arquitetura do datacenter.","author":"Adrian Cockcroft","context":"Ex-Netflix, ex-AWS — cloud migration patterns","related_to":"cat:aws","url":"https://adrianco.medium.com/"},{"text":"Serverless não é sem servidor. É servidor que é problema do seu provedor — e problema do seu provedor custa caro quando escala mal.","author":"Werner Vogels","context":"CTO da Amazon — sobre trade-offs reais de serverless","related_to":"cat:aws","url":"https://www.allthingsdistributed.com/"},{"text":"A cloud não é o datacenter de outra pessoa. É um sistema distribuído gigante que você está alugando um pedaço — e sistemas distribuídos falham.","author":"Werner Vogels","context":"Frugal Architect — princípios de design para cloud","related_to":"cat:aws","url":"https://www.allthingsdistributed.com/2024/02/the-frugal-architect.html"},{"text":"Cost optimization em AWS não começa na fatura. Começa na decisão arquitetural de três meses atrás que ninguém lembra de revisar.","author":"Corey Quinn","context":"Last Week in AWS — economia de cloud na prática","related_to":"cat:aws","url":"https://www.lastweekinaws.com/"},{"text":"Databases são mais difíceis de substituir do que linguagens de programação. Escolha com calma e com humildade.","author":"Martin Kleppmann","context":"Designing Data-Intensive Applications — long-term thinking em data","related_to":"cat:data","url":"https://dataintensive.net/"},{"text":"Schema é contrato com seu futuro. Schema sem versão é dívida com juros compostos.","author":"Martin Kleppmann","context":"Evolução de schemas — capítulo 4 de DDIA","related_to":"cat:data","url":"https://martin.kleppmann.com/2012/12/05/schema-evolution-in-avro-protocol-buffers-thrift.html"},{"text":"NoSQL não significa sem schema. Significa que o schema vive no seu código — e geralmente em mais de um lugar.","author":"Rick Houlihan","context":"DynamoDB e NoSQL data modeling","related_to":"cat:data","url":"https://www.youtube.com/watch?v=HaEPXoXVf2k"},{"text":"Migrations de banco assustam porque tratamos dados como se fossem código. Não são — dados têm história, código não.","author":"Mike Hadlow","context":"Sobre o custo real de mudanças de schema em produção","related_to":"cat:data","url":"https://mikehadlow.blogspot.com/"},{"text":"OWASP Top 10 existe porque os mesmos erros continuam sendo cometidos há 20 anos. Leia como um espelho, não como uma checklist.","author":"Jim Manico","context":"Fundador da Manicode — sobre application security","related_to":"tool:owasp","url":"https://owasp.org/www-project-top-ten/"},{"text":"SQL injection em 2026 não é mau-caratismo do atacante. É negligência do desenvolvedor.","author":"Jim Manico","context":"OWASP — prepared statements resolvem isso há décadas","related_to":"cat:sec","url":"https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html"},{"text":"OIDC não é apenas autenticação — é a renúncia coletiva à tentativa de manter seu próprio sistema de identidade.","author":"Nat Sakimura","context":"Co-editor de OIDC — sobre federação de identidade","related_to":"tool:keycloak","url":"https://openid.net/specs/openid-connect-core-1_0.html"},{"text":"Commit early, commit often — e nunca reescreva a história em uma branch compartilhada.","author":"Linus Torvalds","context":"Git — design escolhido para paralelismo e resiliência","related_to":"tool:git","url":"https://git-scm.com/book/en/v2/Git-Branching-Rebasing"},{"text":"Trunk-based development não é perigoso. Branches de vida longa são.","author":"Paul Hammant","context":"Trunk Based Development — referência essencial","related_to":"tool:git","url":"https://trunkbaseddevelopment.com/"},{"text":"Merge vs rebase é guerra santa. Escolha um padrão no time e pare de discutir — o problema real é o tamanho dos seus PRs.","author":"Scott Chacon","context":"Pro Git — livro canônico do Git","related_to":"tool:git","url":"https://git-scm.com/book/en/v2"},{"text":"Containers são packaging. Orquestração é quem resolve o problema que você não tinha antes de containers.","author":"Kelsey Hightower","context":"Kubernetes The Hard Way — entender o problema antes da solução","related_to":"tool:kubernetes","url":"https://github.com/kelseyhightower/kubernetes-the-hard-way"},{"text":"Docker Compose é o YAML mais poderoso da indústria. E o mais perigoso — porque convida você a subir em produção o que é ótimo em dev.","author":"Bret Fisher","context":"Docker Captain — sobre produção vs desenvolvimento","related_to":"tool:docker","url":"https://www.bretfisher.com/"},{"text":"Imagem base Alpine é ótima até o dia em que você precisa debugar libc. Escolha com conhecimento, não por moda.","author":"Solomon Hykes","context":"Criador do Docker — pragmatismo em escolhas de imagem","related_to":"tool:docker","url":"https://www.docker.com/blog/"},{"text":"Spring Boot resolve 80% dos problemas que times Java costumavam reinventar. O problema são os outros 20% que ninguém documenta.","author":"Josh Long","context":"Spring Developer Advocate — a bênção e a maldição da convenção sobre configuração","related_to":"tool:springboot","url":"https://spring.io/blog"},{"text":"Virtual threads não resolvem CPU-bound. Resolvem I/O-bound. Entender a diferença é a diferença entre speedup e regressão.","author":"Brian Goetz","context":"Java Language Architect — Project Loom","related_to":"tool:java","url":"https://openjdk.org/jeps/444"},{"text":"Java não é mais a linguagem dos dinossauros. É a linguagem dos sistemas que precisam continuar funcionando em 2040.","author":"Brian Goetz","context":"Sobre compatibilidade e longevidade da JVM","related_to":"tool:java","url":"https://inside.java/"},{"text":"Gradle é poderoso porque é código. Gradle é doloroso porque é código que você esqueceu que escreveu.","author":"Hans Dockter","context":"Criador do Gradle — build scripts como engenharia","related_to":"tool:gradle","url":"https://blog.gradle.org/"},{"text":"Maven venceu não porque era o melhor — venceu porque foi o primeiro a dizer que build precisava de convenção.","author":"Jason van Zyl","context":"Criador do Maven — convention over configuration","related_to":"tool:maven","url":"https://maven.apache.org/"},{"text":"IDE não é editor de texto com autocomplete. É um compilador interativo que conhece seu código melhor do que você.","author":"Sergey Dmitriev","context":"Co-fundador da JetBrains — o propósito original de uma IDE","related_to":"tool:intellij","url":"https://blog.jetbrains.com/"},{"text":"Postman virou padrão porque a alternativa era testar API manualmente com curl — e quem faz isso no terceiro endpoint desiste.","author":"Abhinav Asthana","context":"Co-fundador do Postman — sobre adoção viral de ferramentas","related_to":"tool:postman","url":"https://www.postman.com/"},{"text":"OpenAPI é o melhor tipo de documentação: a que seu código é obrigado a respeitar sob pena de quebrar em CI.","author":"Erik Wilde","context":"API designer — sobre contract-first design","related_to":"tool:openapi","url":"https://www.openapis.org/"},{"text":"Mongo não é banco de dados. É um modelo de dados que admite que JSON venceu — para o bem e para o mal.","author":"Eliot Horowitz","context":"Co-fundador do MongoDB — document store como filosofia","related_to":"tool:mongocompass","url":"https://www.mongodb.com/company/blog"},{"text":"PostgreSQL é o melhor banco relacional do mundo porque se recusa a ser qualquer outra coisa — e isso é vantagem competitiva.","author":"Simon Riggs","context":"PostgreSQL core team — foco como estratégia","related_to":"tool:postgres","url":"https://www.postgresql.org/about/press/"},{"text":"Databricks não é Spark em cloud. É a aposta de que data lake e data warehouse eram a mesma coisa o tempo todo.","author":"Matei Zaharia","context":"Co-fundador do Databricks — lakehouse como arquitetura unificada","related_to":"tool:databricks","url":"https://www.databricks.com/blog/2020/01/30/what-is-a-data-lakehouse.html"},{"text":"ChatGPT não é inteligente. Ele é convincente. A diferença é o que mata projetos de IA em produção.","author":"Emily Bender","context":"Paper Stochastic Parrots — sobre o hype de LLMs","related_to":"tool:chatgpt","url":"https://dl.acm.org/doi/10.1145/3442188.3445922"},{"text":"Claude Code não escreve código por você. Ele remove o atrito entre você e o código que você já sabe que precisa escrever.","author":"Anthropic Engineering","context":"Sobre a filosofia de AI coding — amplificação, não substituição","related_to":"tool:claudecode","url":"https://www.anthropic.com/news/claude-code"},{"text":"Cursor virou default porque entendeu que IDE com IA embutida não é feature — é mudança de paradigma de edição.","author":"Aman Sanger","context":"Co-fundador do Cursor — sobre a integração profunda de LLM na IDE","related_to":"tool:cursor","url":"https://cursor.com/blog"},{"text":"VS Code venceu não por ser o melhor editor, mas porque foi o primeiro a tratar extensões como cidadãos de primeira classe.","author":"Erich Gamma","context":"Co-criador do VS Code e do Eclipse — aprendizado entre gerações","related_to":"tool:vscode","url":"https://code.visualstudio.com/blogs"},{"text":"O problema de CVE não é a lista ser longa. É a gente descobrir todo dia que usa uma dependência que ninguém mapeou.","author":"Kim Zetter","context":"Jornalista de segurança — sobre SBOM e supply chain","related_to":"tool:cve","url":"https://zetter.substack.com/"},{"text":"Python é a linguagem que vence porque se recusa a ser elegante. Ela é prática — e prática é o que roda em produção.","author":"Guido van Rossum","context":"Criador do Python — filosofia do design","related_to":"tool:python","url":"https://peps.python.org/pep-0020/"},{"text":"JavaScript é universalmente odiado e universalmente usado. Isso diz mais sobre a indústria do que sobre a linguagem.","author":"Brendan Eich","context":"Criador do JavaScript — sobre pragmatismo vs pureza","related_to":"tool:javascript","url":"https://brendaneich.com/"},{"text":"A melhor ferramenta de diagrama é a que sobrevive ao próximo retro do time. Tudo mais é arte que ninguém olha de novo.","author":"Simon Brown","context":"Ferramentas de modelagem — pragmatismo acima de beleza","related_to":"tool:whimsical","url":"https://c4model.com/"},{"text":"PlantUML ganhou porque diagrama é texto. E texto tem diff, review, história — coisas que imagem não tem.","author":"Arnaud Roques","context":"Criador do PlantUML — diagrams-as-code como filosofia","related_to":"tool:plantuml","url":"https://plantuml.com/"},{"text":"Warp reinventou o terminal porque o terminal parou no tempo. Às vezes a inovação é admitir que 40 anos sem mudança não é qualidade — é negligência.","author":"Zach Lloyd","context":"Fundador do Warp — sobre o terminal moderno","related_to":"tool:warp","url":"https://www.warp.dev/blog"},{"text":"GitHub não é o Git. É a plataforma social que colou Git em todos os desenvolvedores do mundo — e a captura de mercado é difícil de reverter.","author":"Chris Wanstrath","context":"Co-fundador do GitHub — network effects em dev tools","related_to":"tool:github","url":"https://github.blog/"},{"text":"Dynatrace é caro. Observabilidade artesanal em escala também é — só que você paga em engenharia e em incidents que duram mais.","author":"Bernd Greifeneder","context":"CTO da Dynatrace — sobre o trade-off buy vs build em observabilidade","related_to":"tool:dynatrace","url":"https://www.dynatrace.com/news/blog/"},{"text":"MySQL continua vivo em 2026 não por mérito técnico — mas porque meio mundo da internet ainda roda em cima dele. Legado é força.","author":"Monty Widenius","context":"Co-criador do MySQL — sobre adoção massiva","related_to":"tool:mysql","url":"https://mariadb.org/about/"},{"text":"DBeaver ganhou contra ferramentas proprietárias porque ninguém quer pagar licença para ver tabela. Simplicidade às vezes vence complexidade comercial.","author":"Serge Rider","context":"Criador do DBeaver — open source vs enterprise em dev tooling","related_to":"tool:dbeaver","url":"https://dbeaver.io/"},{"text":"A verdade é que a maioria dos sistemas distribuídos que vejo em produção são sistemas centralizados disfarçados — com a latência dos distribuídos e a fragilidade dos centralizados.","author":"Tim Bray","context":"Ex-arquiteto AWS — sobre arquitetura real","related_to":"cat:arqsol","url":"https://www.tbray.org/ongoing/"},{"text":"Não há silver bullet. Não há fork-lift. Não há IA que pense por você. Engenharia continua sendo escolha entre trade-offs desagradáveis.","author":"Fred Brooks","context":"No Silver Bullet — ensaio seminal sobre complexidade essencial","related_to":"general","url":"https://worrydream.com/refs/Brooks_1986_-_No_Silver_Bullet.pdf"},{"text":"Adicionar pessoas a um projeto atrasado só atrasa mais ainda. Brooks's Law não envelheceu — só ganhou mais exemplos.","author":"Fred Brooks","context":"The Mythical Man-Month — lei clássica que ninguém aprende","related_to":"general","url":"https://archive.org/details/MythicalManMonth"},{"text":"Refatorar sem testes é remodelar casa sem planta — você descobre o que era estrutural quando o teto cai.","author":"Michael Feathers","context":"Working Effectively with Legacy Code — characterization tests","related_to":"cat:arqsw","url":"https://www.oreilly.com/library/view/working-effectively-with/0131177052/"},{"text":"REST venceu SOAP não porque era mais elegante — venceu porque desenvolvedor comum conseguia entender em 10 minutos.","author":"Roy Fielding","context":"Tese sobre REST — simplicidade como estratégia","related_to":"cat:integ","url":"https://www.ics.uci.edu/~fielding/pubs/dissertation/rest_arch_style.htm"},{"text":"Sidecars são um padrão lindo no papel. Em produção, eles dobram sua superfície de falha — e triplicam sua fatura de cloud.","author":"Christian Posta","context":"Service mesh na prática — sobre custos reais de Istio/Envoy","related_to":"cat:arqsol","url":"https://www.christianposta.com/"},{"text":"O que você chama de microsserviços, eu chamo de sistema distribuído. A diferença é que você está construindo com intenção — ou acidente?","author":"Tyler Treat","context":"Sobre decomposição de serviços consciente","related_to":"cat:arqsol","url":"https://bravenewgeek.com/"},{"text":"Se você consegue medir, você pode gerenciar. Se você não mede SLO, você está gerenciando por fé.","author":"Benjamin Treynor Sloss","context":"VP da Google SRE — criador do termo Site Reliability Engineering","related_to":"cat:obs","url":"https://sre.google/sre-book/introduction/"},{"text":"Toda arquitetura é boa até encontrar seu primeiro requisito não-funcional real.","author":"Neal Ford","context":"Building Evolutionary Architectures — fitness functions","related_to":"cat:arqsw","url":"https://nealford.com/books/evolutionaryarchitectures.html"},{"text":"ADRs existem porque a memória humana é mais curta que o ciclo de vida do software. Escreva — ou reviva a mesma discussão.","author":"Michael Nygard","context":"Release It! — popularizou Architecture Decision Records","related_to":"cat:arqsw","url":"https://cognitect.com/blog/2011/11/15/documenting-architecture-decisions"},{"text":"Circuit breaker não é sobre falhar rápido. É sobre falhar com dignidade — e dar ao sistema a chance de se recuperar em paz.","author":"Michael Nygard","context":"Release It! — padrões de estabilidade em produção","related_to":"cat:arqsol","url":"https://pragprog.com/titles/mnee2/release-it-second-edition/"},{"text":"Landing zones existem porque ninguém quer admitir que começou a usar cloud sem um plano — e agora não consegue parar.","author":"Gregor Hohpe","context":"Cloud Strategy — governança como recuperação de dívida","related_to":"cat:arqsol","url":"https://architectelevator.com/cloud/"},{"text":"Todo CTO que promete transformação digital sem tocar no data model está vendendo teatro — não engenharia.","author":"Gregor Hohpe","context":"The Software Architect Elevator","related_to":"cat:arqsol","url":"https://architectelevator.com/book/"},{"text":"TOGAF é um vocabulário compartilhado, não um método. Use como dicionário — não como manual de instruções.","author":"Jan Hoogervorst","context":"Enterprise Governance and Enterprise Engineering","related_to":"cat:arqsol","url":"https://www.opengroup.org/togaf"},{"text":"A melhor arquitetura é a que você consegue explicar para o time em 30 minutos — e eles não precisam anotar nada porque já sabem o que faz sentido.","author":"Ward Cunningham","context":"Criador do Wiki — simplicidade como comunicação","related_to":"cat:arqsw","url":"http://wiki.c2.com/?SimplicityAndStrictness"},{"text":"Idempotent consumer é o padrão mais importante de event-driven. Ignorá-lo é convidar duplicatas para a sua festa de produção.","author":"Chris Richardson","context":"Microservices Patterns — padrões essenciais de mensageria","related_to":"cat:integ","url":"https://microservices.io/patterns/communication-style/idempotent-consumer.html"},{"text":"Saga não resolve o problema de transações distribuídas — ela o transfere para o domínio, onde é visível e debatível.","author":"Chris Richardson","context":"Saga pattern — compensating transactions","related_to":"cat:arqsol","url":"https://microservices.io/patterns/data/saga.html"},{"text":"Event-driven architecture não é a solução para acoplamento. É uma escolha sobre onde o acoplamento vai aparecer — e se ele vai ser visível ou escondido.","author":"Sam Newman","context":"Building Microservices 2nd Edition","related_to":"cat:integ","url":"https://samnewman.io/"},{"text":"Ferramentas não te salvam de más decisões arquiteturais. Elas te deixam tomar as más decisões mais rápido.","author":"Gregor Hohpe","context":"Enterprise Integration Patterns — sobre o papel de iPaaS","related_to":"general","url":"https://www.enterpriseintegrationpatterns.com/"},{"text":"A primeira vez que você precisou fazer um hotfix em produção no sábado à noite, você entendeu por que CI/CD existe. A segunda vez, você entendeu por que feature flags existem.","author":"David Farley","context":"Continuous Delivery — a origem do movimento","related_to":"cat:devops","url":"https://continuousdelivery.com/"},{"text":"Clean Code é aspiração, não checklist. Quem aplica como dogma acaba com código tão engessado que ninguém consegue mexer.","author":"Dan North","context":"Criador do BDD — crítica ao dogmatismo em boas práticas","related_to":"cat:arqsw","url":"https://dannorth.net/"},{"text":"Regras são para pessoas sem experiência. Com experiência, você entende que toda regra tem contexto — e o contexto importa mais que a regra.","author":"Rich Hickey","context":"Criador do Clojure — Simple Made Easy","related_to":"cat:arqsw","url":"https://www.infoq.com/presentations/Simple-Made-Easy/"},{"text":"Simple e easy são palavras diferentes. Easy é familiar. Simple é sem partes entrelaçadas — e só uma delas escala.","author":"Rich Hickey","context":"Simple Made Easy — talk seminal","related_to":"cat:arqsw","url":"https://github.com/matthiasn/talk-transcripts/blob/master/Hickey_Rich/SimpleMadeEasy.md"},{"text":"A melhor DX é aquela que o desenvolvedor não percebe. Atrito invisível é o que mata produtividade em escala.","author":"Kathryn Koehler","context":"Netflix Productivity Engineering","related_to":"cat:devops","url":"https://netflixtechblog.com/"},{"text":"Nenhum framework te salva de não entender seu domínio. Você só vai construir o errado mais rápido.","author":"Vaughn Vernon","context":"Implementing DDD — crítica à cultura de framework-first","related_to":"tool:springboot","url":"https://vaughnvernon.com/"},{"text":"GraphQL resolve o problema N+1 que REST criou — e introduz três novos problemas que ninguém documenta até estar em produção.","author":"Lee Byron","context":"Co-criador do GraphQL — honestidade sobre trade-offs","related_to":"cat:integ","url":"https://graphql.org/"},{"text":"gRPC é melhor que REST em latência. REST é melhor que gRPC em evolução. Você raramente precisa dos dois — mas quase sempre escolhe errado primeiro.","author":"Martin Fowler","context":"Microservices communication — trade-offs entre estilos","related_to":"cat:integ","url":"https://martinfowler.com/articles/microservices.html"},{"text":"A única documentação que permanece verdadeira é a que o compilador verifica. Tudo mais é ficção esperando ser descoberta.","author":"Joshua Bloch","context":"Effective Java — APIs como documentação viva","related_to":"tool:java","url":"https://www.oreilly.com/library/view/effective-java-3rd/9780134686097/"}]};
