/* ====================================================
   THEME
   ==================================================== */
let _theme = localStorage.getItem('csr-theme') || 'auto';

function applyTheme(t) {
  _theme = t;
  localStorage.setItem('csr-theme', t);
  const dark = t === 'dark' || (t === 'auto' && window.matchMedia('(prefers-color-scheme:dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
}

function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  applyTheme(cur === 'dark' ? 'light' : 'dark');
  renderAll();
}

function isDark() {
  return document.documentElement.getAttribute('data-theme') === 'dark';
}

// Apply immediately to prevent flash
applyTheme(_theme);

/* ====================================================
   ROUTER
   ==================================================== */
let _state = {view:'home', slug:null};
let _calYear, _calMonth;
let _quoteRel = null, _curQuote = null;

function nav(path) { location.hash = '#' + path; }
function navLatest() {
  const dates = DATA.editions.editions.map(e=>e.date).sort().reverse();
  if (dates.length) nav('/day/' + dates[0]);
}

function parseHash() {
  const h = (location.hash || '#/home').replace('#','');
  const parts = h.split('/').filter(Boolean);
  return { view: parts[0] || 'home', slug: parts[1] || null };
}

window.addEventListener('hashchange', () => { _state = parseHash(); renderAll(); });
window.addEventListener('load', () => {
  applyTheme(_theme);
  _state = parseHash();
  const t = new Date();
  _calYear = t.getFullYear();
  _calMonth = t.getMonth();
  renderAll();
});
window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change', () => {
  if (_theme === 'auto') { applyTheme('auto'); renderAll(); }
});

/* ====================================================
   DATA HELPERS
   ==================================================== */
function sortedDates() {
  return DATA.editions.editions.map(e=>e.date).sort().reverse();
}

function getAllNews(filterFn) {
  const all = [];
  for (const [date, day] of Object.entries(DATA.days)) {
    for (const item of (day.news||[])) {
      all.push({...item, _date:date, _dateFmt:day.formatted_date});
    }
  }
  return all.filter(filterFn).sort((a,b) => new Date(b._date)-new Date(a._date));
}

function getAllToolItems(key) {
  const all = [];
  const seen = new Set();
  for (const [date, day] of Object.entries(DATA.days)) {
    // From tools array
    for (const t of (day.tools||[])) {
      if (t.tool_key === key && !seen.has(t.headline)) {
        seen.add(t.headline);
        all.push({...t, _date:date, _dateFmt:day.formatted_date});
      }
    }
    // From news where tags include key
    for (const n of (day.news||[])) {
      if ((n.tags||[]).includes(key) && !seen.has(n.headline)) {
        seen.add(n.headline);
        all.push({...n, _date:date, _dateFmt:day.formatted_date});
      }
    }
  }
  return all.sort((a,b) => new Date(b._date)-new Date(a._date));
}

function getToolName(key) {
  for (const [,day] of Object.entries(DATA.days)) {
    const t = (day.tools||[]).find(t=>t.tool_key===key);
    if (t) return t.name;
  }
  return key;
}

function getCatInfo(slug) {
  for (const [,day] of Object.entries(DATA.days)) {
    for (const n of [...(day.news||[]),...(day.highlights||[])]) {
      if (n.category === slug) return {label: n.category_label||slug, icon: n.category_icon||'📌'};
    }
  }
  return {label:slug, icon:'📌'};
}

function quoteFor(rel) {
  const q = DATA.quotes;
  let pool = rel ? q.filter(x=>x.related_to===rel) : [];
  if (!pool.length) pool = q.filter(x=>x.related_to==='general');
  if (!pool.length) pool = q;
  return pool[Math.floor(Math.random()*pool.length)];
}

/* ====================================================
   ICON HELPERS
   ==================================================== */
function toolIcon(key, size=22) {
  const slug = TOOL_SLUGS[key];
  const color = TOOL_COLORS[key] || '#888';
  const emoji = TOOL_EMOJI[key] || '🔧';
  const iconColor = isDark() ? 'ffffff' : color.replace('#','');
  const bg = `color-mix(in srgb,${color} 15%,transparent)`;
  const wrap = size + 14;
  const br = Math.round(wrap * 0.24);
  if (slug) {
    return `<span style="width:${wrap}px;height:${wrap}px;border-radius:${br}px;background:${bg};display:inline-flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0"><img src="https://cdn.simpleicons.org/${slug}/${iconColor}" width="${size}" height="${size}" style="object-fit:contain;display:block" alt="${key}" onerror="this.parentNode.textContent='${emoji}'"></span>`;
  }
  return `<span style="width:${wrap}px;height:${wrap}px;border-radius:${br}px;background:${bg};display:inline-flex;align-items:center;justify-content:center;font-size:${size-2}px;flex-shrink:0">${emoji}</span>`;
}

function catIcon(cat, emoji, size=16) {
  const color = CAT_COLORS[cat] || '#888';
  const bg = `color-mix(in srgb,${color} 15%,transparent)`;
  const wrap = size + 14;
  return `<span style="width:${wrap}px;height:${wrap}px;border-radius:50%;background:${bg};display:inline-flex;align-items:center;justify-content:center;font-size:${size}px;flex-shrink:0">${emoji}</span>`;
}

/* ====================================================
   SIDEBAR LEFT
   ==================================================== */
function renderSidebar() {
  const {view, slug} = _state;

  // Category counts
  const catCount = {};
  const catInfoMap = {};
  for (const [,day] of Object.entries(DATA.days)) {
    for (const n of (day.news||[])) {
      catCount[n.category] = (catCount[n.category]||0)+1;
      if (!catInfoMap[n.category]) catInfoMap[n.category] = {label:n.category_label||n.category, icon:n.category_icon||'📌'};
    }
    for (const n of (day.highlights||[])) {
      if (n.category && !catInfoMap[n.category]) catInfoMap[n.category] = {label:n.category_label||n.category, icon:n.category_icon||'📌'};
    }
  }

  // Tool/lang tallies
  const toolMap = {};
  for (const [,day] of Object.entries(DATA.days)) {
    for (const t of (day.tools||[])) {
      if (!toolMap[t.tool_key]) toolMap[t.tool_key] = {name:t.name, count:0};
      toolMap[t.tool_key].count++;
    }
  }

  const langKeys = LANGS.filter(k=>toolMap[k]);
  const toolKeys = Object.keys(toolMap).filter(k=>!LANGS.includes(k)).sort((a,b)=>toolMap[b].count-toolMap[a].count);

  const cats = Object.keys(catInfoMap).sort((a,b)=>{
    const oa=Object.keys(CAT_COLORS).indexOf(a), ob=Object.keys(CAT_COLORS).indexOf(b);
    return (oa<0?99:oa)-(ob<0?99:ob);
  });

  let h = '';

  // Categories
  h += `<div class="sb-section" id="sbc-cats">
    <div class="sb-section-hdr" onclick="sbToggle('sbc-cats')">
      <span>Categorias</span><span class="sb-toggle">▾</span>
    </div>
    <ul class="sb-items">`;
  for (const c of cats) {
    const info = catInfoMap[c];
    const color = CAT_COLORS[c]||'#888';
    const act = view==='cat'&&slug===c?' active':'';
    h += `<li class="sb-item${act}" style="--ic:${color}" onclick="nav('/cat/${c}')">
      ${catIcon(c,info.icon,12)}
      <span class="sb-label">${e(info.label)}</span>
      <span class="sb-count">${catCount[c]||''}</span>
    </li>`;
  }
  h += `</ul></div>`;

  // Languages
  h += `<div class="sb-section" id="sbc-langs">
    <div class="sb-section-hdr" onclick="sbToggle('sbc-langs')">
      <span>Linguagens</span><span class="sb-toggle">▾</span>
    </div>
    <ul class="sb-items">`;
  for (const k of langKeys) {
    const color = TOOL_COLORS[k]||'#888';
    const act = view==='lang'&&slug===k?' active':'';
    h += `<li class="sb-item${act}" style="--ic:${color}" onclick="nav('/lang/${k}')">
      ${toolIcon(k,14)}
      <span class="sb-label">${e(toolMap[k].name)}</span>
    </li>`;
  }
  h += `</ul></div>`;

  // Tools
  h += `<div class="sb-section" id="sbc-tools">
    <div class="sb-section-hdr" onclick="sbToggle('sbc-tools')">
      <span>Ferramentas</span><span class="sb-toggle">▾</span>
    </div>
    <ul class="sb-items">`;
  for (const k of toolKeys) {
    const color = TOOL_COLORS[k]||'#888';
    const act = view==='tool'&&slug===k?' active':'';
    h += `<li class="sb-item${act}" style="--ic:${color}" onclick="nav('/tool/${k}')">
      ${toolIcon(k,14)}
      <span class="sb-label">${e(toolMap[k].name)}</span>
    </li>`;
  }
  h += `</ul></div>`;

  document.getElementById('sb-content').innerHTML = h;
}

function sbToggle(id) {
  document.getElementById(id).classList.toggle('collapsed');
}

/* ====================================================
   CALENDAR
   ==================================================== */
function renderCalendar() {
  const edDates = new Set(DATA.editions.editions.map(e=>e.date));
  const selDate = _state.view==='day' ? _state.slug : null;
  const today = new Date();
  const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;

  if (_calYear===undefined) { _calYear=today.getFullYear(); _calMonth=today.getMonth(); }

  const first = new Date(_calYear,_calMonth,1);
  const days = new Date(_calYear,_calMonth+1,0).getDate();
  const startDow = (first.getDay()+6)%7;
  const wds = ['S','T','Q','Q','S','S','D'];

  let h = `<div class="cal-title-row">
    <button class="cal-nav" onclick="calPrev()">‹</button>
    <span class="cal-month">${MONTHS_PT[_calMonth]} ${_calYear}</span>
    <button class="cal-nav" onclick="calNext()">›</button>
  </div><div class="cal-grid">`;

  wds.forEach(w => h += `<div class="cal-wd">${w}</div>`);
  for (let i=0;i<startDow;i++) h += `<div class="cal-d"></div>`;

  for (let d=1;d<=days;d++) {
    const mm = String(_calMonth+1).padStart(2,'0');
    const dd = String(d).padStart(2,'0');
    const ds = `${_calYear}-${mm}-${dd}`;
    const hasEd = edDates.has(ds);
    const isSel = ds===selDate;
    const isToday = ds===todayStr;
    let cls='cal-d';
    if(hasEd) cls+=' has';
    if(isSel) cls+=' sel';
    if(isToday&&!isSel) cls+=' today';
    const click = hasEd?`onclick="nav('/day/${ds}')"`:'';
    h += `<div class="${cls}" ${click}>${d}${hasEd&&!isSel?'<span class="cal-dot"></span>':''}</div>`;
  }
  h += `</div>`;
  document.getElementById('calendar').innerHTML = h;
}

function calPrev() {
  _calMonth--;
  if(_calMonth<0){_calMonth=11;_calYear--;}
  renderCalendar();
}
function calNext() {
  _calMonth++;
  if(_calMonth>11){_calMonth=0;_calYear++;}
  renderCalendar();
}

/* ====================================================
   DAY VIEW
   ==================================================== */
function renderDay(date) {
  const day = DATA.days[date];
  if (!day) return emptyState('Edição não encontrada para ' + date);

  const totalNews = (day.news||[]).length;
  const totalTools = (day.tools||[]).length;
  const dates = sortedDates();
  const idx = dates.indexOf(date);
  const prev = dates[idx+1];
  const next = dates[idx-1];

  let h = `<div class="day-header">
    <div class="day-breadcrumb">Edição diária</div>
    <div class="day-date">${e(day.formatted_date)}</div>
    <div class="day-meta">${totalNews} notícias · ${totalTools} releases/tools</div>
    <div class="day-hero-title">${e(day.hero_title||'')}</div>
    <div class="day-hero-desc">${e(day.hero_description||'')}</div>
  </div>
  <div class="day-content">`;

  // Highlights
  if (day.highlights?.length) {
    h += `<h2 class="sect-title">✨ Destaques <span class="sect-count">${day.highlights.length}</span></h2>
    <div class="hl-grid">`;
    for (const item of day.highlights) {
      const cc = CAT_COLORS[item.category]||'#888';
      h += `<div class="hl-card" onclick="window.open('${item.url}','_blank')">
        <div class="hl-card-top">
          <img class="hl-favicon" src="${item.image}" onerror="this.style.display='none'" alt="">
          <span class="cat-chip" style="--cc:${cc}">${item.category_icon||''} ${e(item.category_label||item.category)}</span>
          ${item.urgent?'<span class="badge badge-u">Urgente</span>':''}
        </div>
        <div class="hl-title">${e(item.headline)}</div>
        <div class="hl-summary">${e(item.summary||'')}</div>
        <div class="hl-footer">
          <span>${e(item.source||'')}</span>
          ${item.read_time?`<span>· ${item.read_time} min</span>`:''}
        </div>
      </div>`;
    }
    h += `</div>`;
  }

  // News by category
  const bycat = {};
  for (const n of (day.news||[])) {
    (bycat[n.category]||(bycat[n.category]=[])).push(n);
  }
  const catOrder = Object.keys(CAT_COLORS);
  const sortedCats = Object.keys(bycat).sort((a,b)=>{
    const ia=catOrder.indexOf(a), ib=catOrder.indexOf(b);
    return (ia<0?99:ia)-(ib<0?99:ib);
  });

  h += `<h2 class="sect-title" style="margin-top:40px">📰 Por categoria</h2>`;

  for (const cat of sortedCats) {
    const items = bycat[cat].sort((a,b)=>(b.urgent?1:0)-(a.urgent?1:0)||new Date(b.published_at||b._date)-new Date(a.published_at||a._date));
    const color = CAT_COLORS[cat]||'#888';
    const fi = items[0];
    h += `<div class="cat-group" style="--cc:${color}">
      <div class="cat-group-hdr">
        ${catIcon(cat,fi.category_icon||'📌',16)}
        <div>
          <div class="cg-name" onclick="nav('/cat/${cat}')">${e(fi.category_label||cat)}</div>
          <div class="cg-count">${items.length} ${items.length===1?'item':'itens'}</div>
        </div>
      </div>`;
    for (const item of items) h += newsCard(item, color);
    h += `</div>`;
  }

  // Tools
  if (day.tools?.length) {
    h += `<h2 class="sect-title" style="margin-top:40px">🔧 Ferramentas & Linguagens <span class="sect-count">${day.tools.length}</span></h2>
    <div class="tools-grid">`;
    for (const t of day.tools) {
      const color = TOOL_COLORS[t.tool_key]||'#888';
      const isL = LANGS.includes(t.tool_key);
      const tgt = isL ? `/lang/${t.tool_key}` : `/tool/${t.tool_key}`;
      h += `<div class="tool-card" style="--tc:${color}" onclick="nav('${tgt}')">
        <div class="tc-icon" style="--tc:${color}">${toolIcon(t.tool_key,22)}</div>
        <div class="tc-body">
          <div class="tc-name">${e(t.name)}</div>
          <div class="tc-ver">${t.version?e(t.version)+' · ':''}${t.kind==='release'?'🚀 Release':'📰 News'}</div>
          <div class="tc-hl">${e(t.headline||'')}</div>
        </div>
      </div>`;
    }
    h += `</div>`;
  }

  // Day nav
  h += `<div class="day-nav-btns">
    ${prev?`<button class="day-nav-btn" onclick="nav('/day/${prev}')">← ${prev}</button>`:'<span></span>'}
    ${next?`<button class="day-nav-btn" onclick="nav('/day/${next}')">${next} →</button>`:'<span></span>'}
  </div>`;

  h += `</div>`; // .day-content
  return h;
}

/* ====================================================
   ESCAPE HTML
   ==================================================== */
function e(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ====================================================
   MAIN RENDER
   ==================================================== */
function renderAll() {
  const {view, slug} = _state;

  // Quote context
  let newRel = null;
  if (view==='cat') newRel = `cat:${slug}`;
  else if (view==='lang'||view==='tool') newRel = `tool:${slug}`;
  if (newRel !== _quoteRel) { _quoteRel=newRel; _curQuote=null; }

  // Sync calendar selection
  if (view==='day' && slug) {
    const d = new Date(slug);
    _calYear = d.getFullYear();
    _calMonth = d.getMonth();
  }

  renderSidebar();
  renderCalendar();
  renderQuote();

  // Nav active
  document.querySelectorAll('.nav-link').forEach(el=>el.classList.remove('active'));
  if (view==='home') document.querySelector('[data-v="home"]')?.classList.add('active');

  // Content
  let content;
  switch(view) {
    case 'home': content = renderHome(); break;
    case 'day':  content = renderDay(slug); break;
    case 'cat':  content = renderCat(slug); break;
    case 'lang': content = renderEntity(slug,'lang'); break;
    case 'tool': content = renderEntity(slug,'tool'); break;
    default:     content = renderHome();
  }
  document.getElementById('main').innerHTML = content;
  window.scrollTo({top:0,behavior:'auto'});
}

/* ====================================================
   HAMBURGER / MOBILE SIDEBAR
   ==================================================== */
document.getElementById('hamburger').addEventListener('click', () => {
  const sl = document.getElementById('sidebar-left');
  const ov = document.getElementById('overlay');
  sl.classList.toggle('open');
  ov.classList.toggle('on');
});

function closeSidebar() {
  document.getElementById('sidebar-left').classList.remove('open');
  document.getElementById('overlay').classList.remove('on');
}
</script>
</body>
</html>
