<!DOCTYPE html>
<html lang="pt-BR" data-theme="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="CSR News — Arquitetura, plataformas e IA para quem constrói software sério">
<title>CSR News</title>
<style>
/* ===== THEME TOKENS ===== */
:root {
  color-scheme: light;
  --bg: #f5f5f7;
  --bg-alt: #ffffff;
  --surface: #ffffff;
  --surface-el: #f5f5f7;
  --surface-card: #ffffff;
  --nav-bg: rgba(255,255,255,0.82);
  --text: #1d1d1f;
  --text-2: rgba(0,0,0,0.56);
  --text-3: rgba(0,0,0,0.36);
  --border: rgba(0,0,0,0.08);
  --accent: #0071e3;
  --accent-h: #0077ed;
  --link: #0066cc;
  --shadow: rgba(0,0,0,0.22) 3px 5px 30px 0px;
  --shadow-s: rgba(0,0,0,0.08) 0 2px 8px 0;
  --sw: 240px;
  --rw: 300px;
  --nh: 48px;
  --r: 8px;
  --rl: 12px;
  --rp: 980px;
  --tr: 0.18s ease;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #000000; --bg-alt: #000000;
    --surface: #1c1c1e; --surface-el: #2a2a2d; --surface-card: #272729;
    --nav-bg: rgba(0,0,0,0.72);
    --text: #f5f5f7; --text-2: rgba(255,255,255,0.56); --text-3: rgba(255,255,255,0.36);
    --border: rgba(255,255,255,0.08);
    --accent: #2997ff; --accent-h: #409cff; --link: #2997ff;
    --shadow: rgba(0,0,0,0.5) 3px 5px 30px 0px; --shadow-s: rgba(0,0,0,0.3) 0 2px 8px 0;
  }
}
[data-theme="dark"] {
  color-scheme: dark;
  --bg: #000000; --bg-alt: #000000;
  --surface: #1c1c1e; --surface-el: #2a2a2d; --surface-card: #272729;
  --nav-bg: rgba(0,0,0,0.72);
  --text: #f5f5f7; --text-2: rgba(255,255,255,0.56); --text-3: rgba(255,255,255,0.36);
  --border: rgba(255,255,255,0.08);
  --accent: #2997ff; --accent-h: #409cff; --link: #2997ff;
  --shadow: rgba(0,0,0,0.5) 3px 5px 30px 0px; --shadow-s: rgba(0,0,0,0.3) 0 2px 8px 0;
}
[data-theme="light"] {
  color-scheme: light;
  --bg: #f5f5f7; --bg-alt: #ffffff;
  --surface: #ffffff; --surface-el: #f5f5f7; --surface-card: #ffffff;
  --nav-bg: rgba(255,255,255,0.82);
  --text: #1d1d1f; --text-2: rgba(0,0,0,0.56); --text-3: rgba(0,0,0,0.36);
  --border: rgba(0,0,0,0.08);
  --accent: #0071e3; --accent-h: #0077ed; --link: #0066cc;
  --shadow: rgba(0,0,0,0.22) 3px 5px 30px 0px; --shadow-s: rgba(0,0,0,0.08) 0 2px 8px 0;
}

/* ===== RESET ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{font-family:-apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.47;letter-spacing:-0.374px;font-size:17px;transition:background var(--tr),color var(--tr)}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
img{display:block;max-width:100%}
button{cursor:pointer;border:none;background:none;font-family:inherit;color:inherit}
ul,ol{list-style:none}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* ===== NAV ===== */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:200;
  height:var(--nh);
  background:var(--nav-bg);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 20px;gap:12px;
}
.nav-logo{
  display:flex;align-items:center;gap:8px;
  font-size:15px;font-weight:700;letter-spacing:-0.3px;color:var(--text);cursor:pointer;
  flex-shrink:0;
}
.nav-logo-img{height:22px;width:auto}
.nav-links{display:flex;gap:2px;flex:1;justify-content:center}
.nav-link{
  font-size:12px;font-weight:400;letter-spacing:-0.12px;
  padding:5px 12px;border-radius:var(--rp);color:var(--text);
  transition:background var(--tr);cursor:pointer;
}
.nav-link:hover{background:var(--border)}
.nav-link.active{background:var(--surface-el);font-weight:600}
.nav-actions{display:flex;align-items:center;gap:8px;margin-left:auto;flex-shrink:0}
.btn-theme{
  width:32px;height:32px;border-radius:50%;
  background:var(--surface-el);
  display:flex;align-items:center;justify-content:center;
  font-size:14px;transition:background var(--tr);
}
.btn-theme:hover{background:var(--border)}
.hamburger{
  display:none;font-size:18px;padding:6px 8px;border-radius:var(--r);
  align-items:center;justify-content:center;color:var(--text);
}

/* ===== APP LAYOUT ===== */
.app-body{padding-top:var(--nh);min-height:100vh;background:var(--bg)}
.app-layout{
  display:grid;
  grid-template-columns:var(--sw) 1fr var(--rw);
  max-width:1500px;margin:0 auto;
  min-height:calc(100vh - var(--nh));
}

/* ===== SIDEBARS ===== */
.sidebar{
  position:sticky;top:var(--nh);
  height:calc(100vh - var(--nh));
  overflow-y:auto;overflow-x:hidden;
}
.sidebar-left{
  border-right:1px solid var(--border);
  padding:16px 0 60px;
  background:var(--bg);
}
.sidebar-right{
  border-left:1px solid var(--border);
  padding:16px 14px 60px;
  background:var(--bg);
}

/* Sidebar sections */
.sb-section{margin-bottom:4px}
.sb-section-hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 16px 6px;cursor:pointer;
  font-size:10px;font-weight:700;letter-spacing:0.6px;text-transform:uppercase;
  color:var(--text-3);
}
.sb-section-hdr:hover{color:var(--text-2)}
.sb-toggle{font-size:9px;transition:transform 0.2s;display:inline-block}
.sb-section.collapsed .sb-toggle{transform:rotate(-90deg)}
.sb-section.collapsed .sb-items{display:none}

.sb-item{
  display:flex;align-items:center;gap:10px;
  padding:7px 14px 7px 12px;cursor:pointer;
  margin:1px 6px;border-radius:var(--r);
  transition:background var(--tr);
  font-size:13px;letter-spacing:-0.2px;color:var(--text);
  border-left:3px solid transparent;
  position:relative;
}
.sb-item:hover{background:var(--surface-el)}
.sb-item.active{
  border-left-color:var(--ic,var(--accent));
  background:color-mix(in srgb,var(--ic,var(--accent)) 10%,var(--surface));
  font-weight:500;
}
.sb-icon{
  width:26px;height:26px;border-radius:7px;
  background:color-mix(in srgb,var(--ic,var(--accent)) 15%,transparent);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;font-size:13px;overflow:hidden;
}
.sb-icon img{width:16px;height:16px;object-fit:contain;display:block}
.sb-label{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-count{
  font-size:11px;letter-spacing:0;color:var(--text-3);
  background:var(--surface-el);border-radius:var(--rp);
  padding:1px 6px;min-width:18px;text-align:center;flex-shrink:0;
}

/* ===== CONTENT ===== */
.content-main{min-height:calc(100vh - var(--nh));background:var(--bg)}
.c-pad{padding:32px 40px 60px}
.c-pad-home{padding:0}

/* ===== BUTTONS ===== */
.btn-p{
  display:inline-flex;align-items:center;
  background:var(--accent);color:#fff;
  padding:10px 22px;border-radius:var(--r);font-size:17px;font-weight:400;
  letter-spacing:-0.374px;transition:background var(--tr),transform 0.1s;cursor:pointer;
}
.btn-p:hover{background:var(--accent-h);text-decoration:none;color:#fff}
.btn-p:active{transform:scale(0.98)}
.btn-o{
  display:inline-flex;align-items:center;
  border:1px solid rgba(0,0,0,0.2);color:var(--text);
  padding:10px 22px;border-radius:var(--rp);font-size:17px;font-weight:400;
  letter-spacing:-0.374px;transition:all var(--tr);cursor:pointer;
}
[data-theme="dark"] .btn-o{border-color:rgba(255,255,255,0.2)}
.btn-o:hover{border-color:var(--accent);color:var(--accent);text-decoration:none;background:color-mix(in srgb,var(--accent) 6%,transparent)}

/* ===== HOME ===== */
.home-hero{
  min-height:calc(100vh - var(--nh));
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--bg-alt);text-align:center;
  padding:60px 32px 40px;
  position:relative;overflow:hidden;
}
[data-theme="dark"] .home-hero,[data-theme="auto"] .home-hero{}
.home-mascot{width:min(200px,30vw);margin-bottom:24px;filter:drop-shadow(0 8px 24px rgba(0,0,0,0.15))}
.home-title{
  font-family:-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
  font-size:clamp(52px,7vw,88px);font-weight:600;line-height:1.07;letter-spacing:-0.03em;
  margin-bottom:14px;color:var(--text);
}
.home-sub{
  font-family:-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
  font-size:clamp(17px,2.2vw,24px);font-weight:300;color:var(--text-2);
  letter-spacing:normal;line-height:1.4;max-width:540px;margin-bottom:36px;
}
.home-ctas{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-bottom:56px}
.home-section{width:100%;max-width:900px;margin:0 auto;padding:0 0 48px;text-align:left}
.home-sect-title{
  font-family:-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
  font-size:26px;font-weight:600;letter-spacing:0.2px;line-height:1.14;
  margin-bottom:18px;color:var(--text);
}
.editions-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.edition-card{
  background:var(--surface);border-radius:var(--rl);
  padding:22px;cursor:pointer;
  box-shadow:var(--shadow-s);
  transition:box-shadow var(--tr),transform 0.15s;
  border:1px solid var(--border);
}
.edition-card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.edition-card-date{font-size:11px;color:var(--text-3);letter-spacing:0.3px;margin-bottom:8px;font-weight:700;text-transform:uppercase}
.edition-card-title{
  font-family:-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
  font-size:16px;font-weight:600;letter-spacing:-0.3px;line-height:1.35;
  margin-bottom:10px;color:var(--text);
}
.edition-card-meta{margin-top:12px;display:flex;gap:6px;flex-wrap:wrap}
.meta-chip{font-size:11px;padding:2px 8px;border-radius:var(--rp);background:var(--surface-el);color:var(--text-2)}

/* ===== SECTION TITLES ===== */
.sect-title{
  font-family:-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
  font-size:22px;font-weight:600;letter-spacing:0.1px;line-height:1.2;
  margin-bottom:14px;margin-top:36px;color:var(--text);
  display:flex;align-items:center;gap:10px;
}
.sect-count{font-size:12px;font-weight:400;color:var(--text-3)}

/* ===== DAY VIEW ===== */
.day-header{margin-bottom:28px;padding:28px 40px 0}
.day-breadcrumb{font-size:11px;color:var(--text-3);letter-spacing:0.3px;margin-bottom:6px;font-weight:600;text-transform:uppercase}
.day-date{
  font-family:-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
  font-size:38px;font-weight:600;line-height:1.1;letter-spacing:-0.5px;
  margin-bottom:6px;color:var(--text);
}
.day-meta{font-size:13px;color:var(--text-3);letter-spacing:-0.2px;margin-bottom:20px}
.day-hero-title{
  font-family:-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
  font-size:28px;font-weight:600;line-height:1.15;letter-spacing:-0.3px;
  margin-bottom:10px;color:var(--text);
}
.day-hero-desc{
  font-size:16px;color:var(--text-2);letter-spacing:-0.3px;line-height:1.65;
  max-width:720px;
}
.day-content{padding:0 40px 60px}

/* ===== HIGHLIGHTS ===== */
.hl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.hl-card{
  background:var(--surface);border-radius:var(--rl);
  padding:18px;cursor:pointer;
  box-shadow:var(--shadow-s);
  border:1px solid var(--border);
  transition:box-shadow var(--tr),transform 0.15s;
  display:flex;flex-direction:column;gap:10px;
}
.hl-card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.hl-card-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hl-favicon{width:28px;height:28px;border-radius:7px;object-fit:contain;background:var(--surface-el);flex-shrink:0}
.cat-chip{
  font-size:10px;font-weight:700;padding:3px 9px;border-radius:var(--rp);
  white-space:nowrap;color:#fff;background:var(--cc,var(--accent));
  letter-spacing:0.2px;
}
.hl-title{font-size:15px;font-weight:600;letter-spacing:-0.3px;line-height:1.35;color:var(--text)}
.hl-summary{font-size:13px;color:var(--text-2);letter-spacing:-0.2px;line-height:1.55}
.hl-footer{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-3)}

/* ===== CATEGORY GROUP ===== */
.cat-group{margin-bottom:36px}
.cat-group-hdr{
  display:flex;align-items:center;gap:12px;
  padding:10px 0;margin-bottom:14px;
  border-bottom:1px solid var(--border);
}
.cg-icon{
  width:34px;height:34px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;flex-shrink:0;
  background:color-mix(in srgb,var(--cc,var(--accent)) 15%,transparent);
}
.cg-name{
  font-family:-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
  font-size:22px;font-weight:600;letter-spacing:0px;line-height:1.2;
  color:var(--text);cursor:pointer;
}
.cg-name:hover{color:var(--accent)}
.cg-count{font-size:12px;color:var(--text-3);margin-top:2px}

/* ===== NEWS CARD ===== */
.news-card{
  background:var(--surface);border-radius:var(--r);
  padding:18px 18px 14px;margin-bottom:10px;
  border:1px solid var(--border);
  border-left:4px solid var(--lc,var(--border));
  transition:box-shadow var(--tr);
}
.news-card:hover{box-shadow:var(--shadow-s)}
.news-card.urgent{border-left-color:#FF453A}
.nc-hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:8px}
.nc-title{font-size:16px;font-weight:600;letter-spacing:-0.3px;line-height:1.35;color:var(--text)}
.nc-title a{color:var(--text)}
.nc-title a:hover{color:var(--link);text-decoration:none}
.badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:var(--rp);white-space:nowrap;flex-shrink:0}
.badge-u{background:#FF453A;color:#fff}
.badge-r{background:var(--accent);color:#fff}
.nc-summary{font-size:14px;color:var(--text-2);line-height:1.55;margin-bottom:8px}
.nc-why{
  font-size:13px;color:var(--text-2);
  padding:9px 12px;border-radius:6px;
  background:var(--surface-el);margin-bottom:8px;
  border-left:3px solid var(--accent);
}
.nc-why-lbl{font-size:10px;font-weight:700;letter-spacing:0.6px;text-transform:uppercase;color:var(--accent);margin-bottom:3px}
.nc-footer{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--text-3)}
.nc-source{font-weight:500;color:var(--text-2)}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:11px;padding:2px 7px;border-radius:var(--rp);background:var(--surface-el);color:var(--text-2)}

/* ===== TOOLS GRID ===== */
.tools-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.tool-card{
  background:var(--surface);border-radius:var(--r);
  padding:14px 16px;border:1px solid var(--border);
  display:flex;gap:12px;align-items:flex-start;
  transition:box-shadow var(--tr);cursor:pointer;
}
.tool-card:hover{box-shadow:var(--shadow-s)}
.tc-icon{
  width:38px;height:38px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;overflow:hidden;
  background:color-mix(in srgb,var(--tc,var(--accent)) 15%,transparent);
}
.tc-icon img{width:22px;height:22px;object-fit:contain;display:block}
.tc-body{flex:1;min-width:0}
.tc-name{font-size:13px;font-weight:600;letter-spacing:-0.2px;color:var(--text)}
.tc-ver{font-size:11px;color:var(--accent);font-weight:600;margin-bottom:3px}
.tc-hl{font-size:12px;color:var(--text-2);line-height:1.45;letter-spacing:-0.1px}

/* ===== TIMELINE HERO ===== */
.tl-hero{
  padding:32px 40px 24px;
  display:flex;align-items:center;gap:20px;
  border-bottom:1px solid var(--border);
  margin-bottom:0;
  background:linear-gradient(to bottom,color-mix(in srgb,var(--tc,var(--accent)) 5%,var(--bg)) 0%,var(--bg) 100%);
}
.tl-icon{
  width:60px;height:60px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  font-size:28px;flex-shrink:0;overflow:hidden;
  background:color-mix(in srgb,var(--tc,var(--accent)) 18%,transparent);
}
.tl-icon img{width:36px;height:36px;object-fit:contain;display:block}
.tl-name{
  font-family:-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
  font-size:36px;font-weight:600;letter-spacing:-0.5px;line-height:1.1;color:var(--text);
}
.tl-kind{font-size:13px;color:var(--text-3);letter-spacing:-0.2px;margin-top:3px}

/* ===== TIMELINE LIST ===== */
.tl-list{padding:0 40px 60px}
.tl-item{
  display:flex;gap:20px;padding:18px 0;
  border-bottom:1px solid var(--border);
}
.tl-date{flex-shrink:0;width:44px;text-align:center;padding-top:2px}
.tl-day{font-size:22px;font-weight:600;letter-spacing:-0.5px;color:var(--text);line-height:1}
.tl-mon{font-size:10px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:0.5px}
.tl-content{flex:1;min-width:0}
.tl-title{font-size:16px;font-weight:600;letter-spacing:-0.3px;line-height:1.35;margin-bottom:6px;color:var(--text)}
.tl-title a{color:var(--text)}
.tl-title a:hover{color:var(--link);text-decoration:none}
.tl-summary{font-size:14px;color:var(--text-2);line-height:1.55;margin-bottom:6px}
.tl-why{
  font-size:13px;color:var(--text-2);
  padding:8px 12px;border-radius:6px;
  background:var(--surface-el);margin-bottom:6px;
  border-left:3px solid var(--accent);
}
.tl-why-lbl{font-size:10px;font-weight:700;letter-spacing:0.6px;text-transform:uppercase;color:var(--accent);margin-bottom:3px}
.tl-footer{font-size:12px;color:var(--text-3);display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* ===== CALENDAR ===== */
.cal-title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-month{font-size:13px;font-weight:600;letter-spacing:-0.2px;color:var(--text)}
.cal-nav{
  width:26px;height:26px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;color:var(--text-2);background:var(--surface-el);
  transition:background var(--tr);
}
.cal-nav:hover{background:var(--border)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.cal-wd{font-size:9px;font-weight:700;text-align:center;color:var(--text-3);padding:3px 0;letter-spacing:0.3px;text-transform:uppercase}
.cal-d{
  aspect-ratio:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  font-size:12px;border-radius:5px;position:relative;
  color:var(--text-3);
}
.cal-d.has{color:var(--text);font-weight:600;cursor:pointer}
.cal-d.has:hover{background:var(--surface-el)}
.cal-d.sel{background:var(--accent)!important;color:#fff!important}
.cal-d.today:not(.sel){outline:1.5px solid var(--accent);border-radius:5px}
.cal-dot{width:4px;height:4px;border-radius:50%;background:var(--accent);position:absolute;bottom:2px}
.cal-s-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-3);margin-bottom:8px}

/* ===== QUOTE ===== */
.quote-card{
  background:var(--surface-el);border-radius:var(--rl);
  padding:18px;margin-top:20px;position:relative;overflow:hidden;
}
.quote-wm{
  position:absolute;top:-16px;left:8px;
  font-size:72px;line-height:1;color:var(--border);
  font-family:Georgia,serif;font-weight:700;user-select:none;
}
.quote-text{font-size:13px;line-height:1.65;letter-spacing:-0.15px;color:var(--text);margin-bottom:10px;position:relative;z-index:1;font-style:italic}
.quote-author{font-size:12px;font-weight:600;color:var(--text-2)}
.quote-ctx{font-size:11px;color:var(--text-3);margin-top:3px;letter-spacing:-0.1px;line-height:1.4}
.quote-footer{display:flex;justify-content:flex-end;margin-top:10px}
.btn-nq{
  font-size:11px;color:var(--accent);padding:3px 10px;border-radius:var(--rp);
  border:1px solid var(--accent);transition:all var(--tr);
}
.btn-nq:hover{background:var(--accent);color:#fff}

/* ===== DAY NAV BUTTONS ===== */
.day-nav-btns{display:flex;justify-content:space-between;margin-top:48px;padding-top:20px;border-top:1px solid var(--border)}
.day-nav-btn{
  display:flex;align-items:center;gap:8px;
  padding:9px 18px;border-radius:var(--rp);
  border:1px solid var(--border);font-size:13px;color:var(--link);
  transition:all var(--tr);
}
.day-nav-btn:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}

/* ===== EMPTY STATE ===== */
.empty-state{padding:60px 40px;text-align:center}
.empty-mascot{width:100px;margin:0 auto 20px;opacity:0.6}
.empty-text{font-size:17px;color:var(--text-2)}

/* ===== OVERLAY FOR MOBILE SIDEBAR ===== */
.overlay{
  display:none;position:fixed;inset:0;z-index:150;
  background:rgba(0,0,0,0.4);backdrop-filter:blur(2px);
}
.overlay.on{display:block}

/* ===== RESPONSIVE ===== */
@media(max-width:1280px){:root{--rw:270px}}
@media(max-width:1100px){:root{--sw:210px}}
@media(max-width:960px){
  .app-layout{grid-template-columns:1fr}
  .sidebar-left{
    display:none;position:fixed;left:0;top:var(--nh);width:280px;z-index:160;
    background:var(--surface);border-right:1px solid var(--border);
    height:calc(100vh - var(--nh));border-radius:0 var(--rl) var(--rl) 0;
    box-shadow:var(--shadow);
  }
  .sidebar-left.open{display:flex;flex-direction:column}
  .sidebar-right{display:none}
  .hamburger{display:flex}
  .day-header,.day-content,.tl-list,.tl-hero{padding-left:20px;padding-right:20px}
  .c-pad{padding:24px 20px 60px}
}
@media(max-width:600px){
  .hl-grid,.tools-grid,.editions-grid{grid-template-columns:1fr}
  .home-title{font-size:48px}
  .day-date{font-size:28px}
  .tl-name{font-size:26px}
  .tl-item{gap:14px}
  .tl-date{width:36px}
  .tl-day{font-size:18px}
}
</style>

do ingress-nginx e gitRepo; arquitetos precisam planejar rota para Gateway API e revisar charts de terceiros.","source":"Kubernetes Blog","url":"https://kubernetes.io/blog/2026/03/30/kubernetes-v1-36-sneak-peek/","published_at":"2026-04-22T09:00:00-03:00","read_time":6,"tags":["kubernetes","gateway-api","rootless","ingress-nginx","release"],"image":"https://www.google.com/s2/favicons?domain=kubernetes.io&sz=256"},{"source_array":"news","category":"sec","category_label":"Segurança & IAM","category_icon":"🔐","headline":"Vercel confirma breach via OAuth da Context.ai — ShinyHunters vende dados por US$ 2 milhões","summary":"Detectado em 19 de abril, incidente começou na compromissão da ferramenta Context.ai (OAuth no Google Workspace de um funcionário da Vercel). Atacante assumiu a conta Workspace, acessou ambientes internos e extraiu environment variables marcadas como 'not sensitive' — que incluem, na prática, API keys, tokens, creds de banco e chaves de assinatura usadas como plaintext. Npm packages da Vercel não foram afetados. ShinyHunters anuncia venda dos dados; Vercel recomenda revisar logs e rotacionar qualquer env var 'não sensível' que contenha segredo.","why_it_matters":"Mostra que OAuth apps de terceiros em Google Workspace hoje são um vetor real de supply chain; classificação 'sensitive' de env vars em plataformas gerenciadas vira decisão arquitetural.","source":"The Register","url":"https://www.theregister.com/2026/04/20/vercel_context_ai_security_incident/","published_at":"2026-04-20T14:00:00-03:00","read_time":5,"urgent":true,"severity":"high","tags":["vercel","supply-chain","oauth","breach","shinyhunters"],"image":"https://www.google.com/s2/favicons?domain=theregister.com&sz=256"},{"source_array":"tools","tool_key":"kubernetes","category":"obs","category_label":"Observabilidade & SRE","category_icon":"📈","headline":"Grafana 13 é lançado no GrafanaCON Barcelona com Loki reescrito sobre Kafka","summary":"Na manhã de 21 de abril em Barcelona, Grafana Labs ns?domain=theregister.com&sz=256"},{"category":"sec","category_label":"Segurança & IAM","category_icon":"🔐","urgent":false,"headline":"GitGuardian alerta: env vars 'não sensíveis' da Vercel precisam de investigação em paralelo ao breach","summary":"Análise post-incident mostra que o problema não é só a fatia 'sensitive' — muitas equipes usaram variáveis 'não sensíveis' para configuração de endpoints, feature flags e até tokens secundários. GitGuardian recomenda varredura completa, rotação ampla e revisão do modelo de classificação de segredos em plataformas gerenciadas.","why_it_matters":"Recategorização de segredos costuma ser retroativamente difícil; reforça necessidade de secrets manager externo (Vault, AWS Secrets Manager) em vez de env vars diretas.","source":"GitGuardian Blog","url":"https://blog.gitguardian.com/vercel-april-2026-incident-non-sensitive-environment-variables-need-investigation-too/","published_at":"2026-04-21T10:00:00-03:00","read_time":4,"tags":["vercel","secrets","env-vars","gitguardian"],"image":"https://www.google.com/s2/favicons?domain=gitguardian.com&sz=256"},{"category":"aiops","category_label":"AIOps & Agents","category_icon":"🧠","urgent":false,"headline":"Anthropic testa restringir Claude Code a planos Max de US$100/mês — reversão parcial em 24h","summary":"Em 21-22/abr, página de pricing da Anthropic moveu Claude Code dos planos Pro ($20/mês) para Max ($100 ou $200). Após backlash, a empresa reverteu a landing page e reafirmou que o teste atingia ~2% dos novos signups 'prosumer', sem afetar assinantes Pro/Max existentes. Simon Willison cobriu a confusão em detalhes.","why_it_matters":"Arquitetos com Claude Code em workflows críticos precisam mapear dependência e custo real antes que um teste A/B vire política permanente.","source":"Simon Willison's Weblog","url":"https://simonwillison.net/2026/Apr/22/claude-code-confusion/","published_at":"2026-04-22T08:00:00-03:00","read_time":4,"tags":["anthropic","claude-code","pricing"],"image":"h ory":"ai","category_label":"IA & LLMs","category_icon":"🤖","urgent":false,"headline":"Claude Opus 4.7 GA: melhor em SWE longo, visão reforçada e Claude Design em Labs","summary":"Opus 4.7 tornou-se GA com ganhos em software engineering e tarefas longas. Em paralelo, Anthropic lança Claude Design (Labs) para criar slides, protótipos e one-pagers, e habilita charts/diagramas inline nas respostas do app mobile. Tokenizer novo custa até 1.46× mais tokens em system prompts.","why_it_matters":"SWE longo vira ponto de compra; mas novo tokenizer recalibra todo o orçamento de LLM sem mudar o preço por token.","source":"Anthropic News","url":"https://www.anthropic.com/news/claude-opus-4-7","published_at":"2026-04-16T12:00:00-03:00","read_time":4,"tags":["claude","opus","release","tokenizer"],"image":"https://www.google.com/s2/favicons?domain=anthropic.com&sz=256"},{"category":"ai","category_label":"IA & LLMs","category_icon":"🤖","urgent":false,"headline":"Microsoft lança três modelos de fundação próprios (texto, voz, imagem)","summary":"TechCrunch reporta Microsoft AI anunciando três modelos fundacionais próprios — texto, voz e imagem — reforçando a estratégia de stack multimodal independente do fornecedor OpenAI. Movimento responde à pressão competitiva pós-GPT-6 e à nova família Llama 4.","why_it_matters":"Decisão arquitetural vendor-lock com Microsoft muda com stack multimodal próprio disponível em Azure.","source":"TechCrunch","url":"https://techcrunch.com/2026/04/02/microsoft-takes-on-ai-rivals-with-three-new-foundational-models/","published_at":"2026-04-02T15:00:00-03:00","read_time":5,"tags":["microsoft","foundation-models","multimodal"],"image":"https://www.google.com/s2/favicons?domain=techcrunch.com&sz=256"},{"category":"cloud","category_label":"Cloud","category_icon":"☁️","urgent":false,"headline":"GCP publica release notes de 17/abr — batch diário alimenta mudanças em serviços chave","summary":"Notas do dia 17 (e do 16) consolidam ajustes em produtos managed da GCP. Embora sem um único bombshell, o ritmo contínuo de release notes diárias é o sinal prático a observar para arquitetos multi-cloud que mantêm plataforma sobre GKE/Cloud Run/BigQuery.","why_it_matters":"Cadência diária de mudanças nas cloud torna ADRs 'frozen' inviáveis; arquitetos precisam de pipeline de monitoring de release notes.","source":"mwpro","url":"https://mwpro.co.uk/blog/2026/04/18/gcp-release-notes-april-17-2026/","published_at":"2026-04-18T11:00:00-03:00","read_time":3,"tags":["gcp","release-notes","multicloud"],"image":"https://www.google.com/s2/favicons?domain=mwpro.co.uk&sz=256"},{"category":"cloud","category_label":"Cloud","category_icon":"☁️","urgent":false,"headline":"Cloudflare tem maintenance window em AMS, STL e SEA entre 21 e 22/abr — mínima latência extra","summary":"Sem outage grande, mas status reporta cluster de janelas de manutenção (STL, SEA, AMS) com possível re-routing de tráfego e latência marginal. Log Explorer sofreu degradação em 21/abr — já resolvida. Nada que quebre SLA de borda, mas importante para quem monitora p99 fim a fim.","why_it_matters":"Monitoramento proativo de status page de edge provider precisa virar integração, não bookmark.","source":"Statusfield","url":"https://statusfield.com/services/cloudflare/incidents","published_at":"2026-04-22T00:00:00-03:00","read_time":2,"tags":["cloudflare","cdn","status"],"image":"https://www.google.com/s2/favicons?domain=statusfield.com&sz=256"},{"category":"backend","category_label":"Backend & Runtimes","category_icon":"🔧","urgent":false,"headline":"Wasmtime publica avisos de segurança pós-verificação formal do Cranelift com LLM","summary":"Em release excepcional (9/abr), time Wasmtime usou LLM tools de ponta com Mozilla, UCSD, Akamai e F5 para varrer Cranelift. Encontrou 4 falhas no Winch e 2 no Cranelift — os dois compiladores tier-1 do Wasmtime. Primeira vez que verificação formal assistida por LLM entrega CVEs concretos em runtime WASM em produção.","why_it_matters":"WASM server-side em crescimento (Cloudflare, Fastly, Spin) depende de Wasmtime; arquitetos embutindo WASI devem auditar versões.","source":"Bytecode Alliance","url":"https://bytecodealliance.org/articles/wasmtime-security-advisories","published_at":"2026-04-09T14:00:00-03:00","read_time":6,"tags":["wasmtime","wasm","cranelift","formal-verification"],"image":"https://www.google.com/s2/favicons?domain=bytecodealliance.org&sz=256"},{"category":"integ","category_label":"Integração & Eventos","category_icon":"🔌","urgent":false,"headline":"Envoy Gateway v1.7.2 sai em 17/abr com ajustes em BackendTrafficPolicy e rate limit","summary":"Release patch corrige bound em rateLimit de BackendTrafficPolicy, polimento em APIs Gateway alinhadas ao trabalho Ingress2Gateway 1.0 e ajustes de interop com Gateway API 1.3. Reforça papel do Envoy Gateway como caminho padrão pós-retirada do ingress-nginx.","why_it_matters":"Quem migra de ingress-nginx precisa dessa versão para rate limit confiável em produção.","source":"Envoy Gateway Releases","url":"https://gateway.envoyproxy.io/news/releases/","published_at":"2026-04-17T10:00:00-03:00","read_time":3,"tags":["envoy-gateway","gateway-api","rate-limit"],"image":"https://www.google.com/s2/favicons?domain=gateway.envoyproxy.io&sz=256"},{"category":"frontend","category_label":"Frontend & Web","category_icon":"🎨","urgent":false,"headline":"Next.js 16.2 chega com streaming fixes, lru disk cache de imagem e patches de segurança","summary":"Update abrangente: upgrades de React, melhorias do Turbopack, routing experimental, type checks mais rígidos. Correções: hang de streaming fetch, server actions transform em node_modules, enforcement de maxPostponedStateSize, lru disk cache para imagens, bloqueio de dev websockets sensíveis a privacidade e patch em http-proxy.","why_it_matters":"Stack Next.js em produção ganha lru disk cache (custo de CDN de imagem) e elimina um CVE latente em http-proxy.","source":"Releasebot (Vercel Next.js)","url":"https://releasebot. da TCO e blast radius.","source":"InfoQ","url":"https://www.infoq.com/news/2026/04/istio-ai-multicluster/","published_at":"2026-04-21T10:00:00-03:00","image":"https://www.google.com/s2/favicons?domain=infoq.com&sz=256","tags":["istio","ambient","multicluster","inference"]},{"tool_key":"keycloak","name":"Keycloak","icon":"🔑","kind":"release","version":"26.6.0","headline":"Keycloak 26.6.0 habilita Vault SPI para segredos de clientes e promove JWT Authorization Grant a GA","description":"Secrets de clientes agora podem ser gerenciados e consultados via Vault SPI. JWT Authorization Grant e Federated Client Authentication saem de preview para supported. Kubernetes SAs como IdP JWT sem gerenciar segredos individuais. Novo guia para OAuth 2.0 DPoP (tokens sender-constrained). Truststore automático em K8s/OpenShift.","why_it_matters":"Vault SPI para client secrets fecha gap estrutural — não precisa mais guardar segredo em DB interno do Keycloak.","source":"Keycloak Blog","url":"https://www.keycloak.org/2026/04/keycloak-2660-released","published_at":"2026-04-17T10:00:00-03:00","image":"https://www.google.com/s2/favicons?domain=keycloak.org&sz=256","tags":["keycloak","vault-spi","oauth","dpop","jwt"]},{"tool_key":"vscode","name":"VS Code","icon":"💻","kind":"news","headline":"VS Code consolida-se com Copilot integrado e dev containers em stack híbrida com Claude Code","description":"Análise recente de stack AI coding (The New Stack) mostra padrão dominante em 2026: VS Code + Copilot no IDE para edição diária + Claude Code em terminal para tarefas pesadas. Survey Pragmatic Engineer: Claude Code lidera com 46% de 'most loved'.","why_it_matters":"Decisão stack IDE deixou de ser religião — arquitetos normalizam multi-tool AI coding com roles claros.","source":"The New Stack","url":"https://thenewstack.io/ai-coding-tool-stack/","published_at":"2026-04-21T09:00:00-03:00","image":"https://www.google.com/s2/favicons?domain=thenewstack.io&sz=256","tags":["vscode","copilot","claude-code","ai-coding"]},{"tool_key":"claudecode","name":"Claude Code","icon":"🤖","kind":"news","headline":"Claude Code ganha Auto mode, /effort, /ultrareview e tema 'terminal-matching' — pricing controverso reverte","description":"Update traz Opus 4.7 xhigh, Auto mode para Max, novos controles /effort e /ultrareview, tema visual alinhado ao terminal, menos prompts de permissão, melhor suporte a Windows. Tentativa de restringir Claude Code ao plano Max foi revertida após backlash em 21-22/abr.","why_it_matters":"Para times que padronizaram em Claude Code, ritmo de features segue forte — mas tração comercial da Anthropic gera risco de pricing imprevisível.","source":"Releasebot (Anthropic)","url":"https://releasebot.io/updates/anthropic/claude-code","published_at":"2026-04-21T14:00:00-03:00","image":"https://www.google.com/s2/favicons?domain=releasebot.io&sz=256","tags":["claude-code","opus-4.7","auto-mode","pricing"]},{"tool_key":"ghactions","name":"GitHub Actions","icon":"⚙️","kind":"news","headline":"GitHub Actions promove OIDC custom properties a GA e habilita failover VNET em preview","description":"Early April update adiciona entrypoint/command para service containers (sintaxe Docker Compose), OIDC claims de repo custom properties em GA e failover VNET para Azure subnets secundárias opcionalmente em outra região.","why_it_matters":"OIDC granular por time/produto permite trust policies em cloud sem múltiplas integrações; failover VNET endereça DR para pipelines críticos.","source":"GitHub Changelog","url":"https://github.blog/changelog/2026-04-02-github-actions-early-april-2026-updates/","published_at":"2026-04-02T13:00:00-03:00","image":"https://www.google.com/s2/favicons?domain=github.blog&sz=256","tags":["github-actions","oidc","vnet","service-containers"]},{"tool_key":"databricks","name":"Databricks","icon":"🧱","kind":"news","headline":"Databricks coloca Apache Iceberg v3 em public preview e torna dbt task de primeira classe no Lakeflow Jobs","description":"Iceberg v3 em preview com row-level concurrency, novos tipos e suporte a cargas operacionais. Lakeflow Jobs integra dbt nativamente — teams orquestram transformação ao lado de ingestão num só workflow.","why_it_matters":"Para arquiteturas lakehouse, Iceberg v3 desbloqueia workloads operacionais antes inviáveis em open table formats.","source":"Databricks Blog","url":"https://www.databricks.com/blog/next-era-open-lakehouse-apache-icebergtm-v3-public-preview-databricks","published_at":"2026-04-20T14:00:00-03:00","image":"https://www.google.com/s2/favicons?domain=databricks.com&sz=256","tags":["databricks","iceberg","lakehouse","dbt"]},{"tool_key":"kafka","name":"Apache Kafka","icon":"📨","kind":"news","headline":"Kafka 4.1.0 introduz novo Streams Rebalance Protocol com rebalances incrementais","description":"Cobertura detalhada do Instaclustr em 20/abr sobre o novo protocolo de rebalance em Kafka Streams 4.1: rebalances incrementais, menor latência na recuperação de partições, recovery mais previsível em clusters com alto churn.","why_it_matters":"Janelas de indisponibilidade em deploy de Streams encurtam — SLA de event processing ganha margem.","source":"Instaclustr","url":"https://www.instaclustr.com/blog/whats-new-in-kafka-4-1-0-introducing-the-new-streams-rebalance-protocol/","published_at":"2026-04-20T09:00:00-03:00","image":"https://www.google.com/s2/favicons?domain=instaclustr.com&sz=256","tags":["kafka","streams","rebalance"]},{"tool_key":"springboot","name":"Spring Boot","icon":"🌱","kind":"news","headline":"This Week in Spring (21/abr) consolida 4.0.5 em produção e marcha para 4.1.0-M4","description":"Edição semanal do spring.io confirma Spring Boot 4.0.5 (de 26/mar) como base de produção (Spring Framework 7.0.6, Spring Kafka 4.1.1, Security 7.0.0, Hibernate 7.1.8, Tomcat 11.0.2). Milestone 4.1.0-M4 abre caminho para minor em maio. Baseline JDK 17; recomendados 21 e 25 para virtual threads.","why_it_matters":"Arquitetos com estratégia Spring precisam decidir agora jane
